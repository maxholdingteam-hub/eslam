<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 | Max Marketing</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070706">
<link rel="icon" type="image/png" href="/brand/max-logo-sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Oversized 404 numeral in Max group black and gold */
:root{
  --ink:#070706; --line:rgba(217,180,107,.16); --lime:#d9b46b; --mint:#f6dc9c; --teal:#7d5f2a;
  --text:#efe8da; --mute:#8f8676; --glass-hi:rgba(217,180,107,.28);
  --d-ar:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --b-ar:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --en:"Space Grotesk",system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{font-family:var(--b-ar);min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:64px max(16px,env(safe-area-inset-left,0px))}
html[lang=en] body{font-family:var(--en)}
html[lang=ar] [data-l=en],html[lang=en] [data-l=ar]{display:none!important}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:999px}

.blob{position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;
  background:conic-gradient(from 0deg,#7d5f2a,#d9b46b,#3a2c12,#f6dc9c,#7d5f2a);animation:spin 18s linear infinite}
.blob.a{top:-35vmax;inset-inline-start:-20vmax}
.blob.b{bottom:-40vmax;inset-inline-end:-25vmax;opacity:.18;animation-duration:26s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(1turn)}}

main{position:relative;z-index:1;max-width:620px;text-align:center;display:flex;flex-direction:column;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--en);font-weight:700;letter-spacing:.02em;margin-bottom:12px}
.logo img{width:34px;height:25px;object-fit:contain}
.num{font-family:var(--en);font-weight:700;font-size:clamp(9rem,34vw,17rem);line-height:.9;letter-spacing:-.08em;font-variant-numeric:tabular-nums;
  user-select:none;direction:ltr;margin:0;display:flex}
.num span{display:inline-block;background:linear-gradient(170deg,#f6dc9c 0%,#d9b46b 45%,#7d5f2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 20px 50px rgba(217,180,107,.25));animation:float 4s ease-in-out infinite}
.num span:nth-child(2){animation-delay:-.6s;-webkit-text-stroke:2px var(--lime);background:none;color:transparent}
.num span:nth-child(3){animation-delay:-1.2s}
@keyframes float{50%{transform:translateY(-14px) rotate(-2deg)}}
h1{font-family:var(--d-ar);font-weight:800;font-size:clamp(26px,4.5vw,36px);line-height:1.3;margin:-4px 0 0}
html[lang=en] h1{font-family:var(--en);font-weight:700;letter-spacing:-.02em}
p{color:var(--mute);margin:12px 0 0;max-width:420px;line-height:1.75}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;border:0;transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.p{background:linear-gradient(135deg,#f6dc9c,#d9b46b 50%,#a88a4f);color:var(--ink);box-shadow:0 10px 30px rgba(217,180,107,.25)}
.btn.o{background:rgba(239,232,218,.05);color:var(--text);border:1px solid var(--glass-hi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html[lang=ar] .flip{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){.blob,.num span{animation:none}}
</style>
</head>
<body>
<div class="blob a" aria-hidden="true"></div>
<div class="blob b" aria-hidden="true"></div>
<main>
  <a class="logo" href="/"><img src="/brand/max-logo-sm.png" alt="" width="34" height="25">MAX MARKETING</a>
  <div class="num" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
  <h1><span data-l="ar">هالصفحة ضيّعت الطريق</span><span data-l="en">This page took a wrong turn</span></h1>
  <p><span data-l="ar">الصفحة اللي تدوّر عليها مو موجودة أو انتقلت لمكان ثاني. خلّنا نرجّعك للمسار الصح.</span><span data-l="en">The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</span></p>
  <div class="btns">
    <a class="btn p" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-l="ar">الصفحة الرئيسية</span><span data-l="en">Go home</span>
    </a>
    <button class="btn o" type="button" id="back">
      <svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <span data-l="ar">ارجع</span><span data-l="en">Go back</span>
    </button>
  </div>
</main>
<script>
let l = null; try { l = localStorage.getItem("mm-lang"); } catch(e){}
if (l === "en"){ document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
document.getElementById("back").onclick = () => history.length > 1 ? history.back() : location.assign("/");
</script>
</body>
</html>
