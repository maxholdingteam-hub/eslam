<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}#wrap{position:relative}canvas{display:block}
#ann{position:absolute;inset:0;pointer-events:none}
.n{position:absolute;font-family:Caveat;font-weight:700;color:#4a4236;font-size:30px;white-space:nowrap;transform:translate(-50%,-50%)}
</style></head><body><div id="wrap"><div id="ann"></div></div>
<script src="three.min.js"></script>
<script>
const P=new URLSearchParams(location.search);const MODE=P.get('mode')||'real';const W=+P.get('w')||1080,H=+P.get('h')||1350;
const wrap=document.getElementById('wrap');wrap.style.width=W+'px';wrap.style.height=H+'px';
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(W,H);R.setPixelRatio(1);
wrap.prepend(R.domElement);
const SK0=(new URLSearchParams(location.search).get('mode')==='sketch');if(!SK0){R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.95;}
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(H>W*1.5?40:33,W/H,0.5,2000);
if(H>W*1.5){cam.fov=38;cam.position.set(-62,6,86);cam.lookAt(10,14,2)}else{cam.fov=32;cam.position.set(-64,6.5,84);cam.lookAt(10,12,2)}cam.updateProjectionMatrix();
const SK=MODE==='sketch';
// materials
const M=(c,o={})=>SK?new THREE.MeshBasicMaterial({color:0xf2ece2,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}):new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(c).convertSRGBToLinear(),roughness:.85,metalness:0},o));
const mTrav=M(0xe9dcc4),mDome=M(0xf1e9da,{roughness:.6}),mDark=M(0x3b342b),mGlow=SK?M(0):new THREE.MeshStandardMaterial({color:0x2b1a08,emissive:0xffa64d,emissiveIntensity:2.6,roughness:.9});
const mGround=M(0xc2a57b,{roughness:1}),mPave=M(0xcfc0a4,{roughness:.9}),mGold=SK?M(0):new THREE.MeshStandardMaterial({color:0xd9b46b,metalness:.8,roughness:.35});
const mPalm=M(0x5d4630),mLeaf=M(0x5c6b3a,{roughness:.8});
const G=new THREE.Group();S.add(G);
function add(geo,mat,x,y,z,ry=0,cast=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=cast;m.receiveShadow=true;G.add(m);return m}
function archPath(s,cx,w,y0,hs,apex){s.moveTo(cx-w/2,y0);s.lineTo(cx-w/2,hs);s.quadraticCurveTo(cx-w/2,hs+(apex-hs)*.85,cx,apex);s.quadraticCurveTo(cx+w/2,hs+(apex-hs)*.85,cx+w/2,hs);s.lineTo(cx+w/2,y0);s.lineTo(cx-w/2,y0)}
// ground & plaza
add(new THREE.PlaneGeometry(600,600).rotateX(-Math.PI/2),mGround,0,0,0,0,false);
add(new THREE.BoxGeometry(220,.12,170),mPave,0,.06,60,0,false);
// prayer hall
const HW=36,HD=24,HH=9;
add(new THREE.BoxGeometry(HW,HH,HD),mTrav,0,HH/2,0);
// hall front wall windows (glow) - tall arched windows
for(let i=-3;i<=3;i++){const s=new THREE.Shape();archPath(s,0,2.2,0,4.2,5.6);const g=new THREE.ShapeGeometry(s);add(g,mGlow,i*4.6,1.2,HD/2+.02,0,false)}
// portico front wall with arch holes
const PZ=HD/2+4.5,PH=8.2;
{const s=new THREE.Shape();s.moveTo(-HW/2,0);s.lineTo(HW/2,0);s.lineTo(HW/2,PH);s.lineTo(-HW/2,PH);s.lineTo(-HW/2,0);
 for(let i=-3;i<=3;i++){const h=new THREE.Path();archPath(h,i*4.6,3.4,.35,4.6,6.7);s.holes.push(h)}
 const g=new THREE.ExtrudeGeometry(s,{depth:1.1,bevelEnabled:false});add(g,mTrav,0,0,PZ-1.1);}
add(new THREE.BoxGeometry(HW,.6,4.6),mTrav,0,PH-.3,HD/2+2.2);
// side portico walls
add(new THREE.BoxGeometry(1.1,PH,4.6),mTrav,-HW/2+.55,PH/2,HD/2+2.2);add(new THREE.BoxGeometry(1.1,PH,4.6),mTrav,HW/2-.55,PH/2,HD/2+2.2);
// Najdi crenellations (triangles) on portico & hall parapet
const cr=new THREE.ConeGeometry(.42,.9,4);
for(let x=-HW/2+.6;x<=HW/2-.5;x+=1.2){add(cr,mTrav,x,PH+.45,PZ-.5,Math.PI/4);add(cr,mTrav,x,HH+.45,-HD/2+.4,Math.PI/4)}
for(let z=-HD/2+.6;z<=HD/2+4;z+=1.2){add(cr,mTrav,-HW/2+.4,(z>HD/2?PH:HH)+.45,z,Math.PI/4)}
// drum + dome
add(new THREE.CylinderGeometry(6.6,6.6,2.4,64),mTrav,0,HH+1.2,-1);
{const pts=[];for(let i=0;i<=40;i++){const a=i/40*Math.PI/2;const r=6.3*Math.cos(a);const y=6.3*1.18*Math.sin(a)+Math.pow(i/40,6)*1.4;pts.push(new THREE.Vector2(Math.max(r,0.01),y))}
 add(new THREE.LatheGeometry(pts,96),mDome,0,HH+2.4,-1);}
add(new THREE.CylinderGeometry(.12,.12,2.2,12),mGold,0,HH+2.4+9.9,-1);add(new THREE.SphereGeometry(.4,24,16),mGold,0,HH+2.4+9.4,-1);
// minaret
const MX=HW/2+5,MZ=HD/2+3;
add(new THREE.BoxGeometry(3,24,3),mTrav,MX,12,MZ);
add(new THREE.BoxGeometry(4,.5,4),mTrav,MX,24.25,MZ);
add(new THREE.BoxGeometry(2.3,5,2.3),mTrav,MX,27,MZ);
for(let k=0;k<4;k++){const s=new THREE.Shape();archPath(s,0,1,0,1.4,2.1);add(new THREE.ShapeGeometry(s),mGlow,MX+[0,0,1.16,-1.16][k],25.6,MZ+[1.16,-1.16,0,0][k],[0,Math.PI,Math.PI/2,-Math.PI/2][k],false)}
{const pts=[];for(let i=0;i<=24;i++){const a=i/24*Math.PI/2;pts.push(new THREE.Vector2(Math.max(1.3*Math.cos(a),.01),1.3*1.3*Math.sin(a)+Math.pow(i/24,6)*.5))}add(new THREE.LatheGeometry(pts,48),mDome,MX,29.5,MZ);}
add(new THREE.CylinderGeometry(.07,.07,1.4,8),mGold,MX,31.9,MZ);
for(let y=4;y<22;y+=4.5){const s=new THREE.Shape();archPath(s,0,.8,0,1.6,2.2);add(new THREE.ShapeGeometry(s),mDark,MX,y,MZ+1.52,0,false)}
// palms
function palm(x,z,h){add(new THREE.CylinderGeometry(.22,.32,h,10),mPalm,x,h/2,z);for(let k=0;k<14;k++){const L=k<7?4.2:3.2;const g=new THREE.BoxGeometry(L,.05,.45);g.translate(L/2,0,0);const l=new THREE.Mesh(g,mLeaf);l.position.set(x,h,z);l.rotation.set(0,k/7*Math.PI*2+(k<7?0:.45),k<7?-.95:-.35);l.castShadow=true;G.add(l)}}
[[-34,8,9],[-30,-6,8.5],[34,30,7.5],[-46,38,7.2]].forEach(p=>palm(...p));
// lights & sky
if(!SK){
 const cv=document.createElement('canvas');cv.width=8;cv.height=512;const c=cv.getContext('2d');const gr=c.createLinearGradient(0,0,0,512);
 gr.addColorStop(0,'#2a3858');gr.addColorStop(.4,'#6b7ea6');gr.addColorStop(.72,'#d79a7a');gr.addColorStop(.86,'#f4c28e');gr.addColorStop(1,'#f7d6a6');c.fillStyle=gr;c.fillRect(0,0,8,512);
 const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;S.background=t;
 S.fog=new THREE.Fog(0xe9c39a,120,520);
 S.add(new THREE.HemisphereLight(0x9fb4dc,0x9a7650,.55));
 const sun=new THREE.DirectionalLight(0xffc28a,2.1);sun.position.set(-90,22,-25);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
 Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:200});sun.shadow.bias=-.0004;S.add(sun);
 for(let i=-3;i<=3;i+=2){const pl=new THREE.PointLight(0xffa04a,4.5,14,2);pl.position.set(i*4.6,5.5,HD/2+2.4);S.add(pl)}
 const fl=new THREE.PointLight(0xffc27a,1.2,40,2);fl.position.set(0,1,30);S.add(fl);
}else{
 S.background=new THREE.Color(0xf2ece2);G.children.forEach(m=>{if(m.geometry&&m.geometry.type==='PlaneGeometry')m.visible=false});
 const lm1=new THREE.LineBasicMaterial({color:0x3a342b}),lm2=new THREE.LineBasicMaterial({color:0x3a342b,transparent:true,opacity:.35});
 G.children.slice().forEach(m=>{if(!m.geometry||m.geometry.type==='PlaneGeometry')return;const e=new THREE.EdgesGeometry(m.geometry,22);
  const l=new THREE.LineSegments(e,lm1);l.position.copy(m.position);l.rotation.copy(m.rotation);l.scale.copy(m.scale);G.add(l);
  const e2=e.clone();const a=e2.attributes.position;for(let i=0;i<a.count;i++){a.setXYZ(i,a.getX(i)+(Math.random()-.5)*.06,a.getY(i)+(Math.random()-.5)*.06,a.getZ(i)+(Math.random()-.5)*.06)}
  const l2=new THREE.LineSegments(e2,lm2);l2.position.copy(m.position);l2.rotation.copy(m.rotation);G.add(l2);});
 const hullM=new THREE.MeshBasicMaterial({color:0x3a342b,side:THREE.BackSide});
 G.children.slice().forEach(m=>{if(!m.isMesh||!m.geometry||m.geometry.type==='PlaneGeometry'||m.geometry.type==='ShapeGeometry')return;if(!['LatheGeometry','CylinderGeometry','SphereGeometry'].includes(m.geometry.type))return;
  const h=new THREE.Mesh(m.geometry,hullM);h.position.copy(m.position);h.rotation.copy(m.rotation);h.scale.setScalar(1.025);G.add(h)});
 [[0,HH+2.4,-1,6.3,1.18,1.4],[MX,29.5,MZ,1.3,1.3,.5]].forEach(([cx,cy,cz,R0,k,pk])=>{for(let j=0;j<12;j++){const th=j/12*Math.PI*2;const pts=[];for(let i=0;i<=30;i++){const a=i/30*Math.PI/2;const r=R0*Math.cos(a);const y=R0*k*Math.sin(a)+Math.pow(i/30,6)*pk;pts.push(new THREE.Vector3(cx+r*Math.cos(th),cy+y,cz+r*Math.sin(th)))}G.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm2))}
  for(const f of [.25,.55]){const a=f*Math.PI/2;const r=R0*Math.cos(a),y=R0*k*Math.sin(a);const pts=[];for(let i=0;i<=64;i++){const th=i/64*Math.PI*2;pts.push(new THREE.Vector3(cx+r*Math.cos(th),cy+y,cz+r*Math.sin(th)))}G.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm2))}});
 // horizon + construction lines
 const hz=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-400,0,-150),new THREE.Vector3(400,0,-150)]);G.add(new THREE.Line(hz,lm2));
 [[-HW/2,0,PZ],[HW/2,0,PZ]].forEach(p=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p[0],-.5,p[2]+8),new THREE.Vector3(p[0],14,p[2])]);G.add(new THREE.Line(g,lm2))});
}
R.render(S,cam);
// annotations (sketch)
if(SK){const ann=document.getElementById('ann');const sv=document.createElementNS('http://www.w3.org/2000/svg','svg');sv.setAttribute('width',W);sv.setAttribute('height',H);sv.style.position='absolute';ann.appendChild(sv);
 const pj=(x,y,z)=>{const v=new THREE.Vector3(x,y,z).project(cam);return[(v.x+1)/2*W,(1-v.y)/2*H]};
 const line=(a,b,dash)=>{const l=document.createElementNS(sv.namespaceURI,'line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('stroke','#5a5042');l.setAttribute('stroke-width','1.4');if(dash)l.setAttribute('stroke-dasharray','6 5');sv.appendChild(l)};
 const note=(txt,anchor,dx,dy)=>{const a=pj(...anchor);const b=[a[0]+dx,a[1]+dy];line(a,b);const d=document.createElement('div');d.className='n';d.textContent=txt;d.style.left=b[0]+'px';d.style.top=(b[1]+(dy<0?-18:18))+'px';ann.appendChild(d)};
 note('dome Ø 12.6 m',[0,HH+8,-1],-140,-90);
 note('minaret  h = 32 m',[MX-1.5,27,MZ],-150,-40);
 note('pointed arches · 3.4 m',[ -4.6,6.7,PZ],-160,120);
 note('travertine cladding',[HW/2-4,3,PZ],20,150);
 note('najdi crenellations',[-10,PH+.8,PZ-.5],-120,-110);
 const a=pj(-HW/2,-.2,PZ+3),b=pj(HW/2,-.2,PZ+3);line(a,b);line([a[0],a[1]-10],[a[0],a[1]+10]);line([b[0],b[1]-10],[b[0],b[1]+10]);
 const d=document.createElement('div');d.className='n';d.textContent='36.00 m';d.style.left=((a[0]+b[0])/2)+'px';d.style.top=((a[1]+b[1])/2+24)+'px';ann.appendChild(d);
}
document.title='ready';
</script></body></html>
