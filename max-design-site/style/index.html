<style>
:root{--bg:#070605;--panel:#100e0b;--line:rgba(217,180,107,.2);--fg:#f2ece1;--mute:#a99d88;--gold:#d9b46b;--gold-l:#f6dc9c;--gold-d:#7d5f2a;
  --ar:"IBM Plex Sans Arabic",system-ui,sans-serif;--disp:"Amiri",serif;--en:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;font-family:var(--ar);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.foil{background:linear-gradient(180deg,#fff1c6,#f0cf82 35%,#c99a45 65%,#f3d68f);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%,rgba(217,180,107,.12),transparent 70%)}

.top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(7,6,5,.95),rgba(7,6,5,0))}
.top a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-size:14px}
.top .home{font-family:var(--en);font-weight:600;letter-spacing:.24em;font-size:12px;direction:ltr;color:var(--gold-l)}
.top .home img{width:30px;height:auto}
.top .back{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(12,11,9,.6)}
.top .back:hover{border-color:var(--gold)}

main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:96px max(18px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.screen{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* intro */
.intro{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:calc(100dvh - 160px)}
.intro .k{font-family:var(--en);font-size:12px;letter-spacing:.36em;color:var(--gold);direction:ltr;text-align:right}
.intro h1{font-family:var(--disp);font-size:clamp(46px,7vw,86px);line-height:1.2;margin:10px 0 14px;text-wrap:balance}
.intro p{font-size:18px;line-height:1.9;color:#ddd3c2;max-width:46ch}
.intro .meta{display:flex;flex-wrap:wrap;gap:18px;margin:22px 0 30px;color:var(--mute);font-size:14.5px}
.intro .meta b{color:var(--gold-l);font-family:var(--en)}
.stack{position:relative;aspect-ratio:4/5;max-width:440px;width:100%;justify-self:center}
.stack img{position:absolute;width:62%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.stack img:nth-child(1){top:0;right:0;transform:rotate(4deg)}
.stack img:nth-child(2){top:18%;left:0;transform:rotate(-5deg)}
.stack img:nth-child(3){bottom:0;right:16%;transform:rotate(2deg)}
.go{display:inline-flex;align-items:center;gap:14px;padding:16px 34px;border:0;border-radius:999px;cursor:pointer;font-size:18px;font-weight:700;color:#1a1206;background:linear-gradient(180deg,#f7dd9d,#d4a650 60%,#b9893a);box-shadow:0 14px 34px rgba(217,180,107,.28);transition:transform .25s}
.go:hover{transform:translateY(-2px)}
.ghost{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;cursor:pointer;font-size:16px;font-weight:600;color:var(--gold-l);background:transparent;border:1px solid var(--gold-d);text-decoration:none}
.ghost:hover{border-color:var(--gold)}
@media(max-width:820px){.intro{grid-template-columns:1fr;text-align:center;min-height:0;gap:28px}.intro .k{text-align:center}.intro p{margin:0 auto}.intro .meta{justify-content:center}.stack{max-width:320px;order:-1}}

/* question */
.prog{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.bar{flex:1;height:3px;background:rgba(217,180,107,.15);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog span{font-family:var(--en);font-size:13px;color:var(--mute);direction:ltr;min-width:44px;text-align:left}
.prog button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:14px}
.prog button:hover{color:var(--gold-l)}
.qh{font-family:var(--disp);font-size:clamp(32px,4.6vw,52px);line-height:1.3;margin-bottom:6px;text-wrap:balance}
.qs{color:var(--mute);margin-bottom:26px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:720px){.opts{grid-template-columns:1fr;gap:12px}}
.opt{position:relative;display:flex;flex-direction:column;text-align:right;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);cursor:pointer;padding:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.opt:hover{transform:translateY(-4px);border-color:rgba(217,180,107,.6);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.opt.picked{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 20px 40px rgba(0,0,0,.5)}
.opt .im{aspect-ratio:3/4;overflow:hidden}
.opt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.opt:hover img{transform:scale(1.05)}
.opt .lb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.opt .lb b{font-size:17px;font-weight:600}
.opt .lb i{font-style:normal;width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--gold-d);display:grid;place-items:center;color:var(--gold);font-size:13px}
.opt.picked .lb i{background:var(--gold);color:#1a1206}
@media(max-width:720px){.opt{flex-direction:row}.opt .im{width:42%;aspect-ratio:1/1;flex:none}.opt .lb{flex:1}}
/* palette option */
.pal{display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:3/4}
.pal span{display:block}
@media(max-width:720px){.pal{width:42%;flex:none;aspect-ratio:1/1}}

/* result */
.res{display:grid;grid-template-columns:.95fr 1.05fr;gap:40px;align-items:start}
@media(max-width:860px){.res{grid-template-columns:1fr;gap:26px}}
.mood{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:1/1}
.mood img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.mood img:first-child{grid-row:1/3}
.res .k{font-size:15px;color:var(--mute)}
.res h2{font-family:var(--disp);font-size:clamp(46px,6.6vw,78px);line-height:1.15;margin:4px 0 6px}
.res .en{font-family:var(--en);font-weight:600;letter-spacing:.3em;font-size:12px;color:var(--gold);direction:ltr;text-align:right}
.res .d{font-size:17.5px;line-height:1.9;color:#ddd3c2;margin:18px 0 22px;max-width:52ch}
.sw{display:flex;gap:10px;margin-bottom:22px}
.sw span{width:46px;height:46px;border-radius:10px;border:1px solid var(--line)}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;margin-bottom:28px}
.mats div{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.mats div b{display:block;color:var(--gold-l);font-weight:600}
.mats div small{color:var(--mute)}
.act{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.score{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.score div{display:grid;grid-template-columns:110px 1fr 40px;gap:12px;align-items:center;font-size:14px;color:var(--mute)}
.score .b{height:4px;border-radius:2px;background:rgba(217,180,107,.12);overflow:hidden}
.score .b i{display:block;height:100%;background:var(--gold)}
.score em{font-style:normal;font-family:var(--en);direction:ltr;text-align:left}

/* type cards */
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media(max-width:900px){.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.types{grid-template-columns:repeat(2,minmax(0,1fr))}}
.type{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);cursor:pointer;padding:0;text-align:right;aspect-ratio:3/4;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s}
.type:hover{transform:translateY(-4px);border-color:rgba(217,180,107,.6)}
.type img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;transition:opacity .4s,transform .8s}
.type:hover img{opacity:.95;transform:scale(1.05)}
.type::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(7,6,5,.92))}
.type span{position:absolute;z-index:1;inset:auto 14px 14px 14px;font-weight:700;font-size:18px}
.type small{display:block;font-weight:500;font-size:12.5px;color:var(--mute)}
/* feature chips */
.feats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.feat{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-size:15.5px;transition:all .25s}
.feat i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--gold-d);display:grid;place-items:center;font-size:11px;color:transparent;transition:all .25s}
.feat[aria-pressed="true"]{border-color:var(--gold);background:rgba(217,180,107,.1);color:var(--gold-l)}
.feat[aria-pressed="true"] i{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.feat:hover{border-color:rgba(217,180,107,.6)}
.grp{margin-bottom:26px}
.grp h3{font-size:17px;font-weight:600;margin-bottom:12px;color:#e8dfcf}
.next{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* project summary */
.brief{border:1px solid var(--gold-d);border-radius:16px;padding:18px 20px;margin:0 0 24px;background:radial-gradient(500px 200px at 100% 0%,rgba(217,180,107,.08),transparent),var(--panel)}
.brief h3{font-size:15px;color:var(--gold);font-weight:600;margin-bottom:10px}
.brief dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.brief dt{color:var(--mute)}
.brief dd{margin:0}
footer{margin-top:50px;font-family:var(--en);font-size:11px;letter-spacing:.24em;color:#6f6656;direction:ltr;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function intro(){reset();app.innerHTML=`<section class="screen intro">
  <div><div class="k">MAX DESIGN · STYLE FINDER</div><h1>اكتشف <span class="foil">ستايلك</span></h1>
  <p>اختار نوع مشروعك، وجاوب بالصور على أسئلة بسيطة عن ذوقك واللي تحتاجه، وفي الآخر نقولك ستايل التصميم اللي يناسبك ونجهّز لك ملخص مشروعك تبعته لنا بضغطة.</p>
  <div class="meta"><span><b>2</b> دقيقة</span><span>شقق · فلل · قصور · شركات · محلات</span><span>بدون تسجيل</span></div>
  <button class="go" id="start" type="button">ابدأ <span aria-hidden="true">←</span></button></div>
  <div class="stack" aria-hidden="true"><img src="${im('living-m')}" alt=""><img src="${im('facade-c')}" alt=""><img src="${im('living-d')}" alt=""></div></section>`;
 document.getElementById('start').onclick=typeQ;}
function typeQ(){st.type=null;app.innerHTML=`<section class="screen">${prog(0)}<h2 class="qh">إيش نوع مشروعك؟</h2><p class="qs">الأسئلة الجاية بتتغير حسب اختيارك.</p>
 <div class="types">${Object.entries(T).map(([k,t])=>`<button class="type" type="button" data-k="${k}"><img src="${t.img}" alt=""><span>${t.ar}<small>${t.sub}</small></span></button>`).join('')}</div></section>`;
 app.querySelectorAll('.type').forEach(b=>b.onclick=()=>{st.type=b.dataset.k;st.step=1;st.ans=[];st.feats=[];render()});
 const p=document.getElementById('prev');if(p)p.onclick=()=>{intro()};
 requestAnimationFrame(()=>{const b=app.querySelector('.bar i');b&&(b.style.width=(1/7*100)+'%')});scrollTo({top:0,behavior:'smooth'});}
function render(){const t=T[st.type],qn=t.qs.length;
 if(st.step<=qn)return pic(t.qs[st.step-1]);
 if(st.step===qn+1)return feats();
 if(st.step===qn+2)return details();
 result();}
function pic(key){const it=PQ[key],n=st.step;
 app.innerHTML=`<section class="screen">${prog(n)}<h2 class="qh">${it.q}</h2><p class="qs">${it.s}</p>
 <div class="opts">${['m','c','d'].map((k,i)=>`<button class="opt${st.ans[n-1]===k?' picked':''}" type="button" data-k="${k}">${it.pal?`<div class="pal">${S[k].sw.map(c=>`<span style="background:${c}"></span>`).join('')}</div>`:`<div class="im"><img src="${im(it.img+'-'+k)}" alt="${esc(it.o[k])}"></div>`}<div class="lb"><b>${it.o[k]}</b><i aria-hidden="true">${['أ','ب','ج'][i]}</i></div></button>`).join('')}</div></section>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{b.classList.add('picked');st.ans[n-1]=b.dataset.k;setTimeout(()=>{st.step++;render()},300)});
 wire(n);}
function feats(){const t=T[st.type],n=st.step;
 app.innerHTML=`<section class="screen">${prog(n)}<h2 class="qh">إيش تبي يكون في ${t.ar}؟</h2><p class="qs">اختار كل اللي تحتاجه، تقدر تختار أكثر من شي.</p>
 <div class="feats">${t.feats.map(f=>`<button class="feat" type="button" aria-pressed="${st.feats.includes(f)}" data-f="${esc(f)}"><i aria-hidden="true">✓</i>${f}</button>`).join('')}</div>
 <div class="next"><button class="go" type="button" id="nx">التالي <span aria-hidden="true">←</span></button><span class="qs" style="margin:0" id="cnt"></span></div></section>`;
 const cnt=()=>document.getElementById('cnt').textContent=st.feats.length?`اخترت ${st.feats.length}`:'ممكن تتخطى لو مو متأكد';cnt();
 app.querySelectorAll('.feat').forEach(b=>b.onclick=()=>{const f=b.dataset.f,on=st.feats.includes(f);st.feats=on?st.feats.filter(x=>x!==f):st.feats.concat(f);b.setAttribute('aria-pressed',!on);cnt()});
 document.getElementById('nx').onclick=()=>{st.step++;render()};wire(n);}
function chips(name,list,val){return `<div class="feats" role="radiogroup">${list.map(v=>`<button class="feat" type="button" role="radio" data-g="${name}" aria-pressed="${val===v}" aria-checked="${val===v}" data-v="${esc(v)}"><i aria-hidden="true">✓</i>${v}</button>`).join('')}</div>`}
function details(){const t=T[st.type],n=st.step;
 app.innerHTML=`<section class="screen">${prog(n)}<h2 class="qh">آخر شي: تفاصيل المشروع</h2><p class="qs">عشان نجهّز لك ملخص واضح.</p>
 <div class="grp"><h3>المساحة التقريبية</h3>${chips('area',t.area,st.area)}</div>
 <div class="grp"><h3>وين وصل المشروع؟</h3>${chips('stage',STAGE,st.stage)}</div>
 <div class="grp"><h3>إيش تحتاج منا؟</h3>${chips('svc',SVC,st.svc)}</div>
 <div class="next"><button class="go" type="button" id="nx">شوف ستايلك <span aria-hidden="true">←</span></button></div></section>`;
 app.querySelectorAll('.feat[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;st[g]=b.dataset.v;app.querySelectorAll(`.feat[data-g="${g}"]`).forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on);x.setAttribute('aria-checked',on)})});
 document.getElementById('nx').onclick=()=>{st.step++;render()};wire(n);}
function result(){const t=T[st.type],c={m:0,c:0,d:0};st.ans.forEach(a=>c[a]++);
 const k=Object.keys(c).sort((a,b)=>c[b]-c[a]||st.ans.indexOf(a)-st.ans.indexOf(b))[0],r=S[k],N=st.ans.length;
 const pics=t.qs.filter(q=>PQ[q].img).map(q=>im(PQ[q].img+'-'+k)).slice(0,3);
 const lines=[`السلام عليكم، سويت اختبار الستايل في موقعكم:`,`نوع المشروع: ${t.ar}`,`الستايل: ${r.name}`];
 if(st.feats.length)lines.push(`أبي فيه: ${st.feats.join('، ')}`);
 if(st.area)lines.push(`المساحة: ${st.area}`);if(st.stage)lines.push(`المرحلة: ${st.stage}`);if(st.svc)lines.push(`الخدمة: ${st.svc}`);
 lines.push('أبغى أتواصل معكم بخصوص المشروع.');
 const row=(a,b)=>b?`<dt>${a}</dt><dd>${esc(b)}</dd>`:'';
 app.innerHTML=`<section class="screen res">
  <div class="mood">${pics.map(s=>`<img src="${s}" alt="">`).join('')}</div>
  <div><div class="k">ستايل ${t.ar} اللي يناسبك</div><h2 class="foil">${r.name}</h2><div class="en">${r.en}</div>
   <p class="d">${r.d}</p>
   <div class="sw">${r.sw.map(x=>`<span style="background:${x}" title="${x}"></span>`).join('')}</div>
   <div class="mats">${r.mats.map(m=>`<div><b>${m[0]}</b><small>${m[1]}</small></div>`).join('')}</div>
   <div class="brief"><h3>ملخص مشروعك</h3><dl>${row('النوع',t.ar)}${row('الستايل',r.name)}${row('يشمل',st.feats.join('، '))}${row('المساحة',st.area)}${row('المرحلة',st.stage)}${row('الخدمة',st.svc)}</dl></div>
   <div class="score">${Object.keys(S).map(x=>`<div><span>${S[x].name}</span><div class="b"><i style="width:${c[x]/N*100}%"></i></div><em>${Math.round(c[x]/N*100)}%</em></div>`).join('')}</div>
   <div class="act"><a class="go" href="https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}" target="_blank" rel="noopener">ابعت ملخص مشروعك واتساب <span aria-hidden="true">←</span></a>
   <button class="ghost" type="button" id="again">أعد الاختبار</button><a class="ghost" href="/#work">شوف أعمالنا</a></div>
  </div></section><footer>© MAX DESIGN · RIYADH</footer>`;
 document.getElementById('again').onclick=intro;scrollTo({top:0,behavior:'smooth'});}
/* warm the image cache so questions show instantly */
setTimeout(()=>{Object.values(PQ).forEach(q=>q.img&&['m','c','d'].forEach(k=>{const i=new Image();i.src=im(q.img+'-'+k)}))},800);
intro();
</script>
</body>
</html>
