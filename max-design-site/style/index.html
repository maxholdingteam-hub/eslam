<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اكتشف ستايلك | Max Design · ماكس ديزاين</title>
<meta name="description" content="5 أسئلة بالصور تعرف بعدها ستايل التصميم الداخلي اللي يناسبك: مودرن هادئ، كلاسيك فرنسي، أو فخامة داكنة. من ماكس ديزاين، الرياض.">
<meta name="theme-color" content="#070605">
<link rel="icon" href="/img/logo.png">
<link rel="apple-touch-icon" href="/img/logo.png">
<link rel="canonical" href="https://maxdesign.sa/style/">
<meta property="og:type" content="website">
<meta property="og:title" content="اكتشف ستايلك | Max Design">
<meta property="og:description" content="5 أسئلة بالصور تعرف بعدها ستايل بيتك.">
<meta property="og:url" content="https://maxdesign.sa/style/">
<meta property="og:image" content="https://maxdesign.sa/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070605;--panel:#100e0b;--line:rgba(217,180,107,.2);--fg:#f2ece1;--mute:#a99d88;--gold:#d9b46b;--gold-l:#f6dc9c;--gold-d:#7d5f2a;
  --ar:"IBM Plex Sans Arabic",system-ui,sans-serif;--disp:"Amiri",serif;--en:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;font-family:var(--ar);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.foil{background:linear-gradient(180deg,#fff1c6,#f0cf82 35%,#c99a45 65%,#f3d68f);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%,rgba(217,180,107,.12),transparent 70%)}

.top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(7,6,5,.95),rgba(7,6,5,0))}
.top a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-size:14px}
.top .home{font-family:var(--en);font-weight:600;letter-spacing:.24em;font-size:12px;direction:ltr;color:var(--gold-l)}
.top .home img{width:30px;height:auto}
.top .back{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(12,11,9,.6)}
.top .back:hover{border-color:var(--gold)}

main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:96px max(18px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.screen{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* intro */
.intro{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:calc(100dvh - 160px)}
.intro .k{font-family:var(--en);font-size:12px;letter-spacing:.36em;color:var(--gold);direction:ltr;text-align:right}
.intro h1{font-family:var(--disp);font-size:clamp(46px,7vw,86px);line-height:1.2;margin:10px 0 14px;text-wrap:balance}
.intro p{font-size:18px;line-height:1.9;color:#ddd3c2;max-width:46ch}
.intro .meta{display:flex;flex-wrap:wrap;gap:18px;margin:22px 0 30px;color:var(--mute);font-size:14.5px}
.intro .meta b{color:var(--gold-l);font-family:var(--en)}
.stack{position:relative;aspect-ratio:4/5;max-width:440px;width:100%;justify-self:center}
.stack img{position:absolute;width:62%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.stack img:nth-child(1){top:0;right:0;transform:rotate(4deg)}
.stack img:nth-child(2){top:18%;left:0;transform:rotate(-5deg)}
.stack img:nth-child(3){bottom:0;right:16%;transform:rotate(2deg)}
.go{display:inline-flex;align-items:center;gap:14px;padding:16px 34px;border:0;border-radius:999px;cursor:pointer;font-size:18px;font-weight:700;color:#1a1206;background:linear-gradient(180deg,#f7dd9d,#d4a650 60%,#b9893a);box-shadow:0 14px 34px rgba(217,180,107,.28);transition:transform .25s}
.go:hover{transform:translateY(-2px)}
.ghost{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;cursor:pointer;font-size:16px;font-weight:600;color:var(--gold-l);background:transparent;border:1px solid var(--gold-d);text-decoration:none}
.ghost:hover{border-color:var(--gold)}
@media(max-width:820px){.intro{grid-template-columns:1fr;text-align:center;min-height:0;gap:28px}.intro .k{text-align:center}.intro p{margin:0 auto}.intro .meta{justify-content:center}.stack{max-width:320px;order:-1}}

/* question */
.prog{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.bar{flex:1;height:3px;background:rgba(217,180,107,.15);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog span{font-family:var(--en);font-size:13px;color:var(--mute);direction:ltr;min-width:44px;text-align:left}
.prog button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:14px}
.prog button:hover{color:var(--gold-l)}
.qh{font-family:var(--disp);font-size:clamp(32px,4.6vw,52px);line-height:1.3;margin-bottom:6px;text-wrap:balance}
.qs{color:var(--mute);margin-bottom:26px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:720px){.opts{grid-template-columns:1fr;gap:12px}}
.opt{position:relative;display:flex;flex-direction:column;text-align:right;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);cursor:pointer;padding:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.opt:hover{transform:translateY(-4px);border-color:rgba(217,180,107,.6);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.opt.picked{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 20px 40px rgba(0,0,0,.5)}
.opt .im{aspect-ratio:3/4;overflow:hidden}
.opt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.opt:hover img{transform:scale(1.05)}
.opt .lb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.opt .lb b{font-size:17px;font-weight:600}
.opt .lb i{font-style:normal;width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--gold-d);display:grid;place-items:center;color:var(--gold);font-size:13px}
.opt.picked .lb i{background:var(--gold);color:#1a1206}
@media(max-width:720px){.opt{flex-direction:row}.opt .im{width:42%;aspect-ratio:1/1;flex:none}.opt .lb{flex:1}}
/* palette option */
.pal{display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:3/4}
.pal span{display:block}
@media(max-width:720px){.pal{width:42%;flex:none;aspect-ratio:1/1}}

/* result */
.res{display:grid;grid-template-columns:.95fr 1.05fr;gap:40px;align-items:start}
@media(max-width:860px){.res{grid-template-columns:1fr;gap:26px}}
.mood{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:1/1}
.mood img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.mood img:first-child{grid-row:1/3}
.res .k{font-size:15px;color:var(--mute)}
.res h2{font-family:var(--disp);font-size:clamp(46px,6.6vw,78px);line-height:1.15;margin:4px 0 6px}
.res .en{font-family:var(--en);font-weight:600;letter-spacing:.3em;font-size:12px;color:var(--gold);direction:ltr;text-align:right}
.res .d{font-size:17.5px;line-height:1.9;color:#ddd3c2;margin:18px 0 22px;max-width:52ch}
.sw{display:flex;gap:10px;margin-bottom:22px}
.sw span{width:46px;height:46px;border-radius:10px;border:1px solid var(--line)}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;margin-bottom:28px}
.mats div{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.mats div b{display:block;color:var(--gold-l);font-weight:600}
.mats div small{color:var(--mute)}
.act{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.score{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.score div{display:grid;grid-template-columns:110px 1fr 40px;gap:12px;align-items:center;font-size:14px;color:var(--mute)}
.score .b{height:4px;border-radius:2px;background:rgba(217,180,107,.12);overflow:hidden}
.score .b i{display:block;height:100%;background:var(--gold)}
.score em{font-style:normal;font-family:var(--en);direction:ltr;text-align:left}
footer{margin-top:50px;font-family:var(--en);font-size:11px;letter-spacing:.24em;color:#6f6656;direction:ltr;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="top"><a class="back" href="/">→ <span>الرئيسية</span></a><a class="home" href="/"><span>MAX DESIGN</span><img src="/img/logo.png" alt=""></a></header>
<main id="app" aria-live="polite"></main>

<script>
const WA='966579277975';
const S={
 m:{name:'مودرن هادئ',en:'CALM MODERN',d:'تحب البساطة اللي فيها دفا: خطوط نظيفة، ألوان ترابية فاتحة، وخامات طبيعية زي الخشب والترافرتين، مع إضاءة مخفية تريح العين. بيت هادي ومرتب ويعيش معاك سنين.',
   sw:['#efe6d8','#d8c3a5','#b08d68','#7a5c43','#3e2f24'],
   mats:[['خشب الجوز','شرائح على الجدران وخلف السرير'],['حجر الترافرتين','طاولات وأرضيات'],['أقمشة الكتان','بيج ورملي'],['إضاءة مخفية','دافية في الأسقف والجدران']],
   img:['m-living','m-bed','m-dining']},
 c:{name:'كلاسيك فرنسي',en:'FRENCH CLASSIC',d:'ذوقك ملكي وخالد: بانوهات وزخارف على الجدران، أثاث منحوت بأقمشة كابتونيه، ثريات كريستال، وألوان عاجية مع لمسات ذهب. بيت فيه هيبة وفخامة ما تروح موضتها.',
   sw:['#f3ead8','#e2d2b5','#c9a96e','#8a6a42','#5b6b80'],
   mats:[['بانوهات وزخارف','جدران وأسقف بإطارات بارزة'],['خشب منحوت','كنب وكراسي وسفرة'],['كريستال وذهب','ثريات وإضاءات جدارية'],['رخام بيج مطعّم','أرضيات بتطعيمات']],
   img:['c-living','c-bed','c-dining']},
 d:{name:'فخامة داكنة',en:'DARK LUXURY',d:'تحب الحضور القوي: رخام أسود بعروق ذهبي، إضاءة درامية، وتفاصيل نحاسية ومخمل غامق. مساحة تبهر أي ضيف من أول ما يدخل.',
   sw:['#0e0c0a','#2a2420','#5a4632','#b08840','#e8c879'],
   mats:[['رخام أسود','بعروق ذهبية على الجدران والأرضيات'],['نحاس مصقول','إطارات وتفاصيل وإضاءة'],['مخمل غامق','كنب وكراسي وخلفيات أسرّة'],['إضاءة درامية','خطية ومخفية بدرجات دافية']],
   img:['d-living','d-bed','d-dining']}
};
const Q=[
 {q:'أنهي مجلس تحس إنه بيتك؟',s:'اختار اللي يشدك من أول نظرة.',o:[['m','m-living','بسيط ودافي'],['c','c-living','ملكي بزخارف'],['d','d-living','غامق وفخم']]},
 {q:'وغرفة النوم؟',s:'المكان اللي ترتاح فيه آخر اليوم.',o:[['m','m-bed','هادية وطبيعية'],['c','c-bed','كلاسيكية ناعمة'],['d','d-bed','دافية ودرامية']]},
 {q:'وسفرة العزايم؟',s:'تخيّل عزيمة العيد عندك.',o:[['m','m-dining','عصرية ومريحة'],['c','c-dining','فخمة ومنحوتة'],['d','d-dining','سوداء وذهبي']]},
 {q:'أنهي ألوان تريحك؟',s:'لوحة الألوان اللي تحب تعيش وسطها.',o:[['m','pal','ترابية فاتحة'],['c','pal','عاجي وذهبي'],['d','pal','أسود ونحاسي']]},
 {q:'وأنهي خامات تحب تلمسها؟',s:'آخر سؤال.',o:[['m','mat-m','خشب وحجر طبيعي'],['c','mat-c','زخارف وحرير'],['d','mat-d','رخام أسود ونحاس']]}
];
const app=document.getElementById('app');
const img=k=>`/img/style/${k}.webp`;
let i=0,ans=[];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function intro(){app.innerHTML=`<section class="screen intro">
  <div><div class="k">MAX DESIGN · STYLE FINDER</div><h1>اكتشف <span class="foil">ستايلك</span></h1>
  <p>5 أسئلة بالصور، تختار فيها اللي يعجبك من غير ما تفكر كتير، وفي الآخر نقولك ستايل التصميم اللي يناسبك وألوانه وخاماته.</p>
  <div class="meta"><span><b>5</b> أسئلة</span><span><b>1</b> دقيقة</span><span>بدون تسجيل</span></div>
  <button class="go" id="start" type="button">ابدأ الاختبار <span aria-hidden="true">←</span></button></div>
  <div class="stack" aria-hidden="true"><img src="${img('m-living')}" alt=""><img src="${img('c-living')}" alt=""><img src="${img('d-living')}" alt=""></div></section>`;
 document.getElementById('start').onclick=()=>{i=0;ans=[];q()};}
function q(){const it=Q[i];
 app.innerHTML=`<section class="screen"><div class="prog">${i?'<button type="button" id="prev">→ رجوع</button>':''}<div class="bar"><i style="width:${(i/Q.length)*100}%"></i></div><span>${i+1} / ${Q.length}</span></div>
 <h2 class="qh">${it.q}</h2><p class="qs">${it.s}</p>
 <div class="opts">${it.o.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${o[1]==='pal'?`<div class="pal">${S[o[0]].sw.map(c=>`<span style="background:${c}"></span>`).join('')}</div>`:`<div class="im"><img src="${img(o[1])}" alt="${esc(o[2])}" loading="eager"></div>`}<div class="lb"><b>${o[2]}</b><i aria-hidden="true">${['أ','ب','ج'][k]}</i></div></button>`).join('')}</div></section>`;
 requestAnimationFrame(()=>{const b=app.querySelector('.bar i');b.style.width=((i+1)/Q.length*100)+'%'});
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{b.classList.add('picked');ans[i]=it.o[+b.dataset.k][0];setTimeout(()=>{i++;i<Q.length?q():result()},320)});
 const p=document.getElementById('prev');if(p)p.onclick=()=>{i--;q()};
 scrollTo({top:0,behavior:'smooth'});}
function result(){const c={m:0,c:0,d:0};ans.forEach(a=>c[a]++);
 const k=Object.keys(c).sort((a,b)=>c[b]-c[a]||ans.indexOf(a)-ans.indexOf(b))[0],r=S[k];
 const msg=`السلام عليكم، سويت اختبار الستايل في موقعكم وطلع ستايلي: ${r.name}. أبغى أستفسر عن تصميم مشروعي.`;
 app.innerHTML=`<section class="screen res">
  <div class="mood">${r.img.map(n=>`<img src="${img(n)}" alt="">`).join('')}</div>
  <div><div class="k">ستايلك هو</div><h2 class="foil">${r.name}</h2><div class="en">${r.en}</div>
   <p class="d">${r.d}</p>
   <div class="sw">${r.sw.map(c=>`<span style="background:${c}" title="${c}"></span>`).join('')}</div>
   <div class="mats">${r.mats.map(m=>`<div><b>${m[0]}</b><small>${m[1]}</small></div>`).join('')}</div>
   <div class="score">${Object.keys(S).map(x=>`<div><span>${S[x].name}</span><div class="b"><i style="width:${c[x]/Q.length*100}%"></i></div><em>${Math.round(c[x]/Q.length*100)}%</em></div>`).join('')}</div>
   <div class="act"><a class="go" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">صمّم بيتك بالستايل ده <span aria-hidden="true">←</span></a>
   <button class="ghost" type="button" id="again">أعد الاختبار</button><a class="ghost" href="/#work">شوف أعمالنا</a></div>
  </div></section><footer>© MAX DESIGN · RIYADH</footer>`;
 document.getElementById('again').onclick=()=>{i=0;ans=[];q()};scrollTo({top:0,behavior:'smooth'});}
/* warm the image cache so each question shows instantly */
['m','c','d'].forEach(s=>S[s].img.concat(['mat-'+s]).forEach(n=>{const im=new Image();im.src=img(n)}));
intro();
</script>
</body>
</html>
