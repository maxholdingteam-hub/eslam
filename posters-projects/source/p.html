<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{background:#222}
:root{--v:#0b0907;--cr:#f2ece0;--g:#d9b46b;--g2:#f6dc9c;--deep:#7d5f2a;--ink:#14110d}
.f{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:"IBM Plex Sans Arabic",sans-serif;background:var(--v);color:var(--cr);margin-bottom:20px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.en{font-family:Montserrat,sans-serif;direction:ltr;letter-spacing:.3em;text-transform:uppercase}
.am{font-family:Amiri,serif;font-weight:700}
.foil{background:linear-gradient(180deg,#fff1c6,#f0cf82 35%,#c99a45 68%,#f3d68f);-webkit-background-clip:text;background-clip:text;color:transparent}
.ft{position:absolute;left:56px;right:56px;bottom:40px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.ft img{height:46px}.ft .en{font-size:16px;letter-spacing:.2em}
.wa{display:inline-flex;align-items:center;gap:10px;direction:ltr;font-family:Montserrat;font-weight:600;font-size:26px;color:var(--g2)}
.wa svg{width:30px;height:30px}
.chip{display:inline-block;border:1.5px solid rgba(217,180,107,.75);color:var(--g2);padding:8px 22px;font-size:22px;font-weight:600;background:rgba(11,9,7,.55)}
.ph{position:absolute;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lab{position:absolute;bottom:14px;right:14px;background:rgba(11,9,7,.72);color:var(--cr);padding:6px 16px;font-size:20px;font-weight:600}
/* 1 villa hero */
.c1 .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,9,7,.75) 0%,rgba(11,9,7,0) 30%,rgba(11,9,7,0) 48%,rgba(11,9,7,.92) 78%)}
.c1 .top{position:absolute;top:60px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.c1 .hd{position:absolute;left:56px;right:56px;bottom:130px;z-index:4}
.c1 .hd h2{font-size:120px;line-height:1.05}
.c1 .hd p{font-size:30px;font-weight:300;margin:14px 0 22px;max-width:820px}
.c1 .row{display:flex;gap:0;border-top:1px solid rgba(217,180,107,.45);padding-top:18px}
.c1 .row div{padding:0 26px;border-left:1px solid rgba(217,180,107,.35);font-size:24px}
.c1 .row div:first-child{padding-right:0}.c1 .row div:last-child{border-left:0}
.c1 .row b{display:block;font-family:Montserrat;color:var(--g2);font-size:30px}
/* 2 before after */
.c2 .half{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.c2 .half img{width:100%;height:100%;object-fit:cover}
.c2 .a{top:0}.c2 .b{bottom:0}
.c2 .tagx{position:absolute;z-index:4;font-family:Montserrat;font-size:20px;letter-spacing:.3em;background:var(--v);color:var(--g2);padding:10px 22px}
.c2 .mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;display:flex;justify-content:center}
.c2 .mid .box{background:var(--v);border:1.5px solid var(--g);padding:24px 48px;text-align:center}
.c2 .mid h2{font-size:72px;line-height:1.1}
.c2 .mid p{font-size:22px;color:#cfc4b0;margin-top:6px}
/* 3 kids */
.c3{background:var(--cr);color:var(--ink)}
.c3 .hd{position:absolute;top:60px;right:56px;left:56px}
.c3 .hd .en{font-size:16px;color:var(--deep)}
.c3 .hd h2{font-size:104px;line-height:1.05;margin-top:6px}
.c3 .hd p{font-size:28px;color:#5a5044;margin-top:8px}
.c3 .ft .en,.c3 .wa,.c5 .wa{color:var(--deep)}
/* 4 bedrooms */
.c4 .hd{position:absolute;top:56px;right:56px;left:56px;z-index:3}
.c4 .hd h2{font-size:100px;line-height:1.05}
.c4 .hd p{font-size:28px;color:#cfc4b0;margin-top:8px}
/* 5 details */
.c5{background:var(--cr);color:var(--ink)}
.c5 .hd{position:absolute;top:56px;right:56px;left:56px;display:flex;justify-content:space-between;align-items:flex-end}
.c5 .hd h2{font-size:96px;line-height:1.05}
.c5 .hd .en{font-size:15px;color:var(--deep);text-align:left;line-height:1.8}
.c5 .ft .en{color:var(--deep)}
.c5 .num{position:absolute;top:14px;left:14px;font-family:Montserrat;font-weight:700;font-size:20px;color:#fff;background:rgba(11,9,7,.6);padding:4px 10px}
/* 6 offices */
.c6 .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,9,7,.1),rgba(11,9,7,.1)),linear-gradient(180deg,rgba(11,9,7,0) 45%,rgba(11,9,7,.94) 75%)}
.c6 .hd{position:absolute;left:56px;right:56px;bottom:130px;z-index:4}
.c6 .hd h2{font-size:108px;line-height:1.08}
.c6 .hd p{font-size:28px;font-weight:300;margin:12px 0 20px}
.c6 .inset{position:absolute;top:56px;left:56px;width:360px;height:440px;border:3px solid var(--cr);box-shadow:0 30px 80px rgba(0,0,0,.5);z-index:4;overflow:hidden}
.c6 .inset img{width:100%;height:100%;object-fit:cover}
</style></head><body>
<script>
const WA='<svg viewBox="0 0 32 32"><path fill="#d9b46b" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2a13 13 0 0 0 6.6 1.8C23.2 28.8 29 23 29 15.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.7l-.4-.3-3.8 1.2 1.2-3.7-.3-.4A10.4 10.4 0 0 1 5.6 15.8C5.6 10.1 10.3 5.5 16 5.5s10.4 4.6 10.4 10.3S21.7 26.4 16 26.4zm5.7-7.7c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6.3-.5c.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.3-.6-.4z"/></svg>';
const FT=(dark=true)=>`<div class="ft"><div class="wa">${WA}0579277975</div><img src="logo.png"><div class="en">maxdesign.sa</div></div>`;
const ph=(src,x,y,w,h,lab='',pos='50% 50%',extra='')=>`<div class="ph" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${extra}<img src="img/${src}.jpg" style="object-position:${pos}">${lab?`<span class="lab">${lab}</span>`:''}</div>`;
const P={
c1:()=>`<img class="bg" src="img/39.jpg" style="object-position:50% 50%"><div class="sh"></div>
<div class="top"><span class="chip">مشروع منفّذ · 2026</span><span class="en" style="font-size:16px">Project 06</span></div>
<div class="hd"><h2 class="am">فيلا <span class="foil">عائلية فاخرة</span></h2><p>من أول فكرة لين آخر تفصيلة… فيلا عائلية بطابع دافئ وفخم في كل غرفة.</p>
<div class="row"><div><b>داخلي</b>تصميم</div><div><b>تنفيذ</b>كامل</div><div><b>+٥٠</b>تفصيلة منفّذة</div></div></div>${FT()}`,
c2:()=>`<div class="half a"><img src="img/00.jpg" style="object-position:50% 60%;filter:saturate(.75)"></div><div class="half b"><img src="img/02.jpg" style="object-position:50% 50%"></div>
<div class="tagx" style="top:40px;right:40px">BEFORE · الهيكل</div><div class="tagx" style="bottom:110px;right:40px">AFTER · التسليم</div>
<div class="mid"><div class="box"><h2 class="am">من الهيكل… <span class="foil">للتسليم</span></h2><p>مبنى مكاتب HITC · تصميم وتنفيذ ماكس ديزاين</p></div></div>${FT()}`,
c3:()=>`<div class="hd"><div class="en">Kids Rooms</div><h2 class="am">غرف أطفال<br>تكبر معهم</h2><p>سقف سحاب، رفوف ألعاب، وألوان مرحة… بلمسة مدروسة.</p></div>
${ph('74',56,500,470,720,'سقف السحاب')}${ph('48',554,500,470,345,'جدار الألعاب')}${ph('40',554,875,470,345,'سرير البيت','50% 60%')}${FT()}`,
c4:()=>`<div class="hd"><h2 class="am">غرف نوم <span class="foil">بطابع فندقي</span></h2><p>هدوء، خامات ناعمة، وإضاءة دافئة… عشان ترتاح فعلًا.</p></div>
${ph('20',56,330,968,470,'','50% 55%')}${ph('32',56,830,474,390,'','50% 45%')}${ph('28',550,830,474,390,'','50% 55%')}${FT()}`,
c5:()=>`<div class="hd"><h2 class="am">التفاصيل<br>اللي تفرق</h2><div class="en">Details<br>Residential Villa</div></div>
${ph('29',56,340,474,420,'درج وثريا','50% 40%','<span class="num">01</span>')}${ph('63',550,340,474,420,'أبواب مزخرفة','50% 40%','<span class="num">02</span>')}
${ph('38',56,780,474,440,'تاج العمود','50% 30%','<span class="num">03</span>')}${ph('56',550,780,474,440,'جدار هندسي','50% 50%','<span class="num">04</span>')}${FT()}`,
c6:()=>`<img class="bg" src="img/09.jpg" style="object-position:50% 50%"><div class="sh"></div>
<div class="inset"><img src="img/06.jpg" style="object-position:50% 50%"></div>
<div class="hd"><span class="chip">مكاتب ومقرات شركات</span><h2 class="am" style="margin-top:16px">مكتبك يعكس<br><span class="foil">هوية شركتك</span></h2><p>مكتب المدير وقاعة الاجتماعات · مبنى HITC</p></div>${FT()}`
};
document.body.innerHTML=Object.keys(P).map(k=>`<section class="f ${k}" id="${k}">${P[k]()}</section>`).join('');
</script></body></html>
