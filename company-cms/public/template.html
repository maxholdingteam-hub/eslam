<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06102a;--bg-2:#0a1838;--panel:#0e1f47;--line:rgba(214,175,92,.2);--soft:rgba(255,255,255,.08);--ink:#eef1f8;--muted:#9aa6c4;--dim:#64708f;
  --acc:#d6af5c;--acc-2:#f1d48e;--acc-3:#a9822f;--on-acc:#1a1405;--glow:214,175,92;--cool:40,80,170;--shade:0,0,0;--hero-ov:rgba(6,16,42,.72);
  --sans:"Manrope","IBM Plex Sans Arabic",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;--r:22px;--max:1240px;--g:clamp(16px,4vw,40px);
}
html[data-theme-name="black-orange"]{--bg:#0a0a0a;--bg-2:#121212;--panel:#181818;--line:rgba(255,106,43,.24);--acc:#ff6a2b;--acc-2:#ff9a6a;--acc-3:#d4481a;--on-acc:#140600;--glow:255,106,43;--cool:60,60,60;--muted:#a3a09c;--dim:#6d6a66;--hero-ov:rgba(10,10,10,.72)}
html[data-theme-name="emerald"]{--bg:#04140f;--bg-2:#082019;--panel:#0c2a21;--line:rgba(78,214,155,.22);--acc:#4ed69b;--acc-2:#9df0c8;--acc-3:#239a66;--on-acc:#02140c;--glow:78,214,155;--cool:20,90,80;--muted:#93b3a6;--dim:#5f7d71;--hero-ov:rgba(4,20,15,.72)}
html[data-theme-name="plum"]{--bg:#120a1d;--bg-2:#1a0f2a;--panel:#231536;--line:rgba(214,160,255,.22);--acc:#d6a0ff;--acc-2:#ecd1ff;--acc-3:#9b5fd1;--on-acc:#170a24;--glow:214,160,255;--cool:80,40,140;--muted:#ac9cc2;--dim:#75678a;--hero-ov:rgba(18,10,29,.72)}
html[data-theme-name="light"]{--bg:#f6f3ec;--bg-2:#efe9dd;--panel:#ffffff;--line:rgba(150,110,40,.22);--soft:rgba(20,22,28,.09);--ink:#15171d;--muted:#555b6a;--dim:#868b97;--acc:#a8791f;--acc-2:#8a6114;--acc-3:#6e4c0e;--on-acc:#fff;--glow:168,121,31;--cool:120,140,190;--hero-ov:rgba(246,243,236,.82)}
html[lang="ar"]{--sans:"IBM Plex Sans Arabic","Manrope",system-ui,sans-serif;--serif:"IBM Plex Sans Arabic",serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;overflow-x:clip;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--acc);color:var(--bg)}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--g)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.atmo{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 600px at 85% -10%,rgba(var(--glow),.12),transparent 60%),radial-gradient(800px 700px at -10% 30%,rgba(var(--cool),.22),transparent 60%),var(--bg)}
nav{position:fixed;top:0;inset-inline:0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
nav.scrolled{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--soft)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;min-width:0}
.logo img{height:42px;width:auto;max-width:170px;object-fit:contain}
.badge-logo{width:42px;height:42px;border-radius:12px;border:1px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-family:"Manrope";font-weight:800;font-size:14px;letter-spacing:.04em;direction:ltr;flex-shrink:0}
.links{display:flex;gap:26px;font-size:14px;color:var(--muted)}.links a:hover{color:var(--ink)}
.nav-r{display:flex;gap:10px;align-items:center}
.lang{border:1px solid var(--line);background:transparent;color:var(--acc-2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .25s;cursor:pointer;border:0;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn-acc{background:linear-gradient(135deg,var(--acc-2),var(--acc) 55%,var(--acc-3));color:var(--on-acc);box-shadow:0 10px 30px -10px rgba(var(--glow),.6)}
.btn-ghost{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 30%,transparent)}
html[dir="rtl"] .arr{transform:scaleX(-1)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:none;place-items:center;cursor:pointer}
.mmenu{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;font-size:26px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s}
.mmenu.open{opacity:1;pointer-events:auto}.mmenu .x{position:absolute;top:18px;inset-inline-end:18px;display:grid}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:120px 0 70px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-1}.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--hero-ov),color-mix(in srgb,var(--bg) 55%,transparent) 45%,var(--bg))}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);font-weight:700}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:14px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--acc)}
h1{font-weight:800;font-size:clamp(46px,8.5vw,112px);line-height:.98;letter-spacing:-.035em;margin:22px 0;max-width:15ch}
html[lang="ar"] h1{letter-spacing:0;line-height:1.2;max-width:none}
h1 em,h2 em,.contact h2 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--acc-2)}
html[lang="ar"] h1 em,html[lang="ar"] h2 em{font-style:normal;font-weight:700}
.intro{color:var(--muted);font-size:clamp(17px,1.6vw,20px);max-width:640px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.stats{display:grid;grid-template-columns:repeat(var(--n,4),1fr);margin-top:60px;border-top:1px solid var(--soft)}
.stat{padding:26px 22px 0 0}html[dir="rtl"] .stat{padding:26px 0 0 22px}
.stat .n{font-family:"Manrope";font-weight:800;font-size:clamp(38px,4.6vw,58px);line-height:1;letter-spacing:-.03em;direction:ltr;text-align:start}
.stat .n sup{color:var(--acc);font-size:.5em;vertical-align:top}
.stat p{color:var(--muted);font-size:14px;margin-top:8px}
/* sections */
section{padding:clamp(80px,11vw,140px) 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:52px}
.kick{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:16px}
html[lang="ar"] .kick{letter-spacing:0;font-size:14px}
.kick::before{content:"";width:28px;height:2px;background:var(--acc)}
h2{font-weight:800;font-size:clamp(34px,5.2vw,64px);line-height:1.05;letter-spacing:-.03em}
html[lang="ar"] h2{letter-spacing:0;line-height:1.3}
.head p{color:var(--muted);max-width:480px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:center}
.about-img{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--panel)}.about-img img{width:100%;height:100%;object-fit:cover}
.about .story{font-size:clamp(18px,1.8vw,22px);line-height:1.7;margin:18px 0 26px}
.vm{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{padding:26px;border-radius:var(--r);border:1px solid var(--soft);background:color-mix(in srgb,var(--panel) 65%,transparent);transition:transform .35s,border-color .35s}
.card:hover{transform:translateY(-5px);border-color:var(--line)}
.card h3{font-size:19px;font-weight:700;margin-bottom:8px}.card p{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--acc-2);background:rgba(var(--glow),.06)}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.svc .card{position:relative;padding:32px 28px}
.ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:rgba(var(--glow),.1);border:1px solid var(--line);color:var(--acc-2);margin-bottom:22px}
.svc .idx{position:absolute;top:26px;inset-inline-end:26px;font-family:"Instrument Serif",serif;font-style:italic;color:var(--dim);font-size:18px}
/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--soft);background:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel);aspect-ratio:4/5;cursor:pointer;border:1px solid var(--soft)}
.pcard.big{grid-column:span 2;aspect-ratio:auto}
.pcard img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.pcard:hover img{transform:scale(1.05)}
.pcard .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.82));display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff}
.pcard .cat{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-2)}
html[lang="ar"] .pcard .cat{letter-spacing:0}
.pcard h3{font-size:22px;line-height:1.25;margin-top:6px}.pcard small{opacity:.75;font-size:13px}
.pcard .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);background:linear-gradient(135deg,var(--panel),var(--bg-2))}
.pcard.hide{display:none}
/* lightbox */
.lb{position:fixed;inset:0;z-index:90;background:rgba(5,5,8,.94);display:none;overflow:auto}
.lb.open{display:block}
.lb-in{max-width:1100px;margin:0 auto;padding:70px var(--g) 40px;color:#eef1f8}
.lb-main{position:relative;border-radius:16px;overflow:hidden;background:#111}
.lb-main img{width:100%;max-height:72vh;object-fit:contain}
.lb .nb{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,20,20,.7);display:grid;place-items:center;cursor:pointer;color:#fff}
.lb .prev{left:12px}.lb .next{right:12px}
.lb .close{position:fixed;top:16px;right:16px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,20,20,.7);display:grid;place-items:center;cursor:pointer;color:#fff;z-index:2}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs img{width:84px;height:60px;object-fit:cover;border-radius:8px;opacity:.5;cursor:pointer;flex-shrink:0}.thumbs img.on{opacity:1;outline:2px solid var(--acc)}
.lb-info{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;margin-top:26px}
.lb-info h3{font-size:30px;line-height:1.2}.lb-info p{color:#b8bfd2;margin-top:12px;white-space:pre-line}
.lb-meta{display:grid;gap:10px;align-content:start}.lb-meta div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px;font-size:14px}
.lb-meta span:first-child{color:#8a93ab}
/* process */
.steps{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:16px;counter-reset:s}
.step{padding-top:22px;border-top:2px solid var(--line)}
.step b{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:40px;color:var(--acc);line-height:1}
.step h3{font-size:19px;margin:10px 0 6px}.step p{color:var(--muted);font-size:15px}
/* clients */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border-top:1px solid var(--soft);border-inline-start:1px solid var(--soft)}
.clients div{min-height:120px;display:grid;place-items:center;padding:22px;border-bottom:1px solid var(--soft);border-inline-end:1px solid var(--soft);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.clients img{max-height:56px;max-width:140px;object-fit:contain;filter:grayscale(1) brightness(1.6);opacity:.8;transition:all .3s}
html[data-theme-name="light"] .clients img{filter:grayscale(1)}
.clients div:hover img{filter:none;opacity:1}
/* testimonials + team */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.quote{font-size:18px;line-height:1.7}.quote::before{content:"“";display:block;font-family:"Instrument Serif",serif;font-size:64px;line-height:.6;color:var(--acc);margin-bottom:14px}
.who{margin-top:18px;font-weight:700}.who small{display:block;color:var(--muted);font-weight:500}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.member .ph{aspect-ratio:1;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--panel),var(--bg-2));display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--acc);margin-bottom:14px}
.member .ph img{width:100%;height:100%;object-fit:cover}
.member h3{font-size:18px}.member p{color:var(--muted);font-size:14px}
/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(44px,8vw,112px);line-height:1}
html[lang="ar"] .contact h2{line-height:1.25}
.contact .lead{color:var(--muted);max-width:560px;margin:22px auto 36px}
.ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:50px;text-align:start}
.ccard{display:flex;align-items:center;gap:14px;padding:20px;border-radius:var(--r);border:1px solid var(--soft);background:color-mix(in srgb,var(--panel) 55%,transparent)}
a.ccard:hover{border-color:var(--acc)}
.ccard .i{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--glow),.12);color:var(--acc-2);flex-shrink:0}
.ccard small{display:block;color:var(--dim);font-size:12px}.ccard span{font-weight:600;word-break:break-word}
.socials{display:flex;justify-content:center;gap:10px;margin-top:30px;flex-wrap:wrap}
.socials a{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);display:grid;place-items:center;color:var(--acc-2)}
.socials a:hover{border-color:var(--acc)}
.form{max-width:760px;margin:50px auto 0;text-align:start;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:30px;border-radius:var(--r);border:1px solid var(--soft);background:color-mix(in srgb,var(--panel) 50%,transparent)}
.form h3{grid-column:1/-1;font-size:21px}.form .full{grid-column:1/-1}
.form label{display:grid;gap:7px;font-size:13px;color:var(--muted)}
.form input,.form textarea,.form select{width:100%;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--soft);border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--acc)}
.form textarea{min-height:120px;resize:vertical}
.form .hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0;pointer-events:none}
.form .row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.status.ok{color:#3fbf7f}.status.err{color:#e5534b}
footer{padding:34px 0;border-top:1px solid var(--soft);color:var(--dim);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media (max-width:1000px){
  .links,.nav-cta{display:none}.burger{display:grid}
  .about,.lb-info{grid-template-columns:1fr}.svc,.pgrid{grid-template-columns:1fr 1fr}.pcard.big{grid-column:span 2}
  .steps{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .svc,.pgrid,.vm,.steps{grid-template-columns:1fr}.pcard.big{grid-column:auto;aspect-ratio:4/5}.form{grid-template-columns:1fr;padding:22px}
  .hero{padding-top:100px}.logo span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
/* print / PDF (no shadows, masks or blur — iPhone renders them as black boxes) */
html.print *,html.print *::before,html.print *::after{animation:none!important;transition:none!important;box-shadow:none!important;filter:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.print .rv{opacity:1!important;transform:none!important}
html.print nav,html.print .mmenu,html.print .form,html.print .filters,html.print .lb{display:none!important}
html.print .atmo{position:absolute;height:100%}
html.print .hero{min-height:auto;padding-top:60px}html.print section{padding:60px 0}
html.print .about{grid-template-columns:1fr 1fr}html.print .svc,html.print .pgrid{grid-template-columns:repeat(3,1fr)}html.print .pcard.big{grid-column:span 2}
html.print .steps{grid-template-columns:repeat(var(--n,4),1fr)}html.print .stats{grid-template-columns:repeat(var(--n,4),1fr)}
html.print .card,html.print .pcard,html.print .step,html.print .ccard,html.print .member,html.print .head{break-inside:avoid}
html.print section:not(#work){break-inside:avoid}
@media print{@page{size:A4;margin:0}html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:var(--bg)}html.print body{zoom:.64}}
.printbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;background:var(--acc);color:var(--on-acc);padding:10px 12px 10px 20px;border-radius:999px;font-weight:700;display:flex;gap:12px;align-items:center}
@media print{.printbar{display:none!important}}
</style>
</head>

function step(d){ cur = (cur + d + imgs.length) % imgs.length; showImg(); }
function closeLB(){ $("#lb").classList.remove("open"); document.body.style.overflow = ""; }
addEventListener("keydown", e => { if (!$("#lb").classList.contains("open")) return; if (e.key === "Escape") closeLB(); if (e.key === "ArrowRight") step(L === "ar" ? -1 : 1); if (e.key === "ArrowLeft") step(L === "ar" ? 1 : -1); });

async function submitForm(e){
  e.preventDefault(); const f = e.currentTarget, st = $("#qstatus"), u = UI[L], b = f.querySelector("button[type=submit]");
  const d = Object.fromEntries(new FormData(f)); d.lang = L; d.visit = VISIT;
  if (!d.name || !d.message || (!d.phone && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))) { st.className = "status err"; st.textContent = u.fErr; return; }
  b.disabled = true;
  try { const r = await fetch("/api/request", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(d)}); if (!r.ok) throw 0; f.reset(); st.className = "status ok"; st.textContent = u.fOk; }
  catch { st.className = "status err"; st.textContent = u.fFail; }
  b.disabled = false;
}

// ---------- visit tracking (anonymous; no cookies) ----------
let VISIT = null, active = 0, lastTick = Date.now(), maxScroll = 0; const seen = new Set();
const TRACK = !PRINT && !/[?&]preview=1/.test(location.search);
function bid(){ try { let b = localStorage.getItem("co_bid"); if (!b) { const a = new Uint8Array(12); crypto.getRandomValues(a); b = [...a].map(x => x.toString(16).padStart(2,"0")).join(""); localStorage.setItem("co_bid", b); } return b; } catch { return null; } }
function post(path, body, beacon){ try { const s = JSON.stringify(body); if (beacon && navigator.sendBeacon) return navigator.sendBeacon(path, new Blob([s], {type:"application/json"})); return fetch(path, {method:"POST", headers:{"content-type":"application/json"}, body:s, keepalive:true}); } catch {} }
function ev(name, detail){ if (TRACK) post("/api/e", {visit:VISIT, name, detail:String(detail||"").slice(0,120)}, true); }
let secObs;
function observeSections(){ secObs && secObs.disconnect(); secObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) seen.add(e.target.dataset.sec); }), {threshold:.35});
  document.querySelectorAll("[data-sec]").forEach(s => secObs.observe(s)); }
function tick(){ const now = Date.now(); if (document.visibilityState === "visible") active += Math.min(now - lastTick, 30000); lastTick = now; }
function ping(beacon){ if (!VISIT) return; tick(); post("/api/v/ping", {id:VISIT, duration:Math.round(active/1000), scroll:maxScroll, sections:[...seen]}, beacon); }
addEventListener("scroll", () => { const h = document.documentElement; const p = Math.round((h.scrollTop + innerHeight) / h.scrollHeight * 100); if (p > maxScroll) maxScroll = Math.min(100, p); $("#nav").classList.toggle("scrolled", scrollY > 30); }, {passive:true});
document.addEventListener("click", e => { const a = e.target.closest("[data-ev]"); if (a) ev(a.dataset.ev); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") ping(true); else lastTick = Date.now(); });
addEventListener("pagehide", () => ping(true));
async function startVisit(){
  if (!TRACK) return;
  const q = new URLSearchParams(location.search);
  try { const r = await fetch("/api/v", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({path:location.pathname, referrer:document.referrer, lang:L, link:D.link, bid:bid(), utm_source:q.get("utm_source"), utm_campaign:q.get("utm_campaign")})});
    const j = await r.json(); VISIT = j.id; if (VISIT) setInterval(() => ping(false), 15000); } catch {}
}

$("#langBtn").onclick = () => { L = L === "ar" ? "en" : "ar"; const q = new URLSearchParams(location.search); q.set("lang", L); history.replaceState(null, "", "?" + q + location.hash); render(); ev("lang_" + L); };
const mm = $("#mmenu"); $("#burger").onclick = () => mm.classList.add("open"); $("#mclose").onclick = () => mm.classList.remove("open"); mm.addEventListener("click", e => { if (e.target.closest("a")) mm.classList.remove("open"); });
render(); startVisit();
if (PRINT) { const bar = document.createElement("div"); bar.className = "printbar"; bar.innerHTML = `<span>${UI[L].printHint}</span><button class="btn btn-ghost" type="button" style="padding:8px 14px;background:var(--bg);color:var(--ink)">${UI[L].print}</button>`;
  document.body.appendChild(bar); bar.querySelector("button").onclick = () => print(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => print(), 700)); }
})();
</script>
