<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Max Design Quotation 000296</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Max Design quotation, same system as Quotation 000294: the company letterhead as the page,
   gold section heads with a hairline, a near-black table head, sand-striped rows. One data set feeds EN and AR. */
:root{
  --gold:#a8812f; --gold-l:#c9a45a; --ink:#1f1c17; --text:#2b2824; --mute:#6f675b;
  --rule:#e3d2a8; --stripe:#f7f0e1; --box:#fbf7ee;
  --en:"Montserrat",Arial,sans-serif; --ar:"Tajawal","Montserrat",Tahoma,sans-serif;
}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:var(--en);color:var(--text);font-size:9.6pt;line-height:1.45}
html[lang=ar] body{font-family:var(--ar);font-size:10.4pt}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;page-break-after:always;
  background:url("a/letterhead.png") center/100% 100% no-repeat}
.page:last-child{page-break-after:auto}
.body{position:absolute;left:19mm;right:19mm;top:35.2mm;bottom:31mm;display:flex;flex-direction:column;gap:4.4mm}
.title{text-align:center;font-weight:700;font-size:12pt;letter-spacing:.42em;color:var(--ink);padding-bottom:3mm;border-bottom:.4mm solid var(--gold-l);margin:0 -2mm}
html[lang=ar] .title{letter-spacing:.06em;font-size:14pt;font-weight:800}
.num{font-family:var(--en);font-variant-numeric:tabular-nums}
html[lang=ar] .num{direction:ltr;unicode-bidi:isolate}
/* meta */
.meta{display:grid;grid-template-columns:1fr 1fr;column-gap:10mm}
.meta div{display:flex;justify-content:space-between;gap:4mm;padding:1.6mm 0;border-bottom:.25mm dashed var(--rule);font-size:8.8pt}
html[lang=ar] .meta div{font-size:9.8pt}
.meta span{color:var(--mute)}
.meta b{font-weight:700;color:var(--ink);text-align:end}
.meta b.gold{color:var(--gold);font-size:11pt}
/* section heads */
.sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.3mm solid var(--rule);padding-bottom:1.2mm}
.sh h2{font-size:12pt;font-weight:600;color:var(--gold)}
html[lang=ar] .sh h2{font-size:13.5pt;font-weight:800}
.sh small{font-size:7.6pt;font-weight:700;letter-spacing:.24em;color:var(--mute)}
html[lang=ar] .sh small{letter-spacing:.02em;font-size:8.6pt}
.lead{color:var(--text);margin-top:-2mm}
.note{font-size:8.6pt;color:var(--mute);margin-top:-3mm}
html[lang=ar] .note{font-size:9.4pt}
/* tables */
table{width:100%;border-collapse:collapse}
thead th{background:var(--ink);color:#fff;font-weight:600;font-size:8.6pt;padding:2.2mm 2.4mm;text-align:start}
html[lang=ar] thead th{font-size:9.6pt;font-weight:700}
tbody td{padding:1.9mm 2.4mm;border-bottom:.25mm solid var(--rule);vertical-align:top}
tbody tr.z td{background:var(--stripe)}
td.r,th.r{text-align:end}
td.c,th.c{text-align:center}
.sub td{font-weight:700;color:var(--ink);background:#efe4c9!important}
.sec td{font-weight:700;color:var(--gold);background:#fff!important;padding-top:2.6mm}
.tot td{background:var(--ink)!important;color:#fff;font-weight:700;border:0}
.tot td.g{color:var(--gold-l)}
.small td{font-size:8.5pt;padding:1.45mm 2.2mm}
html[lang=ar] .small td{font-size:9.2pt;padding-top:1.2mm;padding-bottom:1.2mm}
.desc small{display:block;color:var(--mute);font-size:7.6pt;margin-top:.4mm}
html[lang=ar] .desc small{font-size:8.2pt;margin-top:0;line-height:1.3}
/* summary boxes */
.boxes{display:grid;grid-template-columns:.8fr 1.2fr;gap:3mm}
.bx{display:flex;align-items:center;justify-content:space-between;padding:4.2mm 5mm;border:.3mm solid var(--rule);background:var(--box)}
.bx span{color:var(--mute)}
.bx b{font-size:14pt;font-weight:700;color:var(--ink);white-space:nowrap}
.bx.dark{background:var(--ink);border-color:var(--ink)}
.bx.dark span{color:#d6c7a5}
.bx.dark b{color:var(--gold-l);font-size:16pt}
.words{margin-top:-3mm;font-size:9pt}
/* scope cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6mm}
.card{border:.3mm solid var(--rule);padding:2.6mm 3mm;display:flex;gap:2.4mm;background:rgba(255,255,255,.85)}
.card .n{font-family:var(--en);font-size:12pt;font-weight:600;color:var(--gold);line-height:1}
.card b{display:block;font-weight:700;color:var(--ink);font-size:9pt}
html[lang=ar] .card b{font-size:10pt}
.card p{font-size:7.8pt;color:var(--mute);line-height:1.4;margin-top:.6mm}
html[lang=ar] .card p{font-size:8.6pt}
/* optional */
.opt{border:.3mm dashed var(--gold-l);background:var(--box);padding:3.4mm 4mm;display:grid;gap:1.6mm}
.opt h3{font-size:9.6pt;color:var(--gold);font-weight:700}
.opt .row{display:flex;justify-content:space-between;gap:4mm}
.opt .row b{color:var(--ink);white-space:nowrap}
/* notes */
.notes{display:grid;grid-template-columns:24mm 1fr;row-gap:1.3mm;column-gap:4mm;font-size:8.7pt;line-height:1.38}
html[lang=ar] .notes{font-size:9.4pt}
.notes dt{font-weight:700;color:var(--gold)}
.notes dd{color:var(--text)}
/* acceptance */
.sign{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.sign div{border:.3mm solid var(--rule);padding:3mm 5mm;display:grid;gap:2.4mm;background:rgba(255,255,255,.85)}
.sign h4{color:var(--gold);font-size:10pt;font-weight:700}
.sign p{display:flex;gap:3mm;color:var(--mute);font-size:9pt}
.sign p i{flex:1;border-bottom:.25mm solid var(--mute);font-style:normal}
.pgno{position:absolute;bottom:24.5mm;left:0;right:0;text-align:center;font-size:7pt;color:var(--mute);letter-spacing:.2em}
/* 000296: one dense page */
.body{gap:2.4mm!important;top:33.5mm!important;bottom:29mm!important}
.meta div{padding:1.1mm 0}
.small td{padding-top:1.15mm;padding-bottom:1.15mm}
html[lang=ar] .small td{padding-top:.9mm;padding-bottom:.9mm}
.bx{padding:3mm 5mm}
.notes{row-gap:.9mm;font-size:8.5pt;line-height:1.35}
html[lang=ar] .notes{font-size:8.9pt;line-height:1.3}
html[lang=ar] .small td{font-size:8.9pt}
html[lang=ar] .meta div{padding:.6mm 0}
html[lang=ar] .small td{padding-top:.75mm;padding-bottom:.75mm}
.lead,.words{margin-top:-1.5mm}
.bx span{white-space:nowrap;margin-inline-end:4mm}
</style>
</head>
<body>
<div id="doc"></div>
<div id="doc"></div>
<script>
/* ------------ one source of truth for both languages ------------ */
const L = new URLSearchParams(location.search).get("lang") === "ar" ? "ar" : "en";
document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
const t = (en, ar) => L === "ar" ? ar : en;
const money = v => v.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const N = n => `<span class="num">${n}</span>`;

/* fee: area × rate, as in the client's draft (400 m² × SAR 62.50) */
const AREA = 400, RATE = 62.5, FEE = AREA * RATE;
const SERVICES = [
  [t("3D Interior Design","التصميم الداخلي ثلاثي الأبعاد"), t("Design and 3D renderings for the agreed spaces.","تصميم وصور ثلاثية الأبعاد للمساحات المتفق عليها.")],
  [t("Materials & Finishes Guide","دليل المواد والتشطيبات"), t("Schedule of proposed materials, finishes and colours.","جدول المواد والتشطيبات والألوان المقترحة.")],
  [t("Dimensioned Working Drawings","مخططات تنفيذية بالأبعاد"), t("Plans with dimensions and layout of design elements.","مخططات توضح أبعاد وتوزيع عناصر التصميم.")],
  [t("VR360 Virtual Tour","جولة افتراضية VR360"), t("360° panoramic tour of the agreed viewpoints.","جولة بانورامية 360° للزوايا المتفق عليها.")],
  [t("Lighting Layout","مخطط الإضاءة"), t("Locations of the proposed light fixtures.","مواقع وحدات الإضاءة المقترحة.")],
  [t("Reflected Ceiling Plan","مخطط الأسقف"), t("Suspended ceiling layouts and levels.","تصاميم ومناسيب الأسقف المعلقة.")],
  [t("Floor Finishes Plan","مخطط تشطيبات الأرضيات"), t("Finish types, laying directions and transitions.","أنواع التشطيب واتجاهات التركيب ومواقع الفواصل.")],
  [t("Socket & Switch Layout","مخطط الأفياش والمفاتيح"), t("Outlets and switches coordinated with the furniture.","مواقع الأفياش والمفاتيح منسقة مع توزيع الأثاث.")]
];
const PAY = [[t("On acceptance and commencement","عند الموافقة وبدء العمل"),40],[t("On approval of the 3D design","عند اعتماد التصميم ثلاثي الأبعاد"),40],
             [t("On final delivery of drawings and the virtual tour","عند التسليم النهائي للمخططات والجولة الافتراضية"),20]];
if (FEE !== 25000 || PAY.reduce((a, p) => a + p[1], 0) !== 100) document.title = "CHECK TOTALS";
const words = t("Twenty-five thousand Saudi Riyals only, exclusive of VAT.","خمسة وعشرون ألف ريال سعودي فقط، غير شامل ضريبة القيمة المضافة.");

const p1 = `<section class="page"><div class="body" style="gap:3.6mm">
<div class="title">${t("QUOTATION · DESIGN WORKS","عرض سعر · أعمال التصميم")}</div>
<div class="meta">
  <div><span>${t("Project","المشروع")}</span><b>${t("Interior Design – 400 m²","تصميم داخلي – 400 م²")}</b></div>
  <div><span>${t("Quotation No.","رقم العرض")}</span><b class="gold num">000296</b></div>
  <div><span>${t("Client","العميل")}</span><b>________________</b></div>
  <div><span>${t("Date","التاريخ")}</span><b>${t("18 November 2026","18 نوفمبر 2026")}</b></div>
  <div><span>${t("Location","الموقع")}</span><b>${t("Kingdom of Saudi Arabia","المملكة العربية السعودية")}</b></div>
  <div><span>${t("Validity","صلاحية العرض")}</span><b>${t("15 days","15 يومًا")}</b></div>
</div>

<div class="sh"><h2>01 · ${t("Scope of Services","نطاق الخدمات")}</h2><small>${t("8 DELIVERABLES","8 مخرجات")}</small></div>
<table class="small">
  <thead><tr><th style="width:11mm">${t("No.","م")}</th><th style="width:58mm">${t("Service","الخدمة")}</th><th>${t("Deliverable","المخرج")}</th></tr></thead>
  <tbody>${SERVICES.map(([s, d], i) => `<tr class="${i % 2 ? "z" : ""}"><td>${N("0" + (i + 1))}</td><td><b>${s}</b></td><td style="color:var(--mute)">${d}</td></tr>`).join("")}</tbody>
</table>

<div class="sh"><h2>02 · ${t("Design Fee","أتعاب التصميم")}</h2><small>${t("CURRENCY: SAR","العملة: ريال سعودي")}</small></div>
<div class="boxes">
  <div class="bx"><span>${t("Area × Rate","المساحة × السعر")}</span><b>${N(AREA + " m² × " + RATE.toFixed(2))}</b></div>
  <div class="bx dark"><span>${t("Design Fee (Ex-VAT)","الأتعاب قبل الضريبة")}</span><b>${N("SAR " + money(FEE))}</b></div>
</div>

<div class="sh"><h2>03 · ${t("Payment Schedule","جدول الدفعات")}</h2><small>${N(t("TOTAL: SAR ","الإجمالي: ") + money(FEE) + t(""," ريال"))}</small></div>
<table class="small">
  <thead><tr><th style="width:11mm">${t("No.","م")}</th><th>${t("Milestone","المرحلة")}</th><th class="c" style="width:20mm">${t("Share","النسبة")}</th><th class="r" style="width:32mm">${t("Amount (SAR)","المبلغ (ريال)")}</th></tr></thead>
  <tbody>${PAY.map(([m, p], i) => `<tr class="${i % 2 ? "z" : ""}"><td>${N("0" + (i + 1))}</td><td>${m}</td><td class="c" style="color:var(--gold);font-weight:700">${N(p + "%")}</td><td class="r"><b>${N(money(FEE * p / 100))}</b></td></tr>`).join("")}
  <tr class="tot"><td></td><td>${t("Total","الإجمالي")}</td><td class="c g">${N("100%")}</td><td class="r g">${N(money(FEE))}</td></tr></tbody>
</table>

<div class="sh"><h2>04 · ${t("Programme & Terms","المدة والشروط")}</h2></div>
<dl class="notes">
  <dt>${t("Duration","المدة")}</dt><dd>${t("4–6 weeks from receipt of the first payment, architectural plans and verified dimensions. Client review periods are excluded.","من 4 إلى 6 أسابيع من استلام الدفعة الأولى والمخططات المعمارية والأبعاد المعتمدة، ولا تشمل فترات مراجعة العميل.")}</dd>
  <dt>${t("Revisions","التعديلات")}</dt><dd>${t("Two rounds of revisions within the agreed scope are included.","يشمل العرض جولتين من التعديلات ضمن النطاق المتفق عليه.")}</dd>
  <dt>${t("Delivery","التسليم")}</dt><dd>${t("PDF drawings, renderings, the materials guide and the virtual tour file or link.","مخططات PDF، والصور ثلاثية الأبعاد، ودليل المواد، وملف أو رابط الجولة الافتراضية.")}</dd>
  <dt>${t("Excluded","غير مشمول")}</dt><dd>${t("Construction, procurement, site supervision, site measurement and MEP engineering design; quoted separately on request.","التنفيذ والتوريد والإشراف والرفع المساحي وتصميم الأعمال الكهروميكانيكية، وتُسعّر منفصلة عند الطلب.")}</dd>
  <dt>${t("VAT","الضريبة")}</dt><dd>${t("Amounts are exclusive of VAT, which is charged per Saudi regulations if applicable.","المبالغ غير شاملة ضريبة القيمة المضافة، وتُحتسب وفق الأنظمة السعودية إن وُجدت.")}</dd>
</dl>
</div></section>`;

document.getElementById("doc").innerHTML = p1;
window.__ready = true;
</script>
</body>
</html>
