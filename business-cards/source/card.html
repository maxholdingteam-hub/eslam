<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 90×50 mm trim + 3 mm bleed each side */
@page{size:96mm 56mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0908;--gold:#d8b46a;--gold-l:#efd79f;--txt:#ece5d8;--mute:#9b9183}
body{background:var(--bg)}
.c{position:relative;width:96mm;height:56mm;overflow:hidden;page-break-after:always;color:var(--txt);
  background:radial-gradient(60mm 40mm at 85% 0%,#20190f,transparent 70%),var(--bg)}
.safe{position:absolute;inset:7mm 8mm}            /* 3mm bleed + 4-5mm safe zone */
.frame{position:absolute;inset:6mm;border:.2mm solid rgba(216,180,106,.35)}
/* front */
.front .safe{display:flex;flex-direction:column;align-items:center;justify-content:center}
.front img{width:17mm}
.front .mk{font-family:Montserrat;font-weight:600;font-size:12pt;letter-spacing:.2em;color:var(--gold);margin-top:3mm;direction:ltr;padding-left:.2em}
.front .sub{font-family:Montserrat;font-size:4.4pt;letter-spacing:.28em;white-space:nowrap;color:var(--mute);margin-top:1.4mm;direction:ltr;padding-left:.42em}
.front .ln{width:10mm;height:.25mm;background:var(--gold);margin-top:3mm;opacity:.7}
.front .web{font-family:Montserrat;font-size:5pt;letter-spacing:.3em;color:var(--gold-l);margin-top:2.6mm;direction:ltr}
/* back */
.back .safe{display:grid;grid-template-columns:1fr auto;gap:5mm}
.nm{font-family:Amiri;font-weight:700;font-size:17pt;line-height:1.1;color:var(--txt)}
.en{font-family:"Cormorant Garamond";font-weight:600;font-size:11.5pt;color:var(--gold-l);direction:ltr;text-align:right;margin-top:.6mm}
.ti{font-family:"IBM Plex Sans Arabic";font-size:6.4pt;color:var(--gold);margin-top:1.6mm}
.ti span{font-family:Montserrat;font-size:4.6pt;letter-spacing:.25em;color:var(--mute);margin-inline-start:1.5mm}
.rule{width:12mm;height:.25mm;background:linear-gradient(270deg,var(--gold),transparent);margin:3mm 0 2.6mm}
.ct{display:grid;gap:1.35mm}
.ct div{display:flex;align-items:center;gap:2mm;font-family:Montserrat;font-weight:500;font-size:6.6pt;direction:ltr;justify-content:flex-end;color:var(--txt)}
.ct svg{width:2.6mm;height:2.6mm;flex:none;fill:none;stroke:var(--gold);stroke-width:1.6}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6mm;border-inline-start:.2mm solid rgba(216,180,106,.3);padding-inline-start:5mm}
.side img.l{width:9mm}
.side .qr{width:15mm;height:15mm;display:block}
.side .q{display:flex;flex-direction:column;align-items:center;gap:1mm}
.side small{font-family:Montserrat;font-size:3.8pt;letter-spacing:.3em;color:var(--mute);direction:ltr}
</style>
</head>
<body>

<section class="c front">
  <div class="frame"></div>
  <div class="safe">
    <img src="logo.png" alt="">
    <div class="mk">MAX DESIGN</div>
    <div class="sub">ARCHITECTURE, INTERIOR &amp; PROJECT MANAGEMENT</div>
    <div class="ln"></div>
    <div class="web">MAXDESIGN.SA</div>
  </div>
</section>

<section class="c back">
  <div class="safe">
    <div>
      <div class="nm">طلحة نياز</div>
      <div class="en">Talha Niaz</div>
      <div class="ti">المهندس المعماري المسؤول<span>LEAD ARCHITECT</span></div>
      <div class="rule"></div>
      <div class="ct">
        <div>+966 55 031 3745<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></div>
        <div>talhaniax@gmail.com<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3 7 9 6 9-6"/></svg></div>
        <div>maxdesign.sa<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div>
        <div>Riyadh, Saudi Arabia<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
      </div>
    </div>
    <div class="side">
      <div class="q"><img class="qr" src="qr-gold.svg" alt=""><small>WHATSAPP</small></div>
      <div class="q"><img class="qr" src="qr-web.svg" alt=""><small>WEBSITE</small></div>
    </div>
  </div>
</section>

</body>
</html>
