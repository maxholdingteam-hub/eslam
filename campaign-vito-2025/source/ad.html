<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=Unbounded:wght@600;800;900&family=Syncopate:wght@700&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505;font-family:Alexandria,sans-serif;color:#fff}
.layer{position:absolute;inset:0}
.bg{position:absolute;inset:-60px;background-size:cover;background-position:center}
.band{position:absolute;left:50%;top:50%;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.85)}
.band img,.full img{position:absolute;left:50%;top:50%;transform-origin:50% 50%;will-change:transform}
.full{position:absolute;inset:0;overflow:hidden}
.gold{background:linear-gradient(180deg,#fff3c4 0%,#f1c75a 38%,#a8761f 66%,#f8dc8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.18em;margin-bottom:-.18em}
.chrome{background:linear-gradient(180deg,#ffffff 0%,#d9dde3 40%,#7d848e 55%,#f4f6f8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.18em;margin-bottom:-.18em}
.sh{filter:drop-shadow(0 8px 30px rgba(0,0,0,.9)) drop-shadow(0 2px 4px rgba(0,0,0,.9))}
.txt{position:absolute;left:60px;right:60px;text-align:center;direction:rtl}
.lat{font-family:Montserrat,sans-serif;direction:ltr}
#scrim{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.65) 45%,transparent 100%)}
#scrimTop{position:absolute;left:0;right:0;top:0;height:620px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
#vig{background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.75) 100%)}
#grain{background-size:540px 960px;mix-blend-mode:overlay;opacity:.13}
#flash{background:#fff;opacity:0}
#sweep{mix-blend-mode:screen;opacity:0;background:linear-gradient(105deg,transparent 40%,rgba(255,240,210,.0) 44%,rgba(255,236,190,.55) 50%,rgba(255,240,210,0) 56%,transparent 60%);background-size:300% 100%}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:5}
#hud .c{position:absolute;width:70px;height:70px;border-color:rgba(230,185,80,.85);border-style:solid}
#counter{position:absolute;top:150px;left:70px;font:700 24px Syncopate;letter-spacing:.3em;color:#e6b94f}
#brandTag{position:absolute;top:146px;right:70px;font:700 24px Syncopate;letter-spacing:.2em;color:#fff}
#brandTag b{color:#e6b94f}
.line{height:3px;background:linear-gradient(90deg,transparent,#e6b94f,transparent);margin:0 auto}
.chip{display:inline-block;border:2px solid rgba(230,185,80,.9);color:#f6d98a;background:rgba(0,0,0,.55);padding:8px 30px;border-radius:60px;font-weight:800}
#dust i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff6d8 0%,rgba(255,220,150,.5) 40%,transparent 70%)}
/* offer */
#rays{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;background:repeating-conic-gradient(from 0deg,rgba(230,185,80,.16) 0deg 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0%,transparent 62%);mask:radial-gradient(circle,#000 0%,transparent 62%)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:6px solid #e6b94f}
#stamp{position:absolute;left:50%;top:50%;width:900px;margin-left:-450px;text-align:center;direction:rtl}
.shine{position:relative;overflow:hidden}
#cta{display:inline-flex;align-items:center;gap:22px;padding:26px 60px;border-radius:90px;background:linear-gradient(180deg,#fbe08f,#c8962e);color:#130d02;font-weight:900;font-size:56px;box-shadow:0 20px 60px rgba(230,185,80,.35)}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="scenes"></div>
  <div class="layer" id="scrimTop"></div>
  <div class="layer" id="scrimWrap"><div id="scrim"></div></div>
  <div class="layer" id="sweep"></div>
  <div class="layer" id="dust"></div>
  <div class="layer" id="offer" style="opacity:0"></div>
  <div class="layer" id="end" style="opacity:0"></div>
  <div class="layer" id="texts"></div>
  <div class="layer" id="vig"></div>
  <div class="layer" id="hud">
    <div class="c" id="c1" style="top:120px;left:40px;border-width:3px 0 0 3px"></div>
    <div class="c" id="c2" style="top:120px;right:40px;border-width:3px 3px 0 0"></div>
    <div class="c" id="c3" style="bottom:120px;left:40px;border-width:0 0 3px 3px"></div>
    <div class="c" id="c4" style="bottom:120px;right:40px;border-width:0 3px 3px 0"></div>
    <div id="counter" class="lat">01 / 07</div>
    <div id="badge" style="position:absolute;top:196px;left:50%;width:470px;margin-left:-235px;height:70px;border-radius:40px;background:linear-gradient(180deg,#fbe08f,#c8962e);box-shadow:0 0 40px rgba(230,185,80,.6);display:flex;align-items:center;justify-content:center;gap:14px;color:#140a01;direction:rtl;font-weight:900;font-size:38px">🔥 خصم قوي للكاش</div>
    <div id="brandTag" class="lat">MAX <b>MOTORS</b></div>
  </div>
  <div class="lb" id="lbT" style="top:0"></div>
  <div class="lb" id="lbB" style="bottom:0"></div>
  <div class="layer" id="grain"></div>
  <div class="layer" id="flash"></div>
</div>
<script>
const CFG = window.CFG;
const $ = s => document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);          // easeOutCubic
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eback=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,a,d)=>clamp((t-a)/d);

const LOGO = `<svg width="100%" height="100%" viewBox="-12 -12 354 274" fill="none" stroke-linejoin="round" stroke-linecap="round">
<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset=".45" stop-color="#e6b94f"/><stop offset=".75" stop-color="#c8641c"/><stop offset="1" stop-color="#ffc98a"/></linearGradient></defs>
<g stroke="url(#cg)">
<path class="lgp" pathLength="1" stroke-width="5" d="M0 0 L165 112 L330 0 L304 72 L286 168 L165 250 L44 168 L26 72 Z"/>
<path class="lgp" pathLength="1" stroke-width="3.2" d="M40 22 L165 140 L290 22 M40 22 L58 92 L64 160 L165 228 L266 160 L272 92 L290 22"/>
<path class="lgp" pathLength="1" stroke-width="2.4" d="M58 92 L165 172 L272 92 M64 160 L165 172 L266 160 M165 140 L165 228 M26 72 L58 92 M304 72 L272 92 M44 168 L64 160 M286 168 L266 160 M0 0 L40 22 M330 0 L290 22 M120 82 L110 118 M210 82 L220 118"/>
</g></svg>`;

// ---------- build scenes ----------
const scenesEl=$('#scenes'), textsEl=$('#texts');
CFG.scenes.forEach((s,i)=>{
  const w=document.createElement('div'); w.className='layer'; w.id='sc'+i; w.style.opacity=0;
  if(s.mode==='band'){
    w.innerHTML=`<div class="bg" style="background-image:url(img/${s.img}_bg.jpg)"></div><div class="band"><img src="img/${s.img}.jpg"></div>`;
  } else {
    w.innerHTML=`<div class="full"><img src="img/${s.img}.jpg"></div>`;
  }
  scenesEl.appendChild(w);
  const t=document.createElement('div'); t.className='layer'; t.id='tx'+i; t.style.opacity=0;
  t.innerHTML=s.html; textsEl.appendChild(t);
});
// dust
const dust=$('#dust'); const P=[];
for(let i=0;i<46;i++){const e=document.createElement('i');const r=(Math.sin(i*91.7)*43758.5453)%1;const r2=(Math.sin(i*12.9)*12345.678)%1;const r3=(Math.sin(i*3.1)*9876.54)%1;
 const sz=4+Math.abs(r3)*14;e.style.width=e.style.height=sz+'px';dust.appendChild(e);P.push({e,x:Math.abs(r)*1080,y:Math.abs(r2)*1920,sp:12+Math.abs(r3)*40,ph:i});}

// offer layer
$('#offer').innerHTML = `
 <div class="bg" style="background-image:url(img/${CFG.offerImg}.jpg);opacity:.55;filter:blur(3px)"></div>
 <div class="layer" style="background:radial-gradient(circle at 50% 48%,rgba(60,40,10,.35),rgba(0,0,0,.82) 70%)"></div>
 <div id="rays"></div>
 <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
 <div id="stamp">
   <div id="o1" class="chip" style="font-size:44px">🔥 عرض حصري اليوم</div>
   <div style="height:0"></div><div id="o2" class="gold sh" style="display:inline-block;font-size:158px;font-weight:900;line-height:1.25;margin-top:0;white-space:nowrap;padding:0 .2em .25em;margin-bottom:-.25em">خصم قوي</div>
   <div id="o3" class="sh" style="font-size:118px;font-weight:900;line-height:1.1">للدفع <span class="gold">كاش</span></div>
   <div id="o4" class="line" style="width:520px;margin-top:34px"></div>
   <div id="o5" style="font-size:52px;font-weight:800;margin-top:26px;color:#f3e6c8">لفترة محدودة · الكمية محدودة</div><div id="o6" style="margin-top:60px;font-size:44px;font-weight:800;color:#fff">اتصل الآن <span class="lat gold" style="font-family:Unbounded;font-weight:800;font-size:60px">920018915</span></div>
 </div>`;
$('#end').innerHTML = `
 <div class="layer" style="background:radial-gradient(900px 900px at 50% 42%,#241b08,#050404 70%)"></div>
 <div class="layer" id="horizon" style="background:radial-gradient(ellipse 70% 6% at 50% 63%,rgba(255,214,120,.8),rgba(230,170,60,.25) 40%,transparent 70%)"></div>
 <div class="layer" id="endRays" style="opacity:.0;background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(230,185,80,.07) 0deg 4deg,transparent 4deg 14deg)"></div>
 <div style="position:absolute;left:0;right:0;top:250px;text-align:center">
   <div id="logo" style="width:640px;margin:0 auto;position:relative"><img src="img/lockup.png" style="width:100%;display:block"><div id="lgShine" style="position:absolute;inset:0;-webkit-mask:url(img/lockup.png) center/100% 100% no-repeat;mask:url(img/lockup.png) center/100% 100% no-repeat;mix-blend-mode:overlay"></div></div>
   <div id="wm" style="display:none"></div>
   <div id="wmAr" class="gold" style="font-weight:800;font-size:62px;margin-top:0;direction:rtl">ماكس موتورز</div>
   <div id="eLine" class="line" style="width:420px;margin-top:40px"></div>
   <div id="e1" style="direction:rtl;font-weight:800;font-size:66px;margin-top:44px">مرسيدس فيتو 2025</div>
   <div id="e2" style="direction:rtl;font-weight:800;font-size:52px;margin-top:6px" class="gold">خصم قوي للكاش · الكمية محدودة</div>
   <div style="margin-top:50px"><div id="cta">احجز الآن <span style="font-size:50px">←</span></div></div>
   <div id="e3" style="margin-top:46px"><div style="direction:rtl;font-weight:700;font-size:38px;color:#d9ccb0">الرقم الموحد</div><div class="lat gold" style="font-family:Unbounded;font-weight:800;font-size:92px;letter-spacing:.03em">920018915</div><div style="direction:rtl;font-weight:700;font-size:40px;color:#efe2cf;margin-top:8px">واتساب <span class="lat" style="font-family:Unbounded;font-weight:600">0533393397</span></div></div>
 </div>`;

// ---------- text animation helpers ----------
function animText(el,t,dur){
  // children with data-d (delay) get staggered rise+blur reveal; exit in last .35s
  const kids=el.querySelectorAll('[data-d]');
  kids.forEach(k=>{
    const d=+k.dataset.d; const p=eo(prog(t,d,.55)); const ex=eio(prog(t,dur-.32,.32));
    const ty=lerp(70,0,p) - ex*40, bl=lerp(14,0,p)+ex*12, op=p*(1-ex);
    k.style.transform=`translateY(${ty}px)`+(k.dataset.ls?``:``); k.style.opacity=op; k.style.filter=`blur(${bl}px)`;
    if(k.dataset.ls){k.style.letterSpacing=lerp(+k.dataset.ls+.4,+k.dataset.ls,eo(prog(t,d,1.2)))+'em'}
    if(k.classList.contains('line')){k.style.transform=`scaleX(${eo(prog(t,d,.7))*(1-ex)})`;k.style.filter='none';k.style.opacity=1}
  });
}

// ---------- render ----------
window.render = function(T){
  const S=CFG.scenes; let cur=-1;
  for(let i=0;i<S.length;i++){ if(T>=S[i].a && T<S[i].b) cur=i; }
  const hits=CFG.hits;
  // scenes
  S.forEach((s,i)=>{
    const w=$('#sc'+i), tx=$('#tx'+i);
    const on = T>=s.a-0.0 && T<s.b+0.12;
    if(!on){w.style.opacity=0;tx.style.opacity=0;return;}
    const t=T-s.a, dur=s.b-s.a, p=clamp(t/dur);
    w.style.opacity = i===cur?1:clamp(1-(T-s.b)/0.12);
    const punch = 1+0.16*(1-eo(prog(t,0,.45)));          // zoom-punch entry
    if(s.mode==='band'){
      const bw=1080, img=w.querySelector('img'), band=w.querySelector('.band');
      const ar=s.ar, bh=Math.round(bw/ar);
      band.style.width=bw+'px'; band.style.height=bh+'px'; band.style.marginLeft=-bw/2+'px'; band.style.marginTop=(-bh/2+(s.dy||0))+'px';
      const z=(s.z0||1.04)+((s.z1||1.14)-(s.z0||1.04))*eio(p);
      const px=lerp(s.px0||0,s.px1||0,eio(p));
      img.style.width=bw+'px'; img.style.height=bh+'px'; img.style.marginLeft=-bw/2+'px'; img.style.marginTop=-bh/2+'px';
      img.style.transform=`translateX(${px}px) scale(${z*punch})`;
      const reveal=eo(prog(t,0,.5)); band.style.clipPath=`inset(${(1-reveal)*50}% 0 ${(1-reveal)*50}% 0)`;
      w.querySelector('.bg').style.transform=`scale(${1.1+0.08*p})`;
    } else {
      const img=w.querySelector('img'); const h=1920*(s.h||1.0), wd=h*s.ar;
      img.style.width=wd+'px'; img.style.height=h+'px'; img.style.marginLeft=-wd/2+'px'; img.style.marginTop=-h/2+'px';
      const px=lerp(s.px0||0,s.px1||0,eio(p)), py=lerp(s.py0||0,s.py1||0,eio(p));
      const z=lerp(s.z0||1.0,s.z1||1.08,eio(p));
      img.style.transform=`translate(${px}px,${py}px) scale(${z*punch})`;
    }
    tx.style.opacity=1; animText(tx,t,dur);
  });
  // scrims: show bottom scrim on full scenes
  const sc=S[cur]; $('#scrimWrap').style.opacity = sc && sc.mode==='full'?1:0.55;
  // flash on hits
  let fl=0; hits.forEach(h=>{const d=T-h; if(d>=0&&d<.35) fl=Math.max(fl,(1-d/.35)*0.85);});
  CFG.cuts.forEach(h=>{const d=T-h; if(d>=0&&d<.18) fl=Math.max(fl,(1-d/.18)*0.35);});
  $('#flash').style.opacity=fl;
  // sweep at each scene start
  let sw=0, swp=0; S.forEach(s=>{const d=T-s.a-.35; if(d>=0&&d<1.1){sw=Math.sin(Math.PI*d/1.1)*.9; swp=d/1.1;}});
  $('#sweep').style.opacity=sw; $('#sweep').style.backgroundPosition=`${lerp(110,-10,swp)}% 0`;
  // letterbox: opening + offer
  const lbo = 1-eio(prog(T,0.2,1.4));
  const lbh = 240*lbo + 0;
  $('#lbT').style.height=$('#lbB').style.height=lbh+'px';
  // hud
  const hudOn = T>0.6 && T<CFG.offerAt ? 1:0;
  $('#hud').style.opacity = hudOn*clamp((T-.6)/.5)*clamp((CFG.offerAt-T)/.2);
  const hp=1-eo(prog(T,.6,.8)); ['#c1','#c2','#c3','#c4'].forEach((c,k)=>{$(c).style.transform=`translate(${(k%2?1:-1)*hp*60}px,${(k<2?-1:1)*hp*60}px)`});
  const bg=$('#badge'); const bt=T-4.75; bg.style.opacity=bt>0?1:0; bg.style.transform=`scale(${bt>0?eback(clamp(bt/.45))*(1+.035*Math.sin(T*6)):0})`;
  $('#counter').textContent = String(Math.max(1,cur+1)).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  // dust
  P.forEach(o=>{const y=(o.y - T*o.sp + 1920*4)%1920; const x=o.x+Math.sin(T*.7+o.ph)*20; o.e.style.transform=`translate(${x}px,${y}px)`; o.e.style.opacity=.35+.35*Math.sin(T*2+o.ph);});
  dust.style.opacity = T<CFG.endAt?0.8:0.5;
  // grain
  $('#grain').style.backgroundImage=`url(img/grain${Math.floor(T*24)%6}.png)`;

  // ---------- OFFER ----------
  const oa=CFG.offerAt, oe=CFG.endAt, ot=T-oa; const off=$('#offer');
  if(T>=oa-0.05 && T<oe+0.3){
    off.style.opacity = clamp((T-oa+.05)/.05)*(1-clamp((T-oe)/.3));
    $('#rays').style.transform=`rotate(${ot*12}deg) scale(${.6+.4*eo(prog(ot,0,.6))})`; $('#rays').style.opacity=eo(prog(ot,0,.5));
    [['#r1',0],['#r2',.18]].forEach(([id,d])=>{const p=prog(ot,d,.9); const r=lerp(100,1500,eo(p)); const e=$(id); e.style.width=e.style.height=r+'px'; e.style.margin=`${-r/2}px 0 0 ${-r/2}px`; e.style.opacity=(1-p)*.9; e.style.borderWidth=lerp(18,1,p)+'px';});
    const st=$('#stamp'); const sp=prog(ot,0,.42); const sc2=lerp(2.6,1,eback(sp));
    const shake = ot<.6 ? Math.sin(ot*90)*22*(1-ot/.6):0;
    st.style.transform=`translate(${shake}px,-50%) scale(${sc2*(1+0.025*Math.sin(Math.max(0,ot-.6)*6))})`; st.style.opacity=clamp(sp*3);
    const o1=$('#o1'),o3=$('#o3'),o4=$('#o4'),o5=$('#o5');
    o1.style.opacity=eo(prog(ot,.5,.4)); o1.style.transform=`translateY(${lerp(-40,0,eo(prog(ot,.5,.4)))}px)`;
    const p3=eo(prog(ot,.7,.45)); o3.style.opacity=p3; o3.style.transform=`translateY(${lerp(60,0,p3)}px)`; o3.style.filter=`blur(${lerp(10,0,p3)}px)`;
    o4.style.transform=`scaleX(${eo(prog(ot,1.0,.6))})`;
    const p5=eo(prog(ot,1.2,.5)); o5.style.opacity=p5; o5.style.transform=`translateY(${lerp(40,0,p5)}px)`; const p6=eback(prog(ot,1.6,.5)); $('#o6').style.opacity=clamp(prog(ot,1.6,.2)); $('#o6').style.transform=`scale(${p6})`;
    // shine sweep on main word
    const o2=$('#o2'); const shp=((ot-0.6)%1.6)/1.6;
    o2.style.backgroundImage=`linear-gradient(105deg,rgba(255,255,255,0) ${lerp(-30,130,shp)-8}%,rgba(255,255,255,.95) ${lerp(-30,130,shp)}%,rgba(255,255,255,0) ${lerp(-30,130,shp)+8}%),linear-gradient(180deg,#fff3c4 0%,#f1c75a 38%,#a8761f 66%,#f8dc8a 100%)`;
    // shake whole stage at slam
    $('#stage').style.transform = ot>=0&&ot<.5?`translate(${Math.sin(ot*120)*14*(1-ot/.5)}px,${Math.cos(ot*97)*10*(1-ot/.5)}px)`:'none';
  } else { off.style.opacity=0; $('#stage').style.transform='none'; }

  // ---------- END ----------
  const et=T-oe; const end=$('#end');
  if(T>=oe-0.05){
    end.style.opacity=clamp((et+.05)/.25);
    document.querySelectorAll('.lgp').forEach((p,k)=>{const q=eio(prog(et,.05+k*.18,.9)); p.style.strokeDasharray='1 1'; p.style.strokeDashoffset=1-q;});
    $('#logo').style.transform=`scale(${lerp(.7,1,eo(prog(et,0,1.2)))})`;
    $('#logo').style.filter=`drop-shadow(0 0 ${lerp(10,50,Math.sin(Math.PI*clamp(et/1.4)))}px rgba(230,185,80,.5)) brightness(${eo(prog(et,0,.6))})`; const lsp=lerp(-40,140,clamp((et-.5)/1.2)); $('#lgShine').style.background=`linear-gradient(110deg,transparent ${lsp-12}%,rgba(255,255,255,.95) ${lsp}%,transparent ${lsp+12}%)`;
    const w1=eo(prog(et,.7,.8)); $('#wm').style.opacity=w1; $('#wm').style.letterSpacing=lerp(.25,.04,w1)+'em'; $('#wm').style.filter=`blur(${lerp(12,0,w1)}px)`;
    const w2=eo(prog(et,1.0,.6)); $('#wmAr').style.opacity=w2; $('#wmAr').style.transform=`translateY(${lerp(30,0,w2)}px)`;
    $('#eLine').style.transform=`scaleX(${eo(prog(et,1.2,.7))})`;
    [['#e1',1.5],['#e2',1.75],['#e3',2.3]].forEach(([id,d])=>{const q=eo(prog(et,d,.5)); const e=$(id); e.style.opacity=q; e.style.transform=`translateY(${lerp(40,0,q)}px)`;});
    const c=eback(prog(et,2.0,.5)); $('#cta').style.transform=`scale(${c*(1+0.04*Math.sin(Math.max(0,et-2.5)*7))})`; $('#cta').style.opacity=clamp(prog(et,2.0,.2));
    $('#endRays').style.opacity=.9*eo(prog(et,.3,1)); $('#horizon').style.opacity=eo(prog(et,.2,1.2)); $('#horizon').style.transform=`scaleX(${lerp(.2,1,eo(prog(et,.2,1.4)))})`; $('#endRays').style.transform=`rotate(${et*4}deg) scale(1.6)`;
    // final fade out
    $('#stage').style.filter = `brightness(${1-eio(prog(T,CFG.total-.45,.45))})`;
  } else end.style.opacity=0;
};
window.ready = () => document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))));
</script>
</body>
