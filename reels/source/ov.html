<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"IBM Plex Sans Arabic",sans-serif;color:#fff}
.foil{background:linear-gradient(180deg,#fff1c6 0%,#f0cf82 30%,#c99a45 62%,#f3d68f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t{position:absolute;left:70px;right:70px;text-align:center;font-weight:700;line-height:1.25;filter:drop-shadow(0 6px 24px rgba(0,0,0,.9)) drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.chip{display:inline-block;font-size:30px;font-weight:600;letter-spacing:.02em;color:#f6dc9c;border:1.5px solid rgba(217,180,107,.8);background:rgba(7,6,5,.55);padding:10px 26px;margin-bottom:22px;filter:none}
.bar{width:120px;height:3px;margin:26px auto 0;background:linear-gradient(90deg,transparent,#d9b46b,transparent)}
/* end card */
.end{background:radial-gradient(900px 900px at 50% 40%,#1d160b,#070605 70%)}
.end .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:120px}
.end img{width:380px;filter:drop-shadow(0 10px 40px rgba(217,180,107,.35))}
.end .wm{font-family:Montserrat;font-weight:700;font-size:96px;letter-spacing:.06em;margin-top:14px;direction:ltr}
.end .tg{font-family:Montserrat;font-weight:500;font-size:21px;letter-spacing:.34em;color:#d8c7a2;margin-top:18px;direction:ltr;padding-left:.34em}
.end .ln{width:160px;height:2px;margin:56px 0 48px;background:linear-gradient(90deg,transparent,#d9b46b,transparent)}
.end .cta{font-size:58px;font-weight:700}
.end .row{display:flex;align-items:center;gap:20px;margin-top:40px;direction:ltr;font-family:Montserrat;font-weight:600;font-size:52px;color:#f6dc9c}
.end .row svg{width:60px;height:60px}
.end .web{font-family:Montserrat;font-weight:500;font-size:40px;letter-spacing:.08em;color:#e9dcc0;margin-top:22px;direction:ltr}
</style>
</head>
<body>
<section class="f" id="t1"><div class="t" style="top:1180px;font-size:92px">شقتك على العضم؟</div></section>
<section class="f" id="t2"><div class="t foil" style="top:1180px;font-size:104px">خلّها علينا.</div></section>
<section class="f" id="t3"><div class="t" style="top:1170px"><div style="font-size:84px">ما نصمم مساحات</div><div class="foil" style="font-size:96px">نصمم أسلوب حياة</div></div></section>
<section class="f" id="t4"><div class="t" style="top:300px"><div class="chip">قصور · فلل · شقق · مكاتب · محلات</div><div style="font-size:88px">من الفكرة</div><div class="foil" style="font-size:100px">لين التسليم</div></div></section>
<section class="f" id="t5"><div class="t" style="top:1200px"><div class="foil" style="font-size:104px">ابدأ مشروعك اليوم</div><div class="bar"></div></div></section>
<section class="f end" id="t6"><div class="in">
  <img src="../poster/logo.png" alt="">
  <div class="wm foil">MAX DESIGN</div>
  <div class="tg">ARCHITECTURE, INTERIOR &amp; PROJECT MANAGEMENT</div>
  <div class="ln"></div>
  <div class="cta">تواصل معنا على الواتساب</div>
  <div class="row"><svg viewBox="0 0 32 32"><path fill="#d9b46b" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2a13 13 0 0 0 6.6 1.8C23.2 28.8 29 23 29 15.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.7l-.4-.3-3.8 1.2 1.2-3.7-.3-.4A10.4 10.4 0 0 1 5.6 15.8C5.6 10.1 10.3 5.5 16 5.5s10.4 4.6 10.4 10.3S21.7 26.4 16 26.4zm5.7-7.7c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6.3-.5c.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.3-.6-.4z"/></svg>0533393397</div>
  <div class="web">maxdesign.sa</div>
</div></section>
</body>
</html>
