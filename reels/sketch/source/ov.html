<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{background:transparent}
section{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Kufi Arabic";color:#f2ece0}
.mono{font-family:"IBM Plex Mono";direction:ltr;letter-spacing:.1em;text-transform:uppercase}
.card{position:absolute;top:250px;left:50%;transform:translateX(-50%);background:rgba(16,14,11,.82);padding:30px 48px 34px;text-align:center;border-top:4px solid #d9b46b;min-width:640px}
.card .mono{font-size:22px;color:#d9b46b}
.card h1{font-size:74px;font-weight:900;line-height:1.35;margin-top:8px}
.card h1 em{font-style:normal;color:#d9b46b}
.chip{position:absolute;top:260px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:rgba(16,14,11,.82);padding:16px 34px;border-top:4px solid #d9b46b;white-space:nowrap}
.chip b{font-size:50px;font-weight:900}.chip .mono{font-size:22px;color:#d9b46b}
.end{background:#efe9de;color:#1b1915}
.end .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:180px;text-align:center}
.end img{width:260px;margin-bottom:24px}
.end .hand{font-family:Caveat;font-size:58px;color:#7a6a4e;direction:ltr;margin-bottom:10px}
.end h1{font-size:76px;font-weight:900;line-height:1.35}
.end h1 em{font-style:normal;color:#9a7634}
.end .s{font-size:32px;color:#6b6556;margin-top:8px}
.end .line{width:120px;height:3px;background:#b8924a;margin:42px 0}
.end .c{font-size:38px;font-weight:600}
.end .p{font-family:"IBM Plex Mono";font-weight:500;font-size:66px;letter-spacing:.06em;color:#9a7634;direction:ltr;margin-top:6px}
.end .u{font-family:"IBM Plex Mono";font-size:26px;letter-spacing:.3em;color:#8f8676;margin-top:18px;direction:ltr}
.end .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(27,25,21,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(27,25,21,.06) 1px,transparent 1px);background-size:54px 54px}
</style></head><body>
<section id="hook"><div class="card"><div class="mono">Sketch → Reality</div><h1>من الورق…<br><em>للواقع</em></h1></div></section>
<section id="s1"><div class="chip"><b>فيلا مودرن</b><span class="mono">01 / 03</span></div></section>
<section id="s2"><div class="chip"><b>مجلس</b><span class="mono">02 / 03</span></div></section>
<section id="s3"><div class="chip"><b>درج معلّق</b><span class="mono">03 / 03</span></div></section>
<section id="end" class="end"><div class="grid"></div><div class="in"><img src="logo.png"><div class="hand">it all starts with a line.</div><h1>كل مشروع يبدأ<br>بـ<em>خط قلم</em></h1><div class="s">تصميم داخلي · معماري · تنفيذ</div><div class="line"></div><div class="c">ابدأ مشروعك على واتساب</div><div class="p">0579277975</div><div class="u">MAXDESIGN.SA</div></div></section>
</body></html>
