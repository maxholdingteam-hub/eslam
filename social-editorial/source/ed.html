<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{background:#222}
:root{--cr:#f3ede3;--ink:#14110d;--g:#c9a35c;--g2:#e8cf96;--mut:#8a7f70}
.f{position:relative;width:1080px;overflow:hidden;font-family:"IBM Plex Sans Arabic",sans-serif;margin-bottom:20px}
.p45{height:1350px}.p916{height:1920px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.en{font-family:Montserrat,sans-serif;direction:ltr;letter-spacing:.32em;text-transform:uppercase}
.bod{font-family:"Bodoni Moda",serif;direction:ltr}
.am{font-family:Amiri,serif;font-weight:700}
.foil{background:linear-gradient(180deg,#fff1c6,#f0cf82 35%,#b8893f 68%,#f0d48e);-webkit-background-clip:text;background-clip:text;color:transparent}
.ft{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;align-items:center;font-size:22px}
.ft img{height:46px}.ft .en{font-size:17px;letter-spacing:.24em}
.dark{color:#f3ede3}.light{background:var(--cr);color:var(--ink)}
/* 1 cover */
.c1 .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.62) 0%,rgba(10,8,6,0) 28%,rgba(10,8,6,0) 52%,rgba(10,8,6,.85) 100%)}
.c1 .mast{position:absolute;top:58px;left:0;right:0;text-align:center}
.c1 .mast .bod{font-size:126px;font-weight:500;letter-spacing:.03em;line-height:1}
.c1 .mast .row{display:flex;justify-content:space-between;margin:18px 64px 0;font-size:17px;border-top:1px solid rgba(243,237,227,.5);padding-top:14px}
.c1 .hd{position:absolute;right:64px;left:64px;bottom:150px}
.c1 .hd .k{font-size:22px;color:var(--g2);letter-spacing:.3em}
.c1 .hd h1{font-size:132px;line-height:1.05;margin:10px 0 18px}
.c1 .hd p{font-size:34px;font-weight:300;opacity:.92;max-width:760px}
/* 2 annotated */
.c2{padding:64px}.c2 .ph{position:absolute;left:64px;right:64px;top:64px;bottom:290px;overflow:hidden}
.c2 .ph img{width:100%;height:100%;object-fit:cover}
.pin{position:absolute;display:flex;align-items:center;gap:0}
.pin i{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.35);flex:none}
.pin b{display:block;height:1.5px;background:#fff;width:120px}
.pin span{background:rgba(20,17,13,.78);color:#f3ede3;padding:12px 22px;font-size:27px;font-weight:500;backdrop-filter:blur(6px);white-space:nowrap}
.pin span small{display:block;font-family:Montserrat;font-size:14px;letter-spacing:.2em;color:var(--g2);direction:ltr;text-align:right}
.c2 .cap{position:absolute;left:64px;right:64px;bottom:120px;display:flex;justify-content:space-between;align-items:flex-end}
.c2 .cap h2{font-size:64px}.c2 .cap .en{font-size:16px;color:var(--mut)}
/* 3 moodboard */
.c3 .arch{position:absolute;right:64px;top:64px;width:560px;bottom:220px;border-radius:280px 280px 0 0;overflow:hidden}
.c3 .arch img{width:100%;height:100%;object-fit:cover}
.c3 .side{position:absolute;left:64px;width:350px;top:90px;bottom:220px;display:flex;flex-direction:column}
.c3 .side .en{font-size:15px;color:var(--mut)}
.c3 .side h2{font-size:84px;line-height:1.1;margin:14px 0 22px}
.c3 .side p{font-size:25px;line-height:1.7;color:#4a4338}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:22px 18px;margin-top:auto}
.sw div{font-size:21px}.sw i{display:block;width:100%;aspect-ratio:1.4;border-radius:4px;margin-bottom:8px;border:1px solid rgba(0,0,0,.08)}
.sw small{font-family:Montserrat;font-size:13px;color:var(--mut);letter-spacing:.12em;display:block;direction:ltr;text-align:right}
/* 4 facade */
.c4 .fr{position:absolute;inset:40px;border:1.5px solid rgba(243,237,227,.7)}
.c4 .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.55),rgba(8,10,14,0) 35%,rgba(8,10,14,0) 60%,rgba(8,10,14,.8))}
.c4 .top{position:absolute;top:96px;left:96px;right:96px;display:flex;justify-content:space-between;font-size:16px}
.c4 .hd{position:absolute;left:96px;right:96px;bottom:160px;text-align:center}
.c4 .hd h2{font-size:104px;line-height:1.15;text-shadow:0 4px 30px rgba(0,0,0,.6)}.c4 .hd p{font-size:30px;font-weight:300;margin-top:14px;opacity:.9}
.c4 .ln{width:120px;height:1.5px;background:var(--g);margin:26px auto 0}
/* 5 quote */
.c5{background:#0f0d0a;color:var(--cr)}
.c5 .q{position:absolute;right:80px;left:80px;top:150px}
.c5 .q .mk{font-family:"Bodoni Moda";font-size:220px;line-height:.6;color:var(--g)}
.c5 .q h2{font-size:104px;line-height:1.3;margin-top:30px}
.c5 .q p{font-size:28px;color:#b9ab95;margin-top:28px}
.c5 .ph{position:absolute;left:80px;width:400px;height:520px;bottom:150px;border-radius:200px 200px 0 0;overflow:hidden}
.c5 .ph img{width:100%;height:100%;object-fit:cover}
.c5 .meta{position:absolute;right:80px;bottom:170px;text-align:right}
.c5 .meta .en{font-size:15px;color:var(--g2)}.c5 .meta div{font-size:26px;margin-top:8px;color:#d9cfbf}
/* 6 tips */
.c6 .ph{position:absolute;left:0;right:0;top:0;overflow:hidden}.c6 .ph img{width:100%;height:100%;object-fit:cover}
.c6 .tag{position:absolute;top:56px;right:64px;background:var(--cr);color:var(--ink);padding:10px 24px;font-size:24px;font-weight:600}
.c6 .bd{position:absolute;left:64px;right:64px;bottom:120px}
.c6 h2{font-size:62px;line-height:1.2;margin-bottom:22px}
.c6 ol{list-style:none;display:grid;gap:14px}
.c6 li{display:flex;gap:22px;align-items:baseline;font-size:28px;line-height:1.5;border-top:1px solid rgba(20,17,13,.15);padding-top:14px}
.p916.c6 h2{font-size:80px}.p916.c6 li{font-size:36px;padding-top:22px}.p916.c6 ol{gap:22px}.p916.c6 .bd{top:59%;bottom:auto}.p916.c6 .ph{height:55%!important}
.c6 li em{font-family:"Bodoni Moda";font-style:italic;font-size:40px;color:var(--g);min-width:44px;direction:ltr}
</style></head><body>
<script>
const LOGO='<img src="logo.png">';
const FT=(cls)=>`<div class="ft ${cls}"><div class="en">maxdesign.sa</div>${LOGO}<div class="en">@maxdesign.sa</div></div>`;
const posts={
c1:(s)=>`<img class="bg" src="img/0.jpg"><div class="sh"></div><div class="mast dark"><div class="bod foil">MAX DESIGN</div><div class="row en"><span>Riyadh</span><span>Issue N°01</span><span>Interiors</span></div></div>
<div class="hd dark"><div class="k en">Quiet Luxury</div><h1 class="am">الفخامة<br><span class="foil">الهادئة</span></h1><p>مجلس سعودي بروح معاصرة — خامات طبيعية، إضاءة دافئة، وتفاصيل تُحَسّ قبل ما تُشاف.</p></div>${FT('dark')}`,
c2:(s)=>`<div class="ph"><img src="img/1.jpg">
<div class="pin" style="top:${s?24:20}%;right:34%"><i></i><b></b><span>رخام كالاكاتا فيولا<small>CALACATTA VIOLA</small></span></div>
<div class="pin" style="top:${s?48:46}%;left:30%;flex-direction:row-reverse"><i></i><b></b><span>خشب بلوط مضلّع<small>FLUTED OAK</small></span></div>
<div class="pin" style="top:${s?70:72}%;right:28%"><i></i><b></b><span>نحاس مصقول<small>BRUSHED BRASS</small></span></div></div>
<div class="cap"><div><div class="en">Material Study · 02</div><h2 class="am">التفاصيل تصنع الفرق</h2></div></div>${FT('')}`,
c3:(s)=>`<div class="arch"><img src="img/5.jpg"></div><div class="side"><div class="en">Mood Board</div><h2 class="am">لوحة<br>المواد</h2><p>قبل أي رسمة، نختار معك الخامات والألوان على الطبيعة — عشان النتيجة تطلع زي ما تخيلتها بالضبط.</p>
<div class="sw"><div><i style="background:#e9e0d1"></i>عاجي<small>#E9E0D1</small></div><div><i style="background:#cdb89a"></i>رملي<small>#CDB89A</small></div><div><i style="background:#8c7258"></i>جوزي<small>#8C7258</small></div><div><i style="background:#b8924f"></i>نحاسي<small>#B8924F</small></div></div></div>${FT('')}`,
c4:(s)=>`<img class="bg" src="img/2.jpg"><div class="sh"></div><div class="fr"></div><div class="top en dark"><span>Architecture</span><span>Villa · Riyadh</span></div>
<div class="hd dark"><h2 class="am">نصمّم <span style="color:#e8cf96">الواجهة</span><br>اللي تعبّر عنك</h2><p>تصميم معماري · داخلي · إدارة مشاريع</p><div class="ln"></div></div>${FT('dark')}`,
c5:(s)=>`<div class="q"><div class="mk">“</div><h2 class="am">التصميم الجيد<br>ما ينشاف…<br><span class="foil">ينحسّ.</span></h2><p>فلسفتنا في كل مساحة نصممها</p></div><div class="ph"><img src="img/3.jpg"></div>
<div class="meta"><div class="en">Max Design Studio</div><div>غرفة نوم رئيسية · الرياض</div></div>${FT('dark')}`,
c6:(s)=>`<div class="ph" style="height:${s?54:50}%"><img src="img/4.jpg"></div><div class="tag">احفظ البوست</div>
<div class="bd"><h2 class="am">٣ أسرار لغرفة طعام فاخرة</h2><ol>
<li><em>01</em><span>إضاءة معلّقة بحجم الطاولة — هي نجمة المكان.</span></li>
<li><em>02</em><span>خامة واحدة قوية: ترافرتين أو رخام، والباقي هادئ.</span></li>
<li><em>03</em><span>كراسي منحنية تكسر حدّة الخطوط وتريح العين.</span></li></ol></div>${FT('')}`};
const L={c1:'dark',c2:'light',c3:'light',c4:'dark',c5:'dark',c6:'light'};
let h='';for(const fmt of ['p45','p916'])for(const k in posts)h+=`<section class="f ${fmt} ${k} ${L[k]==='light'?'light':''}" id="${k}_${fmt}">${posts[k](fmt==='p916')}</section>`;
document.body.innerHTML=h;
</script></body></html>
