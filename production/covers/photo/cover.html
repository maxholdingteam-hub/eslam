<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Cairo}
#im{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#sh{position:absolute;left:0;right:0;top:1150px;bottom:0;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.75) 30%,#000 75%)}
#cat{position:absolute;left:0;right:0;top:1235px;text-align:center}
#cat span{display:inline-block;direction:rtl;background:#C9A227;color:#0b0b0c;font-weight:800;font-size:40px;padding:4px 34px 6px;border-radius:12px}
#ti{position:absolute;left:40px;right:40px;top:1310px;text-align:center;direction:rtl;color:#fff;font-weight:900;font-size:118px;line-height:1.15;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#ti b{color:#C9A227;font-weight:900}
#lg{position:absolute;left:50%;top:1612px;width:270px;margin-left:-135px}
#ol{position:absolute;border:6px dashed rgba(255,255,255,.9);border-radius:46px;display:none}
</style></head><body>
<img id="im"><div id="ol"></div><div id="sh"></div><div id="cat"><span id="ca"></span></div><div id="ti"></div><img id="lg" src="logo.png">
<script>
let D=[];fetch('covers.json').then(r=>r.json()).then(d=>D=d);
window.render=async function(i){i=Math.round(i);const c=D[i];const im=document.getElementById('im');
 await new Promise(r=>{im.onload=r;im.src=c.img});
 const ol=document.getElementById('ol');ol.style.display=c.outline?'block':'none';
 if(c.outline){ol.style.left='30px';ol.style.top='499px';ol.style.width='1016px';ol.style.height='640px';}
 document.getElementById('ca').textContent=c.cat;const ti=document.getElementById('ti');ti.innerHTML=c.title;
 let fs=118;ti.style.fontSize=fs+'px';while(ti.scrollHeight>290&&fs>72){fs-=4;ti.style.fontSize=fs+'px'}};
</script></body></html>
