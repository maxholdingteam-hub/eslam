<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Land Cruiser vs LX 700h</title>
<style>
  @font-face{font-family:Cairo;font-weight:900;src:url(../fonts/Cairo-Black.ttf)}
  @font-face{font-family:Cairo;font-weight:700;src:url(../fonts/Cairo-Bold.ttf)}
  @font-face{font-family:Tajawal;font-weight:700;src:url(../fonts/Tajawal-Bold.ttf)}
  @font-face{font-family:Oswald;font-weight:600;src:url(../fonts/Oswald-SemiBold.ttf)}
  @font-face{font-family:Anton;src:url(../fonts/Anton.woff2)}
  @font-face{font-family:Michroma;src:url(../fonts/Michroma.woff2)}
  :root{--gold:#D4AF6A;--gold2:#F3D9A0;--gold3:#A9813F;--ink:#0B0B0C}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;overflow:hidden}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
  .sc{position:absolute;inset:0;overflow:hidden;display:none}
  .a{position:absolute}
  .ctr{left:0;right:0;text-align:center}
  .lat{direction:ltr;font-family:Michroma}
  .gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .half{position:absolute;left:0;width:1080px;height:930px;overflow:hidden}
  .half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.15),rgba(11,11,12,.72))}
  .val{position:absolute;left:0;right:0;text-align:center;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.75)}
  .val .n{font:600 230px/1 Oswald;direction:ltr;display:block}
  .val .u{font:700 48px Tajawal;color:#EDE3D0;display:block;margin-top:6px}
  .tag{position:absolute;font:900 44px Cairo;color:#fff;padding:6px 26px;border-radius:40px;background:rgba(11,11,12,.6);border:2px solid rgba(212,175,106,.7)}
  .band{position:absolute;left:0;right:0;top:900px;height:120px;background:linear-gradient(90deg,var(--gold3),var(--gold2) 50%,var(--gold3));display:flex;align-items:center;justify-content:center;z-index:5}
  .band span{font:900 64px Cairo;color:#0B0B0C}
  .note{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:700 22px Tajawal;color:rgba(255,255,255,.6);z-index:6}
  .wm{position:absolute;left:40px;top:40px;width:100px;opacity:.5;z-index:20}
  #flash{position:absolute;inset:0;background:#FFF8EA;z-index:25;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="root">
  <!-- H: hook, grilles flash on the beat -->
  <div class="sc" id="sH">
    <img class="full" id="hA" src="img/lc_grille.jpg" alt="">
    <img class="full" id="hB" src="img/lx_front.jpg" alt="" style="object-position:22% 42%">
    <div class="a" style="inset:0;background:radial-gradient(ellipse 90% 40% at 50% 50%,rgba(11,11,12,.75),rgba(11,11,12,.25))"></div>
    <div class="a ctr" id="hT" style="top:760px;font:900 128px/1.15 Cairo;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.8)">لاندكروزر<br><span class="gold">ولا لكزس؟</span></div>
    <div class="a ctr" id="hS" style="top:1110px;font:700 50px Tajawal;color:#fff">الحسم بالأرقام</div>
  </div>
  <!-- V: the two of them, VS slams on the hit -->
  <div class="sc" id="sV">
    <div class="a" style="inset:0;background:radial-gradient(ellipse 80% 45% at 50% 25%,#2B2A27,#0B0B0C 70%)"></div>
    <div class="a" style="left:0;right:0;top:960px;bottom:0;background:radial-gradient(ellipse 80% 45% at 50% 50%,#2E2A24,#0B0B0C 70%)"></div>
    <div class="a" id="vC1" style="left:60px;top:240px;width:960px"><div style="position:absolute;left:80px;top:440px;width:800px;height:70px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.8),rgba(0,0,0,0) 70%)"></div><img src="img/lc_car.png" alt="Land Cruiser" style="position:relative;width:960px"></div>
    <div class="a" id="vC2" style="left:70px;top:1180px;width:940px"><div style="position:absolute;left:70px;top:440px;width:800px;height:70px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.8),rgba(0,0,0,0) 70%)"></div><img src="img/lx_car.png" alt="Lexus LX 700h" style="position:relative;width:940px"></div>
    <div class="a" id="vN1" style="right:60px;top:120px;font:900 64px Cairo;color:#fff">لاندكروزر <span class="gold">GXR</span></div>
    <div class="a" id="vN2" style="right:60px;top:1760px;font:900 64px Cairo;color:#fff">لكزس <span class="gold">LX 700h</span></div>
    <div class="a" id="vVS" style="left:390px;top:810px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#F3D9A0,#D4AF6A 55%,#8C6A2F);display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(212,175,106,.6);z-index:5"><span style="font:150px/1 Anton;color:#0B0B0C;direction:ltr">VS</span></div>
  </div>
  <!-- R: four spec rounds, Land Cruiser on top, Patrol below -->
  <div class="sc" id="sR">
    <div class="half" style="top:0" id="rA"><img src="img/lc_engine.png" alt=""><img src="img/lc_front.jpg" alt=""><img src="img/lc_off.jpg" alt=""><img src="img/lc_wheel.jpg" alt=""><div class="dim"></div></div>
    <div class="half" style="top:990px" id="rB"><img src="img/lx_engine.png" alt=""><img src="img/lx_front.jpg" alt=""><img src="img/lx_off.jpg" alt=""><img src="img/lx_wheel.jpg" alt=""><div class="dim"></div></div>
    <div class="tag" id="rN1" style="right:50px;top:60px">لاندكروزر</div>
    <div class="tag" id="rN2" style="right:50px;top:1060px">لكزس</div>
    <div class="val" id="rV1" style="top:500px"><span class="n" id="rV1n">V6</span><span class="u" id="rV1u"></span></div>
    <div class="val" id="rV2" style="top:1440px"><span class="n" id="rV2n">V6</span><span class="u" id="rV2u"></span></div>
    <div class="band" id="rBand"><span id="rL">المحرك</span></div>
    <div class="note">*الأرقام الرسمية من الشركات المصنعة</div>
  </div>
  <!-- Q: the comment prompt -->
  <div class="sc" id="sQ">
    <div class="a" style="inset:0;background:radial-gradient(ellipse 80% 55% at 50% 45%,#2A261F,#0B0B0C 72%)"></div>
    <img class="a" id="qC1" src="img/lc_car.png" alt="" style="left:-40px;top:250px;width:640px">
    <img class="a" id="qC2" src="img/lx_car.png" alt="" style="left:470px;top:330px;width:640px">
    <div class="a ctr" id="qT" style="top:770px;font:900 118px/1.1 Cairo;color:#fff">الفرق <span class="gold">يستاهل؟</span></div>
    <div class="a ctr" id="qS" style="top:960px;font:700 54px Tajawal;color:#EDE3D0">اكتب رأيك في الكومنت</div>
    <div class="a ctr" id="qP" style="top:1110px;display:flex;justify-content:center;gap:40px;direction:rtl">
      <span style="font:900 60px Cairo;color:#0B0B0C;background:linear-gradient(180deg,#F3D9A0,#D4AF6A);padding:10px 50px;border-radius:60px">لاندكروزر</span>
      <span style="font:900 60px Cairo;color:#fff;border:3px solid #D4AF6A;padding:7px 50px;border-radius:60px">لكزس</span></div>
  </div>
  <!-- E: end card -->
  <div class="sc" id="sE">
    <div class="a" style="inset:0;background:radial-gradient(ellipse 80% 55% at 50% 42%,#1B1A17,#050506 75%)"></div>
    <img class="a" id="eLg" src="../fx/mm_logo.png" alt="Max Motors" style="left:340px;top:440px;width:400px">
    <div class="a" id="eSw" style="left:340px;top:440px;width:400px;height:325px;mix-blend-mode:screen;-webkit-mask:url(../fx/mm_logo.png) center/contain no-repeat"></div>
    <div class="a ctr" id="e1" style="top:870px;font:900 72px/1.25 Cairo;color:#fff">الاثنين متوفرين في<br><span class="gold">ماكس موتورز</span></div>
    <div class="a ctr" id="e2" style="top:1080px;font:600 150px/1.1 Oswald;letter-spacing:3px;color:#fff;direction:ltr">920018915</div>
    <div class="a ctr" id="e3" style="top:1270px;font:600 52px Oswald;letter-spacing:4px;color:var(--gold);direction:ltr">maxmotors.sa</div>
  </div>
  <img class="wm" id="wm" src="../fx/mm_logo.png" alt="">
  <div id="flash"></div>
</div>
<script>
// beat grid: Mixkit 846 from 65.556 s -> big hit 2.20, downbeats ~2.2 s apart
const T = { vs: 2.20, r: [4.49, 6.73, 8.90, 11.20], q: 13.32, end: 15.34 };
const DUR = 19.6; window.DUR = DUR;
const $ = id => document.getElementById(id);
const clamp = x => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: x => 1 - Math.pow(1 - x, 3), back: x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2), lin: x => x };
const at = (t, a, b, e = 'out') => E[e](prog(t, a, b));
const css = (el, o) => Object.assign(el.style, o);
const rise = (id, t, a, d = 40, dur = 0.4) => { const k = at(t, a, a + dur); css($(id), { opacity: k, transform: `translateY(${(1 - k) * d}px)` }); };
// rounds: label, images, values (official manufacturer figures; trims as sold on maxmotors.sa)
const R = [
  ['المحرك', '', '', ['3.5L', 'V6 توين تيربو'], ['3.5L', 'V6 توين تيربو هايبرد']],
  ['القوة', '', '', [409, 'حصان'], [457, 'حصان']],
  ['العزم', '', '', [650, 'نيوتن متر'], [790, 'نيوتن متر']],
  ['الجنوط', '', '', [20, 'إنش'], [22, 'إنش']]];
const SC = [['sH', 0, T.vs], ['sV', T.vs, T.r[0]], ['sR', T.r[0], T.q], ['sQ', T.q, T.end], ['sE', T.end, 99]];
const CUTS = [0.44, 0.97, 1.50, T.vs, ...T.r, T.q, T.end];
let lastR = -1;

window.renderAt = t => {
  SC.forEach(([id, a, b]) => $(id).style.display = t >= a && t < b ? 'block' : 'none');
  const c = CUTS.filter(x => t >= x && t < x + 0.4).pop(), big = c === T.vs || c === T.end;
  $('flash').style.opacity = c === undefined ? 0 : (big ? 0.9 : 0.3) * Math.pow(1 - prog(t, c, c + (big ? 0.4 : 0.2)), 2);
  $('wm').style.opacity = t >= T.vs && t < T.end ? 0.5 : 0;

  // hook: grilles swap on every beat with a push, title slams
  { const b = Math.floor((t + 0.09) / 0.53); $('hA').style.display = b % 2 ? 'none' : 'block'; $('hB').style.display = b % 2 ? 'block' : 'none';
    const p = ((t + 0.09) % 0.53) / 0.53; [$('hA'), $('hB')].forEach(i => i.style.transform = `scale(${1.12 - 0.08 * p})`);
    const k = at(t, 0.05, 0.4, 'back'); css($('hT'), { opacity: clamp(k * 1.3), transform: `scale(${1.3 - 0.3 * k})` }); rise('hS', t, 0.6); }

  // VS: cars slide in from opposite sides, VS slams with a shake
  { const u = t - T.vs; const k1 = at(u, 0, 0.5), k2 = at(u, 0.1, 0.6), sh = Math.exp(-u * 7) * 14;
    css($('vC1'), { transform: `translateX(${(1 - k1) * -1100 + Math.sin(u * 70) * sh}px)` }); css($('vC2'), { transform: `translateX(${(1 - k2) * 1100 + Math.cos(u * 60) * sh}px)` });
    const v = at(u, 0.0, 0.3, 'back'); css($('vVS'), { opacity: clamp(v * 2), transform: `scale(${2.2 - 1.2 * v}) rotate(${(1 - v) * -20}deg)` });
    rise('vN1', u, 0.4); rise('vN2', u, 0.55, -40); }

  // rounds: halves swap images on each downbeat, numbers count up on the next beat
  { const i = T.r.filter(x => t >= x).length - 1;
    if (i >= 0 && i < 4) { const u = t - T.r[i], r = R[i];
      if (i !== lastR) { $('rL').textContent = r[0]; $('rV1u').textContent = r[3][1]; $('rV2u').textContent = r[4][1]; lastR = i; }
      const eng = i === 0; [...$('rA').querySelectorAll('img'), ...$('rB').querySelectorAll('img')].forEach((im, n) => { im.style.display = n % 4 === i ? 'block' : 'none'; im.style.objectFit = eng ? 'contain' : 'cover'; im.style.background = eng ? (n < 4 ? '#E9E9E9' : '#07080A') : 'none'; im.style.transform = `scale(${1.08 - 0.06 * prog(u, 0, 2.55)})`; });
      const bk = at(u, 0, 0.3); css($('rBand'), { transform: `scaleX(${bk})` });
      [['rV1', 3, 0.64], ['rV2', 4, 0.9]].forEach(([id, j, a]) => { const k = at(u, a, a + 0.35, 'back'); css($(id), { opacity: clamp(k * 1.5), transform: `scale(${1.25 - 0.25 * k})` });
        const v = r[j][0]; $(id + 'n').textContent = typeof v === 'number' ? Math.round(v * at(u, a, a + 0.55)) : v; });
      rise('rN1', u, 0.15, 20, 0.3); rise('rN2', u, 0.3, 20, 0.3); } }

  // comment prompt
  { const u = t - T.q; const k = at(u, 0, 0.45); css($('qC1'), { transform: `translateX(${(1 - k) * -700}px)` }); css($('qC2'), { transform: `translateX(${(1 - k) * 700}px)` });
    const s = at(u, 0.3, 0.7, 'back'); css($('qT'), { opacity: clamp(s * 1.4), transform: `scale(${1.3 - 0.3 * s})` }); rise('qS', u, 0.7); rise('qP', u, 1.0, 50); }

  // end card
  { const u = t - T.end; const lk = at(u, 0, 0.6); css($('eLg'), { opacity: lk, transform: `scale(${1.25 - 0.25 * lk})`, filter: `blur(${(1 - lk) * 8}px)` });
    const s = prog(u, 0.7, 1.4); $('eSw').style.background = s > 0 && s < 1 ? `linear-gradient(105deg,rgba(255,255,255,0) ${-20 + 140 * s - 15}%,rgba(255,250,235,.95) ${-20 + 140 * s}%,rgba(255,255,255,0) ${-20 + 140 * s + 15}%)` : 'none';
    [['e1', 0.5], ['e2', 0.7], ['e3', 0.9]].forEach(([id, a]) => rise(id, u, a, 24, 0.45)); }
};
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => { renderAt(0); return true; });
</script>
</body>
</html>
