<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Barr captions</title>
<style>
  @font-face{font-family:Cairo;font-weight:900;src:url(../fonts/Cairo-Black.ttf)}
  @font-face{font-family:Tajawal;font-weight:700;src:url(../fonts/Tajawal-Bold.ttf)}
  @font-face{font-family:Oswald;font-weight:600;src:url(../fonts/Oswald-SemiBold.ttf)}
  @font-face{font-family:Michroma;src:url(../fonts/Michroma.woff2)}
  :root{--gold:#D4AF6A;--gold2:#F3D9A0;--gold3:#A9813F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden}
  .a{position:absolute}
  .gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .line{left:0;right:0;text-align:center;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.6)}
  .vo{font:900 66px/1.3 Cairo}
  .tag{font:400 22px Michroma;letter-spacing:12px;color:var(--gold2);direction:ltr;margin-bottom:14px}
  .spec{font:600 92px/1 Oswald;direction:ltr;letter-spacing:2px}
  .sub{font:700 38px Tajawal;color:#F1E6D2;margin-top:12px}
  .bar{width:120px;height:4px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
</style>
</head>
<body>
<div id="root"></div>
<script>
// one transparent caption card per ?c= key, overlaid on the film with ffmpeg (no WhatsApp anywhere)
const C = {
  v1: `<div class="a line vo" style="top:1330px">في البر…<br>للوقت <span class="gold">معنى ثاني</span></div>`,
  v2: `<div class="a line vo" style="top:1330px">فنجال… ورفقة…<br>وطريق <span class="gold">ما له نهاية</span></div>`,
  rv: `<div class="a line" style="top:1280px"><div class="tag">ALL-NEW HILUX 2027</div><div style="font:900 96px/1.15 Cairo">هايلكس <span class="gold">2027</span></div><div class="sub" style="font-size:44px">الأسطورة رجعت… جديدة كلياً</div><div class="bar"></div></div>`,
  e1: `<div class="a line" style="top:1340px"><div class="tag">ENGINE</div><div class="spec">4.0L <span class="gold">V6</span></div><div class="sub">محرك 4.0 لتر · 6 سلندر · بنزين</div></div>`,
  e2: `<div class="a line" style="top:1340px"><div class="tag">4WD</div><div class="spec">4H <span class="gold">·</span> 4L</div><div class="sub">دفع رباعي مع قير تخفيض</div></div>`,
  e3: `<div class="a line" style="top:1340px"><div class="tag">POWER</div><div class="spec">235 <span class="gold" style="font-size:52px">HP</span> &nbsp; 376 <span class="gold" style="font-size:52px">NM</span></div><div class="sub">235 حصان · 376 نيوتن متر</div></div>`,
  v3: `<div class="a line vo" style="top:1330px">تشيل عزمك…<br>وتوصلك <span class="gold">وين ما تبي</span></div>`,
  v4: `<div class="a line vo" style="top:1330px">ولين يجي الليل…<br><span class="gold">تلقاها جنبك</span></div>`,
  v5: `<div class="a line" style="top:1330px"><div style="font:900 84px/1.2 Cairo">هايلكس <span class="gold">2027</span></div><div class="sub" style="font-size:42px">رفيقك في كل مشوار</div></div>`
};
document.getElementById('root').innerHTML = `<div class="a" style="left:0;right:0;top:1060px;bottom:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5) 35%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.35))"></div>` + C[new URLSearchParams(location.search).get('c')];
window.ready = document.fonts.ready.then(() => 1);
window.DUR = 1; window.renderAt = () => {};
</script>
</body>
</html>
