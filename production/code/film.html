<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>Max Motors — Cinematic Film</title>
<style>
  @font-face{font-family:Cairo;src:url(fonts/Cairo-Black.ttf);font-weight:900}
  @font-face{font-family:Cairo;src:url(fonts/Cairo-Bold.ttf);font-weight:700}
  @font-face{font-family:Tajawal;src:url(fonts/Tajawal-Medium.ttf);font-weight:500}
  @font-face{font-family:Tajawal;src:url(fonts/Tajawal-Bold.ttf);font-weight:700}
  @font-face{font-family:Oswald;src:url(fonts/Oswald-Light.ttf);font-weight:300}
  @font-face{font-family:Oswald;src:url(fonts/Oswald-SemiBold.ttf);font-weight:600}
  @font-face{font-family:Anton;src:url(fonts/Anton.woff2)}
  @font-face{font-family:Michroma;src:url(fonts/Michroma.woff2)}
  :root{--acc:#D4AF6A;--cr:#F3EFE8}
  html,body{margin:0;background:#000}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;color:var(--cr);font-family:Tajawal,sans-serif}
  .abs{position:absolute}
  .full{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .shot{position:absolute;inset:0;overflow:hidden}
  .shot img.m{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .os{font-family:Oswald,sans-serif;direction:ltr;unicode-bidi:isolate}
  .acc{color:var(--acc)}
  .tx{position:absolute;left:0;right:0;text-align:center;direction:rtl;white-space:nowrap}
  .k{font:300 28px Oswald;letter-spacing:16px;color:#EDE6DA;direction:ltr}
  .t1{font:900 104px/1.1 Cairo;text-shadow:0 10px 50px rgba(0,0,0,.85)}
  .t2{font:900 76px/1.15 Cairo;text-shadow:0 8px 40px rgba(0,0,0,.85)}
  .t3{font:700 46px/1.3 Cairo;text-shadow:0 4px 24px rgba(0,0,0,.9)}
  .sp{font:500 38px/1.4 Tajawal;color:#E9E3D8;text-shadow:0 3px 18px #000}
  .cap{font:700 40px/1.45 Tajawal;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.9),0 0 22px rgba(0,0,0,.75);white-space:normal;padding:0 90px}
  .wm{position:absolute;left:34px;top:1786px;width:112px;z-index:30;pointer-events:none;filter:grayscale(.35) brightness(1.15) drop-shadow(0 1px 3px rgba(0,0,0,.35))}
  .bar{position:absolute;left:0;right:0;height:150px;background:#000;z-index:20}
  .chip{display:inline-block;margin:0 10px;padding:14px 30px;border-radius:999px;background:rgba(10,11,13,.72);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2);font:900 34px Cairo}
</style></head>
<body><div id="root">
  <div id="shots"></div>
  <canvas id="dust" class="full" width="540" height="960" style="mix-blend-mode:screen;z-index:8;pointer-events:none"></canvas>
  <img id="leak" class="full" alt="" style="mix-blend-mode:screen;z-index:9;opacity:0;object-fit:cover">
  <div id="ovl" class="full" style="z-index:9;pointer-events:none;mix-blend-mode:screen"></div>
  <div id="mg" class="full" style="z-index:10"></div>
  <div id="txt" class="full" style="z-index:11"></div>
  <div id="vig" class="full" style="z-index:12;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(0,0,0,.6) 100%)"></div>
  <div id="cap" class="full" style="z-index:13;pointer-events:none"></div>
  <canvas id="grain" width="540" height="960" class="full" style="opacity:.05;mix-blend-mode:overlay;pointer-events:none;z-index:14"></canvas>
  <div id="flash" class="full" style="background:#fff;opacity:0;z-index:15;pointer-events:none"></div>
  <div id="dip" class="full" style="background:#000;opacity:0;z-index:16;pointer-events:none"></div>
  <div id="barT" class="bar" style="top:0"></div><div id="barB" class="bar" style="bottom:0"></div>
  <img id="wm" class="wm" src="fx/mm_logo.png" alt="Max Motors">
</div>
<script>window.MG = {};</script>
<script src="film_mg.js"></script>
<script>
const CAR = new URLSearchParams(location.search).get('car') || 'hilux27', R = `cars/${CAR}/`;
// layer=ovl: transparent graphics layer only (footage is cut/graded by ffmpeg and composited under it)
const LAYER = new URLSearchParams(location.search).get('layer') || '';
const $ = id => document.getElementById(id), css = (el, o) => Object.assign(el.style, o);
const clamp = (v, a = 0, c = 1) => Math.min(c, Math.max(a, v)), prog = (t, a, c) => clamp((t - a) / (c - a));
const E = { out: k => 1 - Math.pow(1 - k, 3), in: k => k * k * k, io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, sine: k => 0.5 - 0.5 * Math.cos(Math.PI * k),
  back: k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }, lin: k => k };
const at = (t, a, c, e = 'out') => E[e](prog(t, a, c));
const H = s => (s || '').replace(/<acc>/g, '<span class="acc">').replace(/<\/acc>/g, '</span>').replace(/\[([^\]]+)\]/g, '<span class="os">$1</span>');
const lerp = (a, b, k) => a + (b - a) * k;
let C, DUR, IMG = {};
const srcOf = (s, i) => s.kind === 'seq' ? `${R}${s.src}/${String(i + 1).padStart(3, '0')}.jpg` : `${R}${s.src}`;

// one <div.shot> per shot; a 'seq' shot holds two imgs (frame blend), a 'still' one
function build() {
  $('shots').innerHTML = C.shots.map((s, i) => `<div id="s${i}" class="shot" style="display:none;background:${s.bg || '#000'}">${s.blur ? `<img id="s${i}b" class="m" alt="" style="filter:blur(40px) brightness(.4)">` : ''}<img id="s${i}a" class="m" alt=""><img id="s${i}c" class="m" alt="" style="opacity:0"></div>`).join('');
  $('txt').innerHTML = (C.texts || []).map((x, i) => `<div id="x${i}" class="tx ${x.cls || 't2'}" style="top:${x.y}px;opacity:0;${x.style || ''}">${H(x.html)}</div>`).join('');
  $('cap').innerHTML = (C.captions || []).map((x, i) => `<div id="c${i}" class="tx cap" style="top:${x.y || 1610}px;opacity:0">${H(x.html)}</div>`).join('');
  $('mg').innerHTML = (C.mg || []).map((m, i) => `<div id="g${i}" class="full" style="display:none"></div>`).join('');
  $('ovl').innerHTML = (C.ovl || []).map((o, i) => `<img id="o${i}" class="full" alt="" style="display:none;mix-blend-mode:${o.blend || 'screen'};${o.style || ''}">`).join('');
}
// cover-fit a source of size (w,h) into the frame with a crop window: cx,cy (0..1 focus) and zoom (1 = cover)
function place(el, w, h, cx, cy, z, fw = 1080, fh = 1920, ox = 0, oy = 0) {
  const s = Math.max(fw / w, fh / h) * z, dw = w * s, dh = h * s;
  const x = clamp(fw / 2 - cx * dw, fw - dw, 0), y = clamp(fh / 2 - cy * dh, fh - dh, 0);
  css(el, { width: w + 'px', height: h + 'px', transform: `translate(${x + ox}px,${y + oy}px) scale(${s})` });
}
async function setSrc(el, src) { if (el.getAttribute('src') !== src) { el.setAttribute('src', src); await el.decode().catch(() => {}); } }
function dust(t, k) {
  const c = $('dust'), g = c.getContext('2d'), fr = v => v - Math.floor(v); g.clearRect(0, 0, 540, 960); if (k <= 0) return;
  for (let i = 0; i < 120; i++) {
    const r1 = fr(Math.sin(i * 12.9898) * 43758.5453), r2 = fr(Math.sin(i * 78.233) * 12543.123), r3 = fr(Math.sin(i * 39.425) * 9631.77), big = i < 16;
    const x = ((r1 * 640 + t * (5 + r3 * 14)) % 640) - 50, y = ((r2 * 1060 - t * (6 + r3 * 18)) % 1060 + 1060) % 1060 - 50;
    const s = big ? 5 + r3 * 9 : 0.6 + r3 * 1.6, a = k * (big ? 0.09 : 0.25 + 0.45 * r2) * (0.55 + 0.45 * Math.sin(t * (1 + r1 * 2) + i));
    g.filter = big ? 'blur(4px)' : 'none'; g.fillStyle = `rgba(255,${(205 + r1 * 35) | 0},${(140 + r2 * 60) | 0},${a})`; g.beginPath(); g.arc(x, y, s, 0, 6.283); g.fill();
  }
  g.filter = 'none';
}
function grain(t) {
  const c = $('grain'), g = c.getContext('2d'), im = g.createImageData(540, 960), d = im.data; let s = ((t * 60) | 0) * 2654435761 >>> 0 || 1;
  for (let i = 0; i < d.length; i += 4) { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; d[i] = d[i + 1] = d[i + 2] = s & 255; d[i + 3] = 255; }
  g.putImageData(im, 0, 0);
}
const MG = window.MG;   // motion-graphics renderers (film_mg.js)

window.ready = (async () => {
  C = await (await fetch(`${R}${new URLSearchParams(location.search).get('json') || 'film.json'}`)).json(); DUR = C.dur; window.DUR = DUR;
  if (LAYER === 'ovl') { for (const el of [document.documentElement, document.body, $('root')]) el.style.background = 'transparent'; for (const id of ['grain', 'leak', 'ovl', 'vig']) $(id).style.display = 'none'; }   // vignette + grain are added by ffmpeg in the 4K compose
  document.documentElement.style.setProperty('--acc', C.acc || '#D4AF6A');
  build();
  await Promise.all(['900 80px Cairo', '700 80px Cairo', '500 40px Tajawal', '700 40px Tajawal', '300 40px Oswald', '600 40px Oswald', '40px Anton', '40px Michroma'].map(f => document.fonts.load(f)));
  // probe source sizes once (first frame of each shot)
  for (const [i, s] of C.shots.entries()) { if (LAYER === 'ovl' || s.kind === 'vid') continue; const im = new Image(); im.src = srcOf(s, 0); await im.decode().catch(() => {}); IMG[i] = [im.naturalWidth || 1080, im.naturalHeight || 1920]; }
  for (const [i, m] of (C.mg || []).entries()) if (MG[m.type] && MG[m.type].init) await MG[m.type].init($('g' + i), m);
  return true;
})();

window.renderAt = async function (t) {
  const jobs = []; let fl = 0, dp = 0, dk = 0, leak = null;
  C.shots.forEach((s, i) => {
    const el = $('s' + i), on = t >= s.t0 && t < s.t1 + (s.hold || 0); el.style.display = on ? '' : 'none'; if (!on) return;
    const lt = t - s.t0, D = s.t1 - s.t0, k = prog(lt, 0, D), ke = E[s.ease || 'sine'](k), [w, h] = IMG[i] || [1080, 1920], vid = LAYER === 'ovl' || s.kind === 'vid';
    if (vid) el.style.display = 'none'; else {
    const cx = lerp(s.cx0 ?? 0.5, s.cx1 ?? s.cx0 ?? 0.5, ke), cy = lerp(s.cy0 ?? 0.5, s.cy1 ?? s.cy0 ?? 0.5, ke), z = lerp(s.z0 ?? 1.0, s.z1 ?? 1.06, ke);
    const a = $('s' + i + 'a'), b = $('s' + i + 'b'), c = $('s' + i + 'c');
    if (s.kind === 'seq') {
      const f = lt * (s.fps || 30) * (s.speed || 1) + (s.f0 || 0), i0 = Math.min(s.n - 1, Math.floor(f)), i1 = Math.min(s.n - 1, i0 + 1), fr = f - Math.floor(f);
      jobs.push(setSrc(a, srcOf(s, i0))); if (s.blend !== false) { jobs.push(setSrc(c, srcOf(s, i1))); c.style.opacity = fr; } if (b) jobs.push(setSrc(b, srcOf(s, i0)));
    } else { jobs.push(setSrc(a, srcOf(s, 0))); if (b) jobs.push(setSrc(b, srcOf(s, 0))); c.style.display = 'none'; }
    if (s.fit === 'contain') {   // framed footage: fit width, centred at y, with a blurred copy behind
      const fw = 1080 * (s.fz ?? 1), sc = fw / w, fh = h * sc * z, fx = (1080 - fw * z) / 2, fy = (s.fy ?? 960) - fh / 2;
      for (const im of [a, c]) css(im, { width: w + 'px', height: h + 'px', transform: `translate(${fx}px,${fy}px) scale(${sc * z})` });
      if (b) place(b, w, h, 0.5, 0.5, 1.1);
    } else { for (const im of [a, c]) place(im, w, h, cx, cy, z, 1080, 1920, (s.dx || 0) * ke, (s.dy || 0) * ke); if (b) place(b, w, h, 0.5, 0.5, 1.1); }
    const filt = s.grade || ''; a.style.filter = filt; c.style.filter = filt;
    }
    // transitions into this shot
    const tin = s.tin || 'cut';
    if (tin === 'flash' && lt < 0.14) fl = Math.max(fl, 0.55 * (1 - lt / 0.14));
    if (tin === 'dip') dp = Math.max(dp, 1 - prog(lt, 0, 0.45));
    if (tin === 'leak' && lt < 0.6) leak = { i: (C.leak.peak) + lt * C.leak.fps, a: 1 - prog(lt, 0.35, 0.6) };
    if (tin === 'fade') el.style.opacity = prog(lt, 0, s.tlen || 0.5); else el.style.opacity = 1;
    // transitions out of this shot
    const tout = s.tout || 'cut', tl = s.t1 - t;
    if (tout === 'dip' && tl < 0.45) dp = Math.max(dp, 1 - tl / 0.45);
    if (tout === 'leak' && tl < 0.5) leak = { i: (C.leak.peak) - tl * C.leak.fps, a: 1 - prog(tl, 0.3, 0.5) };
    if (s.dust) dk = Math.max(dk, s.dust);
  });
  // texts: rise + unblur in, fade out; 'track' animates letter spacing
  (C.texts || []).forEach((x, i) => {
    const el = $('x' + i), kin = at(t, x.t0, x.t0 + (x.tin || 0.5), 'out'), kout = 1 - at(t, x.t1 - (x.tout || 0.35), x.t1, 'in'), k = Math.min(kin, kout);
    if (t < x.t0 - 0.05 || t > x.t1 + 0.05) { el.style.opacity = 0; return; }
    const anim = x.anim || 'rise';
    if (anim === 'track') css(el, { opacity: k, letterSpacing: `${(x.ls || 0) + 30 * (1 - kin)}px`, filter: kin < 1 ? `blur(${(1 - kin) * 8}px)` : '' });
    else if (anim === 'scale') css(el, { opacity: k, transform: `scale(${1.25 - 0.25 * E.out(kin)})`, filter: kin < 1 ? `blur(${(1 - kin) * 10}px)` : '' });
    else css(el, { opacity: k, transform: `translateY(${(1 - kin) * 30}px)`, filter: kin < 1 ? `blur(${(1 - kin) * 8}px)` : '' });
  });
  (C.captions || []).forEach((x, i) => { const el = $('c' + i), k = Math.min(at(t, x.t0, x.t0 + 0.25, 'out'), 1 - at(t, x.t1 - 0.25, x.t1, 'in')); el.style.opacity = t >= x.t0 && t <= x.t1 ? k : 0; });
  // motion graphics
  (C.mg || []).forEach((m, i) => { const el = $('g' + i), on = t >= m.t0 && t < m.t1; el.style.display = on ? '' : 'none'; if (on && MG[m.type]) { const r = MG[m.type].draw(el, m, t - m.t0, m.t1 - m.t0, t); if (r && r.fl) fl = Math.max(fl, r.fl); if (r && r.jobs) jobs.push(...r.jobs); } });
  // light leak overlay (frame sequence from the motion-graphics library)
  const L = C.leak; if (L && leak && LAYER !== 'ovl') { const i = clamp(Math.round(leak.i), 0, L.n - 1); jobs.push(setSrc($('leak'), `${L.dir}/${L.pre || ''}${String(i + (L.start ?? 0)).padStart(L.pad || 3, '0')}.jpg`)); $('leak').style.opacity = (L.gain || 1) * clamp(leak.a); } else $('leak').style.opacity = 0;
  (LAYER === 'ovl' ? [] : C.ovl || []).forEach((o, i) => { const el = $('o' + i), on = t >= o.t0 && t < o.t1; el.style.display = on ? '' : 'none'; if (!on) return;
    const lt = t - o.t0, f = Math.floor(lt * o.fps) + (o.f0 || 0), idx = o.loop ? f % o.n : Math.min(o.n - 1, f);
    jobs.push(setSrc(el, `${o.dir}/${o.pre || ''}${String(idx + (o.start ?? 0)).padStart(o.pad || 5, '0')}.jpg`));
    el.style.opacity = (o.op ?? 1) * Math.min(prog(lt, 0, o.fin ?? 0.3), 1 - prog(t, o.t1 - (o.fout ?? 0.3), o.t1)); });
  if (t < (C.fadeIn || 0.6)) dp = Math.max(dp, 1 - prog(t, 0, C.fadeIn || 0.6)); if (t > DUR - 0.5) dp = Math.max(dp, prog(t, DUR - 0.5, DUR));
  css($('flash'), { opacity: fl }); css($('dip'), { opacity: dp });
  const bars = C.bars ?? 150; css($('barT'), { height: bars + 'px' }); css($('barB'), { height: bars + 'px' });
  css($('wm'), { opacity: (C.wm ?? 0.42) * at(t, 0.3, 0.9) * (C.wmOff ? 1 - at(t, C.wmOff, C.wmOff + 0.5) : 1) });
  dust(t, dk); if (LAYER !== 'ovl') grain(t);
  await Promise.all(jobs);
};
</script>
</body></html>
