<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Max Motors posters</title>
<style>
  @font-face{font-family:Cairo;font-weight:900;src:url(../fonts/Cairo-Black.ttf)}
  @font-face{font-family:Cairo;font-weight:700;src:url(../fonts/Cairo-Bold.ttf)}
  @font-face{font-family:Tajawal;font-weight:700;src:url(../fonts/Tajawal-Bold.ttf)}
  @font-face{font-family:Tajawal;font-weight:500;src:url(../fonts/Tajawal-Medium.ttf)}
  @font-face{font-family:Oswald;font-weight:600;src:url(../fonts/Oswald-SemiBold.ttf)}
  @font-face{font-family:Anton;src:url(../fonts/Anton.woff2)}
  @font-face{font-family:Michroma;src:url(../fonts/Michroma.woff2)}
  :root{--gold:#D4AF6A;--gold2:#F3D9A0;--gold3:#A9813F;--ink:#0B0B0C;--paper:#EFEBE4;--taupe:#8A7F70}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#111}
  #c{position:relative;width:1080px;height:1350px;overflow:hidden}
  .a{position:absolute}
  .ctr{left:0;right:0;text-align:center}
  .car{position:absolute}
  .gsh{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
  .lat{direction:ltr;font-family:Michroma;letter-spacing:10px}
  .gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .foot{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:44px;direction:ltr;font:600 34px Oswald;letter-spacing:1px}
  .foot span{display:flex;align-items:center;gap:12px}
  .terms{position:absolute;left:0;right:0;text-align:center;font:500 18px Tajawal;opacity:.7}
  .ph{position:absolute;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .row3{position:absolute;display:flex;justify-content:center;gap:0}
  .row3 > div{text-align:center;padding:0 34px}
  .row3 > div + div{border-right:1.5px solid currentColor}
</style>
</head>
<body>
<div id="c"></div>
<script>
const P = new URLSearchParams(location.search), D = P.get('d') || 'admin', c = document.getElementById('c');
const ico = {
  phone: col => `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>`,
  globe: col => `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>`,
  shield: (col, s = 46) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 3.2v6.4c0 5-3.4 8.8-8 10.4-4.6-1.6-8-5.4-8-10.4V5.2z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>`,
  car: (col, s = 46) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16v-3.5l2-5A2 2 0 0 1 6.9 6h10.2a2 2 0 0 1 1.9 1.5l2 5V16a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H4a1 1 0 0 1-1-1z"/><path d="M5 12h14"/></svg>`,
  pct: (col, s = 46) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5l-7 7"/><circle cx="9" cy="9" r="1.4"/><circle cx="15" cy="15" r="1.4"/></svg>`,
  zero: (col, s = 46) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>`,
};
const foot = (col, ic, y = 1282, terms = true) => `<div class="foot" style="color:${col};top:${y}px"><span>${ico.phone(ic)}920018915</span><img src="../fx/mm_logo.png" alt="Max Motors" style="width:62px"><span>${ico.globe(ic)}maxmotors.sa</span></div>` + (terms ? `<div class="terms" style="color:${col};top:${y + 56}px">*تطبّق الشروط والأحكام</div>` : '');
const car = (n, x, y, w, sh = .55) => `<div class="gsh" style="left:${x + w * .08}px;top:${y + w * .47}px;width:${w * .84}px;height:${w * .1}px;opacity:${sh / .55}"></div><img class="car" src="real/${n}.png" alt="" style="left:${x}px;top:${y}px;width:${w}px">`;
const ph = (n, x, y, w, h, extra = '') => `<div class="ph" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}"><img src="real/${n}" alt=""></div>`;
const offers3 = (col, acc, y) => `<div class="row3" style="left:0;right:0;top:${y}px;color:${col}">
  <div>${ico.zero(acc)}<div style="font:900 30px Cairo;margin-top:6px">زيرو</div><div style="font:500 20px Tajawal;opacity:.8">مصاريف إدارية</div></div>
  <div>${ico.car(acc)}<div style="font:900 30px Cairo;margin-top:6px">زيرو</div><div style="font:500 20px Tajawal;opacity:.8">دفعة أولى</div></div>
  <div>${ico.pct(acc)}<div style="font:900 30px Cairo;margin-top:6px">أقل نسبة</div><div style="font:500 20px Tajawal;opacity:.8">هامش ربح</div></div>
  <div>${ico.shield(acc)}<div style="font:900 30px Cairo;margin-top:6px">حماية</div><div style="font:500 20px Tajawal;opacity:.8">مجانية</div></div></div>`;

const B = {
  // big-number offer poster (Pinterest "10% / 4%" offers): giant gold zero, lineup of three cars
  admin: () => `
    <div class="a" style="inset:0;background:radial-gradient(ellipse 80% 60% at 50% 42%,#26221C,#0B0B0C 70%)"></div>
    <img class="a" src="../fx/mm_logo.png" alt="Max Motors" style="left:465px;top:34px;width:150px">
    <div class="a ctr lat" style="top:176px;font-size:15px;color:var(--gold)">EXCLUSIVE · OFFER</div>
    <div class="a ctr gold" style="top:150px;font:880px/1 Anton;letter-spacing:-10px;opacity:.95">0</div>
    <div class="a" style="left:0;right:0;top:700px;height:420px;background:linear-gradient(180deg,rgba(11,11,12,0),rgba(11,11,12,.85) 55%,#0B0B0C)"></div>
    ${car('lc_white', 20, 700, 500, .7)}${car('camry_white', 545, 740, 520, .7)}${car('prado_black', 265, 770, 560, .8)}
    <div class="a ctr" style="top:1085px;font:900 92px/1.1 Cairo;color:#fff">زيرو <span class="gold">مصاريف إدارية</span></div>
    <div class="a ctr" style="top:1205px;font:500 30px Tajawal;color:#CFC6B8">اشترِ سيارتك من ماكس موتورز بدون أي مصاريف إدارية</div>
    ${foot('#EDE6DA', '#D4AF6A', 1266)}`,

  // Mustang GT / Supra: giant condensed word, car over it, Arabic title, spaced tagline, icon row
  down: () => `
    <div class="a" style="inset:0;background:radial-gradient(ellipse 90% 70% at 50% 40%,#F6F3EE,#E2DCD2)"></div>
    <div class="a lat" style="right:44px;top:40px;font-size:13px;color:#222;letter-spacing:6px">MAX MOTORS</div>
    <div class="a" style="left:44px;top:34px;font:700 22px Tajawal;color:var(--taupe)">عرض خاص</div>
    <div class="a ctr" style="top:70px;font:470px/1 Anton;letter-spacing:2px;direction:ltr;background:linear-gradient(180deg,#0B0B0C 55%,rgba(11,11,12,.15));-webkit-background-clip:text;background-clip:text;color:transparent">ZERO</div>
    ${car('prado_gold', 125, 360, 830, .6)}
    <div class="a ctr" style="top:850px;font:900 116px/1.05 Cairo;color:#0B0B0C">زيرو <span class="gold">دفعة أولى</span></div>
    <div class="a ctr" style="top:990px;font:700 30px Tajawal;letter-spacing:12px;color:var(--taupe)">استلم · سيارتك · الآن</div>
    ${offers3('#151515', '#A9813F', 1060)}
    ${foot('#151515', '#A9813F', 1262)}`,

  // Ferrari 488: vertical gold band, title across it, car crossing the band, three figures
  margin: () => `
    <div class="a" style="inset:0;background:#F1EEE9"></div>
    <div class="a" style="left:350px;top:0;width:380px;height:1350px;background:linear-gradient(180deg,#E9CC8E,var(--gold) 45%,#B48A45)"></div>
    <img class="a" src="../fx/mm_logo.png" alt="Max Motors" style="left:470px;top:40px;width:140px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))">
    <div class="a ctr" style="top:230px;font:900 128px/1 Cairo;color:#0B0B0C">أقل نسبة</div>
    <div class="a ctr" style="top:370px;font:900 128px/1 Cairo;color:#0B0B0C">هامش ربح</div>
    <div class="a ctr lat" style="top:525px;font-size:14px;color:#2A2A2A">BUILT FOR YOUR BUDGET</div>
    ${car('camry_red', 70, 600, 940, .65)}
    <div class="row3" style="left:0;right:0;top:1060px;color:#0B0B0C">
      <div><div style="font:600 92px/1 Oswald">0</div><div style="font:700 24px Tajawal">ريال مصاريف إدارية</div></div>
      <div><div style="font:600 92px/1 Oswald">0</div><div style="font:700 24px Tajawal">ريال دفعة أولى</div></div>
      <div><div style="font:900 64px/1.4 Cairo">الأقل</div><div style="font:700 24px Tajawal">نسبة هامش ربح</div></div></div>
    ${foot('#0B0B0C', '#7A5A22', 1262)}`,

  // Range Rover SV / Rolls "spec" poster: spaced brand, gold title, hero photo, detail strip, icon row
  protect: () => `
    <div class="a" style="inset:0;background:linear-gradient(180deg,#141416,#0B0B0C)"></div>
    <div class="a ctr lat" style="top:44px;font-size:16px;color:#CFC6B8;letter-spacing:14px">MAX MOTORS</div>
    <div class="a ctr gold" style="top:78px;font:900 120px/1.15 Cairo">حماية مجانية</div>
    <div class="a ctr" style="top:228px;font:500 30px Tajawal;letter-spacing:3px;color:#CFC6B8">عروض حماية مجانية مع سيارتك الجديدة</div>
    ${ph('h_prado.jpg', 40, 300, 1000, 520, 'border-radius:22px;box-shadow:0 30px 60px rgba(0,0,0,.6)')}
    ${ph('px_ext01.webp', 40, 845, 320, 190, 'border-radius:16px')}${ph('px_ext03.webp', 380, 845, 320, 190, 'border-radius:16px')}${ph('px_perf02.webp', 720, 845, 320, 190, 'border-radius:16px')}
    ${offers3('#EDE6DA', '#D4AF6A', 1068)}
    ${foot('#EDE6DA', '#D4AF6A', 1262)}`,

  // Audi R8 V10: black diagonal with a gold edge, vertical giant word, car on the split, numbered list
  services: () => `
    <div class="a" style="inset:0;background:#F1EEE9"></div>
    <div class="a" style="inset:0;background:#0B0B0C;clip-path:polygon(46% 0,100% 0,100% 100%,78% 100%)"></div>
    <div class="a" style="inset:0;background:linear-gradient(180deg,var(--gold2),var(--gold3));clip-path:polygon(43.5% 0,46% 0,78% 100%,75.5% 100%)"></div>
    <div class="a" style="right:-330px;top:470px;width:900px;transform:rotate(90deg);text-align:center;font:250px/1 Anton;letter-spacing:10px;color:rgba(255,255,255,.1);direction:ltr">MAX</div>
    <img class="a" src="../fx/mm_logo.png" alt="Max Motors" style="right:70px;top:46px;width:150px">
    <div class="a" style="left:60px;top:60px;width:520px;font:900 92px/1.12 Cairo;color:#0B0B0C;text-align:left">خدمات<br><span class="gold">وعروض</span><br>ماكس موتورز</div>
    ${car('lc_white', 120, 440, 860, .6)}
    <div class="a" style="left:60px;top:890px;width:600px;text-align:left">
      ${['زيرو مصاريف إدارية', 'زيرو دفعة أولى', 'أقل نسبة هامش ربح', 'عروض حماية مجانية'].map((t, i) => `<div style="display:flex;align-items:center;gap:20px;justify-content:flex-start;direction:rtl;margin-bottom:14px"><span style="flex:none;width:56px;height:56px;border-radius:50%;background:#0B0B0C;color:var(--gold);display:flex;align-items:center;justify-content:center;font:600 30px Oswald">0${i + 1}</span><span style="font:900 40px Cairo;color:#0B0B0C">${t}</span></div>`).join('')}</div>
    <div class="a" style="left:150px;right:150px;top:1252px;height:96px;border-radius:48px;background:#F1EEE9;box-shadow:0 8px 30px rgba(0,0,0,.25)"></div>${foot('#0B0B0C', '#7A5A22', 1262)}`,

  // arches: three arch windows with real photos, car in front, contact cards
  contact: () => `
    <div class="a" style="inset:0;background:radial-gradient(ellipse 90% 70% at 50% 40%,#F6F3EE,#E2DCD2)"></div>
    <img class="a" src="../fx/mm_logo.png" alt="Max Motors" style="left:470px;top:36px;width:140px">
    <div class="a ctr" style="top:180px;font:900 104px/1.1 Cairo;color:#0B0B0C">سيارتك <span class="gold">بانتظارك</span></div>
    ${ph('h_lc.jpg', 60, 330, 300, 470, 'border-radius:150px 150px 18px 18px')}${ph('h_prado.jpg', 390, 300, 300, 500, 'border-radius:150px 150px 18px 18px')}${ph('h_hl.jpg', 720, 330, 300, 470, 'border-radius:150px 150px 18px 18px')}
    ${car('crown_red', 190, 670, 700, .6)}
    <div class="a ctr lat" style="top:1035px;font-size:15px;color:var(--taupe);letter-spacing:12px">CONTACT · US</div>
    <div class="a" style="left:0;right:0;top:1080px;display:flex;justify-content:center;gap:40px;direction:ltr">
      <div style="padding:18px 34px;border-radius:20px;background:#0B0B0C;color:#fff;text-align:center"><div style="font:700 22px Tajawal;color:var(--gold)">الرقم الموحد</div><div style="font:600 60px/1.1 Oswald;letter-spacing:2px">920018915</div></div>
      <div style="padding:18px 34px;border-radius:20px;background:#0B0B0C;color:#fff;text-align:center"><div style="font:700 22px Tajawal;color:var(--gold)">الموقع الإلكتروني</div><div style="font:600 60px/1.1 Oswald;letter-spacing:2px">maxmotors.sa</div></div></div>
    <div class="a ctr" style="top:1270px;font:700 30px Tajawal;letter-spacing:8px;color:#0B0B0C">ماكس موتورز · <span style="color:var(--gold3)">عروض · تمويل · حماية</span></div>`,
};
c.innerHTML = B[D]();
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => document.body.dataset.ready = 1);
</script>
</body>
</html>
