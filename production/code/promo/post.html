<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Max Motors offers</title>
<style>
  @font-face{font-family:Cairo;font-weight:900;src:url(../fonts/Cairo-Black.ttf)}
  @font-face{font-family:Cairo;font-weight:700;src:url(../fonts/Cairo-Bold.ttf)}
  @font-face{font-family:Tajawal;font-weight:700;src:url(../fonts/Tajawal-Bold.ttf)}
  @font-face{font-family:Tajawal;font-weight:500;src:url(../fonts/Tajawal-Medium.ttf)}
  @font-face{font-family:Oswald;font-weight:600;src:url(../fonts/Oswald-SemiBold.ttf)}
  @font-face{font-family:Oswald;font-weight:300;src:url(../fonts/Oswald-Light.ttf)}
  :root{--gold:#D4AF6A;--gold2:#F3D9A0;--ink:#050506}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink)}
  #c{position:relative;width:1080px;overflow:hidden;background:var(--ink);color:#fff}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .shade{position:absolute;inset:0}
  .logo{position:absolute;left:50%;transform:translateX(-50%);width:230px}
  .gold{background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 55%,#A9813F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .kick{position:absolute;left:0;right:0;text-align:center;font:700 34px Tajawal;letter-spacing:1px;color:var(--gold)}
  .kick:before,.kick:after{content:"";display:inline-block;width:70px;height:2px;background:var(--gold);vertical-align:middle;margin:0 22px;opacity:.8}
  .head{position:absolute;left:40px;right:40px;text-align:center;font:900 132px/1.12 Cairo;filter:drop-shadow(0 6px 22px rgba(0,0,0,.85))}
  .head .w{color:#fff}
  .sub{position:absolute;left:70px;right:70px;text-align:center;font:500 44px/1.45 Tajawal;color:#EDE6DA;text-shadow:0 3px 18px #000}
  .big{position:absolute;left:0;right:0;text-align:center;font:600 520px/1 Oswald;opacity:.22;-webkit-text-stroke:3px var(--gold);color:transparent;direction:ltr}
  .icon{position:absolute;left:50%;transform:translateX(-50%)}
  .list{position:absolute;left:110px;right:110px;display:flex;flex-direction:column;gap:22px}
  .li{display:flex;align-items:center;gap:22px;padding:22px 30px;border-radius:22px;background:rgba(10,10,12,.62);border:1.5px solid rgba(212,175,106,.55);font:900 50px Cairo}
  .li .ck{flex:none;width:52px;height:52px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
  .bar{position:absolute;left:0;right:0;bottom:0;padding:26px 44px 30px;background:linear-gradient(180deg,rgba(5,5,6,0),rgba(5,5,6,.92) 30%);}
  .bar .ln{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-bottom:22px}
  .row{display:flex;justify-content:center;align-items:center;gap:34px;direction:ltr}
  .it{display:flex;align-items:center;gap:12px;font:600 40px Oswald;letter-spacing:1px;color:#fff}
  .it small{font:700 26px Tajawal;color:var(--gold);letter-spacing:0;margin-left:4px}
  .terms{text-align:center;font:500 22px Tajawal;color:#B9B2A6;margin-top:16px}
  .cards{position:absolute;left:90px;right:90px;display:flex;flex-direction:column;gap:26px}
  .cd{display:flex;align-items:center;gap:28px;padding:28px 36px;border-radius:26px;background:rgba(10,10,12,.66);border:1.5px solid rgba(212,175,106,.6)}
  .cd .ic{flex:none;width:92px;height:92px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
  .cd .tx{display:flex;flex-direction:column;gap:2px}
  .cd .lb{font:700 32px Tajawal;color:var(--gold)}
  .cd .vl{font:600 70px Oswald;letter-spacing:2px;color:#fff;direction:ltr;text-align:right}
</style>
</head>
<body>
<div id="c"></div>
<script>
const P = new URLSearchParams(location.search);
const fmt = P.get('f') || 'feed', H = fmt === 'story' ? 1920 : 1350, S = fmt === 'story';
const ink = '#061018';
const ic = {
  phone: `<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#D4AF6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>`,
  wa: `<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#D4AF6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/></svg>`,
  web: `<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#D4AF6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>`,
  check: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${ink}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>`,
  shield: `<svg width="300" height="340" viewBox="0 0 24 27" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D9A0"/><stop offset=".6" stop-color="#D4AF6A"/><stop offset="1" stop-color="#9C7536"/></linearGradient></defs><path d="M12 1.5l9 3.6v7.2c0 6.1-3.9 10.8-9 13.2-5.1-2.4-9-7.1-9-13.2V5.1z" fill="rgba(5,5,6,.55)" stroke="url(#g)" stroke-width="1.2"/><path d="M7.6 13.6l3.1 3.1 6-6.4" fill="none" stroke="url(#g)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  pct: `<svg width="290" height="290" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D9A0"/><stop offset=".6" stop-color="#D4AF6A"/><stop offset="1" stop-color="#9C7536"/></linearGradient></defs><circle cx="12" cy="12" r="11" fill="rgba(5,5,6,.55)" stroke="url(#g2)" stroke-width=".9"/><path d="M16.5 7.5l-9 9" stroke="url(#g2)" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.3" cy="8.3" r="1.9" fill="none" stroke="url(#g2)" stroke-width="1.4"/><circle cx="15.7" cy="15.7" r="1.9" fill="none" stroke="url(#g2)" stroke-width="1.4"/><path d="M12 19.2v2.3M9.8 20.4l2.2 2.2 2.2-2.2" stroke="url(#g2)" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const D = {
  admin:   { bg: 'admin', pos: '50% 60%', kick: 'عرض ماكس موتورز', big: '0', head: '<span class="gold">زيرو</span><br><span class="w">مصاريف إدارية</span>', sub: 'اشترِ سيارتك من ماكس موتورز<br>بدون أي مصاريف إدارية', terms: true },
  down:    { bg: 'down', pos: '50% 62%', kick: 'عرض ماكس موتورز', big: '0', head: '<span class="gold">زيرو</span><br><span class="w">دفعة أولى</span>', sub: 'استلم سيارتك الآن<br>بدون دفعة أولى', terms: true },
  margin:  { bg: 'margin', pos: '50% 55%', kick: 'عرض ماكس موتورز', icon: 'pct', head: '<span class="w">أقل نسبة</span><br><span class="gold">هامش ربح</span>', sub: 'تمويل سيارتك بأقل نسبة هامش ربح', terms: true },
  protect: { bg: 'protect', pos: '50% 45%', kick: 'عرض ماكس موتورز', icon: 'shield', head: '<span class="gold">حماية مجانية</span><br><span class="w">لسيارتك</span>', sub: 'عروض حماية مجانية<br>مع سيارتك الجديدة من ماكس موتورز', terms: true },
  services:{ bg: 'services', pos: '50% 55%', kick: 'خدمات وعروض ماكس موتورز', list: ['زيرو مصاريف إدارية', 'زيرو دفعة أولى', 'أقل نسبة هامش ربح', 'عروض حماية مجانية'], terms: true },
  contact: { bg: 'contact', pos: '50% 50%', kick: 'تواصل معنا', head: '<span class="w">سيارتك</span> <span class="gold">بانتظارك</span>', contact: true },
};
const d = D[P.get('d') || 'admin'];
const c = document.getElementById('c'); c.style.height = H + 'px';
// vertical layout per format
const L = S ? { logo: 120, big: 700, icon: 800, kick: 1170, head: 1230, sub: 1550, list: 960, cards: 900, chead: 600 }
            : { logo: 60, big: 230, icon: 290, kick: 610, head: 665, sub: 970, list: 470, cards: 560, chead: 360 };
let h = `<img class="bg" src="bg/${d.bg}.jpg" alt="" style="object-position:${d.pos}">
  <div class="shade" style="background:radial-gradient(ellipse 120% 70% at 50% ${S ? 62 : 60}%,rgba(5,5,6,.25),rgba(5,5,6,.7) 70%),linear-gradient(180deg,rgba(5,5,6,.75) 0%,rgba(5,5,6,.1) 22%,rgba(5,5,6,.2) 45%,rgba(5,5,6,.88) 78%,rgba(5,5,6,.97) 100%)"></div>
  <img class="logo" src="../fx/mm_logo.png" alt="Max Motors" style="top:${L.logo}px">`;
if (d.big) h += `<div class="big" style="top:${L.big}px">${d.big}</div>`;
if (d.icon) h += `<div class="icon" style="top:${L.icon}px;${S ? '' : 'transform:translateX(-50%) scale(.82);transform-origin:50% 0'}">${ic[d.icon]}</div>`;
if (d.head && !d.contact) h += `<div style="position:absolute;left:-80px;right:-80px;top:${L.kick - 90}px;height:${L.sub - L.kick + 260}px;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(5,5,6,.78),rgba(5,5,6,.45) 55%,rgba(5,5,6,0) 75%)"></div><div class="kick" style="top:${L.kick}px">${d.kick}</div><div class="head" style="top:${L.head}px">${d.head}</div>`;
if (d.sub) h += `<div class="sub" style="top:${L.sub}px">${d.sub}</div>`;
if (d.list) h += `<div class="kick" style="top:${L.list - 80}px">${d.kick}</div><div class="list" style="top:${L.list}px">${d.list.map(t => `<div class="li"><span class="ck">${ic.check}</span><span>${t}</span></div>`).join('')}</div>`;
if (d.contact) {
  h += `<div class="kick" style="top:${L.chead - 70}px">${d.kick}</div><div class="head" style="top:${L.chead}px;font-size:110px">${d.head}</div>
  <div class="cards" style="top:${L.cards}px">
    <div class="cd"><span class="ic">${ic.phone.replace(/#D4AF6A/g, ink)}</span><span class="tx"><span class="lb">الرقم الموحد</span><span class="vl">920018915</span></span></div>
    <div class="cd"><span class="ic">${ic.wa.replace(/#D4AF6A/g, ink)}</span><span class="tx"><span class="lb">واتساب</span><span class="vl">0533393397</span></span></div>
    <div class="cd"><span class="ic">${ic.web.replace(/#D4AF6A/g, ink)}</span><span class="tx"><span class="lb">الموقع الإلكتروني</span><span class="vl" style="font-size:60px">maxmotors.sa</span></span></div>
  </div>`;
} else {
  h += `<div class="bar"><div class="ln"></div><div class="row">
    <span class="it">${ic.phone}920018915</span><span class="it">${ic.wa}0533393397</span><span class="it">${ic.web}maxmotors.sa</span></div>
    ${d.terms ? '<div class="terms">*تطبّق الشروط والأحكام</div>' : ''}</div>`;
}
c.innerHTML = h;
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => document.body.dataset.ready = 1);
</script>
</body>
</html>
