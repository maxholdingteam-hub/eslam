<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0c0b09;font-family:Cairo;direction:rtl}
#im{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}

<img id="im"><div id="grid"><img src="s_najdi.png" style="right:0;top:120px"><img src="s_modern.png" style="left:0;top:120px"><img src="s_classic.png" style="right:0;top:684px"><img src="s_minimal.png" style="left:0;top:684px"></div>
