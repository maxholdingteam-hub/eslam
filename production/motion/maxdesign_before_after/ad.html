<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0e0c0a}
.pr{position:absolute;inset:0;opacity:0;overflow:hidden}
.pr img{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.pr .aft{clip-path:inset(0 0 0 100%)}
.hdl{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.5)}
.hdl i{position:absolute;top:50%;left:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:46px;color:#111;font-family:Tajawal;font-weight:900}
.lb{position:absolute;top:150px;font-family:Tajawal;font-weight:900;font-size:50px;padding:10px 34px;border-radius:40px;direction:rtl}
.lb.b{right:50px;background:rgba(0,0,0,.6);color:#fff}
.lb.a{left:50px;background:#D4AF37;color:#111}
.nm{position:absolute;left:0;right:0;bottom:170px;text-align:center;direction:rtl;font-family:Tajawal;font-weight:900;font-size:92px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.nm small{display:block;font-weight:500;font-size:44px;color:#f1e3b8}
#logo{position:absolute;left:50%;top:40px;width:200px;margin-left:-100px;z-index:5;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:rtl;font-family:Tajawal;font-weight:900;color:#fff;font-size:120px;z-index:4;text-shadow:0 8px 40px rgba(0,0,0,.9)}
#hook span{color:#D4AF37}
#fin{position:absolute;inset:0;opacity:0;background:#0e0c0a}
.tile{position:absolute;overflow:hidden;border-radius:26px}
.tile img{width:100%;height:100%;object-fit:cover}
#ft{position:absolute;left:0;right:0;top:1340px;text-align:center;direction:rtl;font-family:Tajawal;font-weight:900;font-size:80px;color:#fff;line-height:1.25}
#ft span{color:#D4AF37}
#end{position:absolute;inset:0;background:#0e0c0a;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;z-index:9}
#end .n{font-family:Tajawal;font-weight:900;font-size:110px;color:#111;background:linear-gradient(#f3d77a,#c9a133);padding:14px 60px;border-radius:30px}
</style></head><body>
<div class="pr" id="P0"><img class="bef" src="as/b3.jpg"><img class="aft" src="as/a3.jpg"><div class="hdl"><i>⇆</i></div><div class="lb b">قبل</div><div class="lb a">بعد</div><div class="nm">الواجهة<small>فيلا · الرياض</small></div></div>
<div class="pr" id="P1"><img class="bef" src="as/b1.jpg"><img class="aft" src="as/a1.jpg"><div class="hdl"><i>⇆</i></div><div class="lb b">قبل</div><div class="lb a">بعد</div><div class="nm">المجلس<small>تصميم وتنفيذ وتشطيب</small></div></div>
<div class="pr" id="P2"><img class="bef" src="as/b2.jpg"><img class="aft" src="as/a2.jpg"><div class="hdl"><i>⇆</i></div><div class="lb b">قبل</div><div class="lb a">بعد</div><div class="nm">المطبخ<small>كل تفصيلة محسوبة</small></div></div>
<div id="hook"><div>من <span>هنا…</span></div><div style="font-size:90px;margin-top:20px" id="h2">إلى هنا ✨</div></div>
<div id="fin"><div class="tile" id="t1" style="left:40px;top:180px;width:490px;height:1100px"><img src="as/a1.jpg"></div><div class="tile" id="t2" style="left:550px;top:180px;width:490px;height:540px"><img src="as/a2.jpg"></div><div class="tile" id="t3" style="left:550px;top:740px;width:490px;height:540px"><img src="as/a3.jpg"></div>
<div id="ft">نصمّم… <span>وننفّذ</span><br><span style="font-size:58px;color:#f1e3b8">من أوّل فكرة إلى التسليم</span></div></div>
<img id="logo" src="as/md.png">
<div id="end"><img src="as/md.png" style="width:640px"><div class="n">0579277975</div></div>
<script>
const $=id=>document.getElementById(id);
function E(t,a,d){return Math.max(0,Math.min(1,(t-a)/d))}
function io(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}
function back(p){const c=1.7;p=p-1;return 1+p*p*((c+1)*p+c)}
// pair windows: [start,end]; wipe starts start+1.0 for 1.7s
const W=[[0,5.6],[5.6,10.9],[10.9,16.2]];
window.render=function(t){
 W.forEach(([a,b],i)=>{const P=$('P'+i);P.style.opacity=E(t,a-.15,.3)*(1-E(t,b-.15,.3));
  const ws=a+(i==0?1.9:1.0),w=io(E(t,ws,1.7));const x=1080*(1-w);
  // back-and-forth tease then full reveal
  P.querySelector('.aft').style.clipPath=`inset(0 0 0 ${x}px)`;P.querySelector('.hdl').style.left=x+'px';
  P.querySelector('.hdl').style.opacity=E(t,ws-.4,.3)*(1-E(t,ws+1.8,.3));
  P.querySelectorAll('img').forEach(im=>im.style.transform=`scale(${1.08-.06*E(t,a,b-a)})`);
  P.querySelector('.lb.b').style.opacity=1-E(t,ws+1.2,.3);P.querySelector('.lb.a').style.opacity=E(t,ws+1.4,.3);
  const n=E(t,ws+1.6,.4);P.querySelector('.nm').style.opacity=n;P.querySelector('.nm').style.transform=`translateY(${(1-n)*40}px)`});
 $('hook').style.opacity=E(t,.1,.3)*(1-E(t,1.8,.3));$('h2').style.opacity=E(t,.8,.3);
 const f=E(t,16.05,.3);$('fin').style.opacity=f;
 ['t1','t2','t3'].forEach((id,i)=>{const p=E(t,16.2+i*.15,.45);$(id).style.transform=`scale(${.6+.4*back(p)})`;$(id).style.opacity=p});
 const ft=E(t,16.9,.4);$('ft').style.opacity=ft;$('ft').style.transform=`translateY(${(1-ft)*40}px)`;
 $('logo').style.opacity=1-E(t,19.6,.2);
 $('end').style.opacity=E(t,19.7,.35);
};window.render(0);
</script></body></html>
