<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Changa:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0907}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
.bg{position:absolute;inset:-30px;background:url(as/terminal.jpg) center/cover;filter:blur(7px) brightness(.42) saturate(1.1)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 30%,rgba(0,0,0,.7) 100%),linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.8))}
.txt{direction:rtl;white-space:nowrap;position:absolute;left:0;right:0;text-align:center}
.hdr{top:345px;font-family:Changa;font-weight:800;font-size:46px;color:#ffb84a;letter-spacing:2px}
.hdr .dot{display:inline-block;width:20px;height:20px;border-radius:50%;background:#ff4b3a;margin:0 16px 4px;box-shadow:0 0 16px #ff4b3a;vertical-align:middle}
.board{position:absolute;top:445px;left:50%;transform:translateX(-50%);display:flex;flex-direction:row-reverse;gap:9px;padding:26px 24px;background:linear-gradient(#1a1714,#0e0c0a);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 0 0 3px #2c2620}
.f{position:relative;width:104px;height:196px;border-radius:12px;background:linear-gradient(#2a2724 0%,#1d1b19 49.6%,#0c0b0a 50%,#191715 50.6%,#121110 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 6px 10px rgba(0,0,0,.6);overflow:hidden}
.f span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Reem Kufi';font-weight:700;font-size:120px;line-height:1;padding-bottom:18px;color:#ffd24a;text-shadow:0 0 18px rgba(255,200,60,.35);direction:rtl;white-space:nowrap}
.f.w span{color:#fbf7ee;text-shadow:0 0 14px rgba(255,255,255,.25)}
.f::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:#050404}
.f.gap{width:44px;background:#0d0c0b}
.f.gap::after{display:none}
.sub{top:735px;font-family:Changa;font-weight:800;font-size:96px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.car{position:absolute;top:915px;left:50%;transform:translateX(-50%);width:900px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.glow{position:absolute;top:1265px;left:140px;width:800px;height:160px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,170,60,.35),rgba(0,0,0,0) 70%)}
.row{position:absolute;top:1505px;left:60px;right:60px;height:96px;border-radius:16px;background:rgba(10,9,8,.85);box-shadow:inset 0 0 0 2px #3a3128;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:0 34px}
.row .a{direction:rtl;white-space:nowrap;font-family:Changa;font-weight:800;font-size:44px;color:#ffd24a}
.row .b{direction:rtl;white-space:nowrap;font-family:Changa;font-weight:600;font-size:40px;color:#fbf7ee}
.logo{position:absolute;top:1675px;left:50%;transform:translateX(-50%);width:520px}
</style></head><body>
<div id="st">
<div class="bg"></div><div class="vig"></div>
<div class="txt hdr"><span class="dot"></span>المغادرة الآن</div>
<div class="board" id="board"></div>
<div class="txt sub">لصاحب الموتر ✈️</div>
<div class="glow"></div>
<img class="car" src="as/c_patrol.png">
<div class="row"><div class="b">كاش أو تمويل</div><div class="a">البوابة: ماكس موتورز</div></div>
<img class="logo" src="as/logo_full.png">
</div>
<script>
const Z='‍';
// each tile shows the letter in its joined form (ZWJ keeps Arabic shaping inside separate tiles)
const tiles=[['ن'+Z,'w'],[Z+'د','w'],['ا','w'],['ء','w'],null,['أ','y'],['خ'+Z,'y'],[Z+'ي'+Z,'y'],[Z+'ر','y']];
const b=document.getElementById('board');
for(const t of tiles){const d=document.createElement('div');if(!t){d.className='f gap';}else{d.className='f '+(t[1]=='w'?'w':'');d.innerHTML='<span>'+t[0]+'</span>';}b.appendChild(d);}
window.render=function(t){};
</script>
</body></html>
