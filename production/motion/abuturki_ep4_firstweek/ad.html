<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#111;font-family:Tajawal}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.noise{position:absolute;inset:0;background:url(as/noise.png);opacity:.18;mix-blend-mode:multiply}
.e{position:absolute;will-change:transform,opacity}
.t{direction:rtl;text-align:center;font-family:Lalezar,Tajawal;line-height:1.15;white-space:nowrap;left:0;right:0}
.hl{position:relative;display:inline-block;padding:0 22px}
.hl::before{content:'';position:absolute;left:0;right:0;top:22%;bottom:8%;background:var(--hc,#F2C14E);transform:skew(-8deg) scaleX(var(--hx,1));transform-origin:right;z-index:-1;border-radius:6px}
img.c{filter:drop-shadow(0 16px 18px rgba(0,0,0,.35))}
.badge{left:0;right:0;text-align:center}
.badge span{display:inline-block;background:#111;color:#F2C14E;font-family:Lalezar,Tajawal;font-size:96px;padding:18px 60px 6px;border-radius:24px;transform:rotate(-3deg);box-shadow:10px 10px 0 rgba(0,0,0,.25)}
.pill{display:inline-block;background:#F2C14E;color:#111;border-radius:80px;padding:14px 70px;font-family:Arial;font-weight:900;font-size:72px;letter-spacing:4px}
svg{position:absolute;overflow:visible}
.lbl{direction:rtl;text-align:center;font-family:Lalezar,Tajawal}
.num{left:0;right:0;text-align:center}.num span{display:inline-block;width:210px;height:210px;line-height:250px;border-radius:50%;background:#111;color:#F2C14E;font-family:Lalezar;font-size:170px;box-shadow:10px 10px 0 rgba(0,0,0,.2)}
#tag{position:absolute;top:70px;left:0;right:0;text-align:center;z-index:9}#tag span{display:inline-block;direction:rtl;background:#111;color:#fff;font-family:Tajawal;font-weight:800;font-size:40px;padding:10px 32px;border-radius:40px}#tag b{color:#F2C14E}
</style></head><body><div id="cam"></div><div id="tag"><span><b>أبو تركي يختصرها</b> · الحلقة 4 · الجزء 2</span></div>
<script>
const O=0.3;
const BLK='#121214',YEL='#F2C14E',RED='#E5383B',CRM='#F4EAD5',TEAL='#1FA39A';
const SC=[['A',0,6.38,YEL],['B',6.38,11.08,TEAL],['C',11.08,16.22,CRM],['D',16.22,20.46,RED],['E',20.46,24.6,YEL],['F',24.6,27.36,BLK],['G',27.36,30.58,CRM],['K',30.58,36.4,BLK],['Z',36.4,99,BLK]];
const N=(n)=>`<div class="e num" style="top:200px"><span>${n}</span></div>`;
const E=[
['A',0,'up',`<div class="e t" style="top:220px;font-size:92px;color:#111">استلمت سيارتك <span class="hl" style="--hc:#fff">الجديدة؟</span></div>`],
['A',2.22,'up',`<div class="e t" style="top:420px;font-size:96px;color:#111">هذي <span style="color:#E5383B">5 أشياء</span> لازم تسويها</div>`],
['A',4.66,'stamp',`<div class="e t" style="top:580px;font-size:150px;color:#fff"><span class="hl" style="--hc:#111;color:#F2C14E">في أوّل أسبوع!</span></div>`],
['A',0.1,'pop',`<img class="e c" src="as/c_t_open.png" style="width:760px;left:160px;top:1000px">`],
['A',0.6,'pop',`<img class="e c" src="as/c_bow.png" style="width:260px;left:780px;top:860px">`],
['B',6.38,'stamp',N(1)],
['B',7.26,'up',`<div class="e t" style="top:440px;font-size:130px;color:#fff">التأمين</div>`],
['B',7.5,'pop',`<img class="e c" src="as/c_umb.png" style="width:600px;left:240px;top:640px">`],
['B',8.14,'up',`<div class="e t" style="top:1330px;font-size:88px;color:#fff">تأكّد إنه ساري</div>`],
['B',9.52,'up',`<div class="e t" style="top:1470px;font-size:100px;color:#fff"><span class="hl" style="--hc:#111;color:#F2C14E">من أوّل مشوار</span></div>`],
['C',11.08,'stamp',N(2)],
['C',11.86,'up',`<div class="e t" style="top:440px;font-size:120px;color:#111">الكرسي والمرايات</div>`],
['C',12.2,'slideR',`<img class="e c" src="as/c_mirror.png" style="width:660px;left:210px;top:680px">`],
['C',13.34,'up',`<div class="e t" style="top:1330px;font-size:88px;color:#111">اضبطها زين</div>`],
['C',14.48,'up',`<div class="e t" style="top:1470px;font-size:100px;color:#111"><span class="hl" style="--hc:#1FA39A;color:#fff">وبعدين تحرّك</span></div>`],
['D',16.22,'stamp',N(3)],
['D',17.1,'up',`<div class="e t" style="top:440px;font-size:130px;color:#fff">الكتيّب</div>`],
['D',17.3,'pop',`<img class="e c" src="as/c_manual.png" style="width:680px;left:200px;top:660px">`],
['D',17.8,'up',`<div class="e t" style="top:1300px;font-size:84px;color:#fff">حتى لو تشوف بس</div>`],
['D',19.16,'up',`<div class="e t" style="top:1440px;font-size:100px;color:#fff"><span class="hl" style="--hc:#111;color:#F2C14E">جدول الصيانة</span></div>`],
['E',20.46,'stamp',N(4)],
['E',21.24,'up',`<div class="e t" style="top:440px;font-size:130px;color:#111">الأوراق</div>`],
['E',21.5,'pop',`<img class="e c" src="as/c_phone.png" style="width:600px;left:240px;top:650px">`],
['E',22.0,'up',`<div class="e t" style="top:1330px;font-size:88px;color:#111">صوّرها واحفظها</div>`],
['E',23.42,'up',`<div class="e t" style="top:1470px;font-size:100px;color:#111"><span class="hl" style="--hc:#fff">في جوّالك</span></div>`],
['F',24.6,'stamp',`<div class="e t" style="top:260px;font-size:170px;color:#F2C14E">والخامس</div>`],
['F',25.42,'up',`<div class="e t" style="top:520px;font-size:104px;color:#fff">أغلب الناس <span class="hl" style="--hc:#E5383B">يأجّلونه!</span></div>`],
['F',24.8,'pop',`<img class="e c" src="as/c_t_watch.png" style="width:700px;left:190px;top:900px">`],
['G',27.36,'stamp',N(5)],
['G',27.36,'up',`<div class="e t" style="top:440px;font-size:130px;color:#111">أوّل صيانة</div>`],
['G',27.6,'pop',`<img class="e c" src="as/c_service.png" style="width:600px;left:240px;top:650px">`],
['G',28.3,'up',`<div class="e t" style="top:1330px;font-size:88px;color:#111">سجّل موعدها</div>`],
['G',29.54,'up',`<div class="e t" style="top:1470px;font-size:100px;color:#111"><span class="hl" style="--hc:#E5383B;color:#fff">من اليوم</span></div>`],
['K',30.58,'up',`<div class="e t" style="top:230px;font-size:92px;color:#fff">وإذا لسّا ما اخترت سيارتك؟</div>`],
['K',32.46,'pop',`<img class="e" src="as/logo_full.png" style="width:640px;left:220px;top:400px">`],
['K',33.9,'pop',`<div class="e t" style="top:700px;font-size:130px;color:#F2C14E">كاش أو تمويل</div>`],
['K',35.14,'up',`<div class="e t" style="top:880px;font-size:100px;color:#fff"><span class="hl" style="--hc:#E5383B">والخيار لك</span></div>`],
['K',31.2,'pop',`<img class="e c" src="as/c_t_thumb.png" style="width:640px;left:220px;top:1090px">`],
['Z',36.4,'pop',`<img class="e" src="as/logo_full.png" style="width:760px;left:160px;top:640px">`],
['Z',36.6,'pop',`<div class="e t" style="top:1000px"><span class="pill">920018915</span></div>`]];
const cam=document.getElementById('cam');
SC.forEach(([id,a,b,bg])=>{const d=document.createElement('div');d.className='sc';d.id='S'+id;d.style.background=bg;d.innerHTML='<div class="noise"></div>';cam.appendChild(d);});
const EL=E.map(([s,at,an,h],i)=>{const w=document.createElement('div');w.innerHTML=h;const el=w.firstElementChild;document.getElementById('S'+s).appendChild(el);return {el,at,an,s,base:el.style.transform||''};});
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-x,3),bo=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function hash(n){return Math.sin(n*127.1)*43758.5453%1}
function render(TT){const t=TT-O; let shake=0, punch=0;
 SC.forEach(([id,a,b])=>{const on=t>=a-0.001&&t<b; document.getElementById('S'+id).style.display=on?'block':'none'; if(on){const k=t-a; shake=Math.max(shake,Math.exp(-k*9)); punch=Math.exp(-k*7);} });
 EL.forEach(({el,at,an})=>{const k=cl((t-at)/0.4); let op=t>=at?1:0, tr='';
  if(an==='up'){tr=`translateY(${(1-eo(k))*80}px)`;op=cl((t-at)/0.2);}
  else if(an==='pop'){tr=`scale(${t<at?0:bo(k)}) rotate(${Math.sin((t-at)*2.4)*1.5}deg)`;}
  else if(an==='stamp'){const kk=cl((t-at)/0.25); tr=`scale(${2.4-1.4*eo(kk)}) rotate(${(1-kk)*12-2}deg)`;op=kk;}
  else if(an==='slideR'){tr=`translateX(${(1-eo(k))*900}px) rotate(${(1-eo(k))*10}deg)`;}
  else if(an==='slideL'){tr=`translateX(${(1-eo(k))*-900}px) rotate(${(1-eo(k))*-10}deg)`;}
  else if(an==='draw'){el.querySelectorAll('path,ellipse').forEach(p=>p.setAttribute('stroke-dashoffset',1-eo(cl((t-at)/0.5))));}
  if(an!=='draw'){el.style.transform=tr;} el.style.opacity=op;
  el.querySelectorAll('.hl').forEach(h=>h.style.setProperty('--hx',eo(cl((t-at-0.15)/0.3))));
  el.querySelectorAll('.lateDraw').forEach(p=>p.setAttribute('stroke-dashoffset',1-eo(cl((t-(+p.dataset.at))/0.4))));
 });
 const sx=Math.sin(t*90)*14*shake, sy=Math.cos(t*77)*10*shake; document.getElementById('tag').style.opacity=t>=36.4?0:1; cam.style.transform=`translate(${sx}px,${sy}px) scale(${1+0.06*punch})`;
}
window.render=render; render(0);
</script></body></html>
