<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:'IBM Plex Sans Arabic';direction:rtl;color:#202124}
.sc{position:absolute;inset:0;opacity:0}
#home .brand{position:absolute;left:0;right:0;top:470px;text-align:center;font-family:Tajawal;font-weight:900;font-size:120px;color:#202124;letter-spacing:-2px}
#home .brand span{color:#1a73e8}
.bar{position:absolute;left:60px;right:60px;height:130px;border-radius:65px;border:3px solid #dfe1e5;box-shadow:0 4px 18px rgba(32,33,36,.18);background:#fff;display:flex;align-items:center;padding:0 50px;box-sizing:border-box;gap:30px;font-size:52px}
.bar svg{flex:none}
#q{flex:1;white-space:nowrap;overflow:hidden}
#caret{display:inline-block;width:4px;height:58px;background:#1a73e8;vertical-align:middle;margin-right:4px}
#sug{position:absolute;left:60px;right:60px;top:860px;background:#fff;border-radius:0 0 40px 40px;box-shadow:0 14px 24px rgba(32,33,36,.18);overflow:hidden}
.sg{display:flex;align-items:center;gap:30px;padding:26px 50px;font-size:46px;color:#202124}
.sg b{font-weight:700}
#spin{position:absolute;left:490px;top:1100px;width:100px;height:100px;border-radius:50%;border:12px solid #e8eaed;border-top-color:#1a73e8;opacity:0}
#res .top{position:absolute;left:0;right:0;top:0;height:300px;background:#fff;border-bottom:2px solid #ebebeb}
#res .bar{top:110px;height:110px;font-size:44px;box-shadow:none}
.tabs{position:absolute;top:240px;right:70px;display:flex;gap:56px;font-size:38px;color:#5f6368}
.tabs .on{color:#1a73e8;border-bottom:6px solid #1a73e8;padding-bottom:10px}
.r{position:absolute;left:50px;right:50px;border-radius:34px;background:#fff;padding:40px 46px;box-sizing:border-box}
#r1{top:520px;border:4px solid #1a73e8;box-shadow:0 10px 40px rgba(26,115,232,.25)}
#r1 .lab{position:absolute;top:-34px;right:40px;background:#1a73e8;color:#fff;font-family:Tajawal;font-weight:900;font-size:40px;padding:6px 26px;border-radius:30px}
.site{display:flex;align-items:center;gap:22px;font-size:36px;color:#5f6368}
.fav{width:76px;height:76px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fav img{width:52px}
.r h2{margin:20px 0 6px;font-size:62px;color:#1a0dab;font-weight:700}
.r p{margin:0;font-size:40px;color:#4d5156;line-height:1.5}
.cars{display:flex;gap:20px;margin-top:26px}
.cars div{flex:1;height:300px;border-radius:24px;background:#f1f3f4;position:relative;overflow:hidden}
.cars img{position:absolute;width:118%;left:-9%;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:24px;margin-top:30px;justify-content:flex-start}
.chip{font-family:Tajawal;font-weight:900;font-size:56px;padding:16px 44px;border-radius:40px;border:4px solid #dadce0;color:#5f6368}
.chip.on{border-color:#188038;color:#188038;background:#e6f4ea}
.btns{display:flex;gap:24px;margin-top:36px}
.btn{flex:1;text-align:center;font-family:Tajawal;font-weight:900;font-size:52px;padding:26px 0;border-radius:60px;border:3px solid #dadce0;color:#1a73e8;position:relative;overflow:hidden}
.btn.pr{background:#1a73e8;color:#fff;border-color:#1a73e8}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55);left:50%;top:50%;margin:-20px 0 0 -20px;transform:scale(0)}
.ghost{top:0;opacity:.5}
#cta{position:absolute;left:0;right:0;top:1640px;text-align:center;white-space:nowrap;font-family:Tajawal;font-weight:900;font-size:70px;color:#202124;opacity:0}
#cta span{color:#1a73e8}
#hand{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(32,33,36,.25);border:6px solid rgba(255,255,255,.9);opacity:0;z-index:5}
#end{position:absolute;inset:0;background:#0d0d0f;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:80px;z-index:9}
#end .n{font-family:Tajawal;font-weight:900;font-size:110px;color:#111;background:#F2C14E;padding:14px 60px;border-radius:30px;direction:ltr}
</style></head><body>
<div class="sc" id="home"><div class="brand">ا<span>بـ</span>حث</div>
 <div class="bar" style="top:730px" id="hb"><svg width="56" height="56" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" stroke="#9aa0a6" stroke-width="2.4" fill="none"/><path d="M15 15l6 6" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/></svg><div id="q"></div></div>
 <div id="sug"></div><div id="spin"></div></div>
<div class="sc" id="res"><div class="top"><div class="bar"><svg width="48" height="48" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" stroke="#9aa0a6" stroke-width="2.4" fill="none"/><path d="M15 15l6 6" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/></svg><div>وين أحصّل سيارتي بسهولة</div></div>
 <div class="tabs"><span class="on">الكل</span><span>الخرائط</span><span>الصور</span><span>الأخبار</span></div></div>
 <div class="r" id="r1"><div class="lab">النتيجة الأولى</div>
  <div class="site"><div class="fav"><img src="as/m.png"></div><div><div style="color:#202124;font-size:40px;font-weight:700">ماكس موتورز</div>معرض سيارات · الرياض</div></div>
  <h2>ماكس موتورز | سيارتك بسهولة</h2>
  <div class="cars" id="cars"><div><img src="as/p.png"></div><div><img src="as/t.png"></div><div><img src="as/h.png"></div></div>
  <p id="brands" style="margin-top:18px">ماركات كثيرة · سيدان · عائلية · دفع رباعي</p>
  <div class="chips"><span class="chip" id="k1">كاش ✔</span><span class="chip" id="k2">تمويل ✔</span></div>
  <div class="btns"><div class="btn pr" id="call">📞 اتصال<i id="rip"></i></div><div class="btn">الموقع</div></div>
 </div>
 <div id="cta">كلّمنا اليوم… <span>وسيارتك تنتظرك</span></div></div>
<div id="hand"></div>
<div id="end"><img src="as/logo_full.png" style="width:780px"><div class="n">920018915</div></div>
<script>
const $=id=>document.getElementById(id);
function E(t,a,d){return Math.max(0,Math.min(1,(t-a)/d))}
function ez(p){return 1-Math.pow(1-p,3)}
function back(p){const c=1.7;p=p-1;return 1+p*p*((c+1)*p+c)}
const Q=[[0.3,1.1,'سيارة جديدة',['سيارة جديدة وأحتار وش آخذ','سيارة جديدة للعائلة','سيارة جديدة ٢٠٢٦'],1.6],
 [2.6,3.4,'كاش ولا تمويل؟',['كاش ولا تمويل أفضل','كاش ولا تمويل للسيارة','كاش ولا تمويل وش الفرق'],3.9],
 [5.1,6.0,'وين أحصّل سيارتي بسهولة',['وين أحصّل سيارتي بسهولة','وين أحصّل سيارتي بسهولة بالرياض'],6.3]];
const KEYS=[];Q.forEach(q=>{const n=[...q[2]].length;for(let i=0;i<n;i++)KEYS.push(+(q[0]+(q[1]-q[0])*i/n).toFixed(3))});window.KEYS=KEYS;
const mag='<svg width="40" height="40" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" stroke="#9aa0a6" stroke-width="2.4" fill="none"/><path d="M15 15l6 6" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/></svg>';
let lastS='';
window.render=function(t){
 $('home').style.opacity=1-E(t,7.3,.25);$('res').style.opacity=E(t,7.3,.25);
 let k=0;for(let i=0;i<Q.length;i++)if(t>=Q[i][0])k=i;const q=Q[k];const ch=[...q[2]];const n=Math.round(ch.length*E(t,q[0],q[1]-q[0]));
 $('q').innerHTML=ch.slice(0,n).join('')+(t<6.8&&Math.floor(t*2.5)%2==0?'<span id="caret"></span>':'<span id="caret" style="opacity:0"></span>');
 const so=t>=q[4]&&t<(Q[k+1]?Q[k+1][0]-.15:6.8);const sh=so?q[3].map(s=>`<div class="sg">${mag}<span>${s.startsWith(q[2])?q[2]+"<b>"+s.slice(q[2].length)+"</b>":"<b>"+s+"</b>"}</span></div>`).join(''):'';
 if(sh!==lastS){$('sug').innerHTML=sh;lastS=sh}
 $('hb').style.borderRadius=so?'65px 65px 0 0':'65px';
 const sp=E(t,6.8,.1)*(1-E(t,7.3,.1));$('spin').style.opacity=sp;$('spin').style.transform=`rotate(${t*720}deg)`;
 // results
 const r=E(t,7.45,.5);$('r1').style.transform=`translateY(${(1-ez(r))*120}px) scale(${.96+.04*ez(r)})`;$('r1').style.opacity=r;
 $('r1').querySelector('.lab').style.transform=`scale(${back(E(t,7.5,.35))})`;
 const cs=$('cars').children;for(let i=0;i<3;i++){const p=E(t,9.9+i*.18,.35);cs[i].style.transform=`scale(${back(p)})`;cs[i].style.opacity=p}
 $('brands').style.opacity=E(t,10.2,.3);
 [['k1',12.58],['k2',13.24]].forEach(([id,a])=>{const e=$(id);e.className='chip'+(t>=a?' on':'');e.style.transform=`scale(${1+.15*Math.sin(Math.PI*E(t,a,.3))})`});
 // tap call at 14.4
 const hp=E(t,13.9,.4);const hx=540+330,hy=0;const call=$('call').getBoundingClientRect();
 $('hand').style.left=(call.left+call.width/2-60+(1-ez(hp))*200)+'px';$('hand').style.top=(call.top+call.height/2-60+(1-ez(hp))*300)+'px';
 $('hand').style.opacity=E(t,13.9,.2)*(1-E(t,15.0,.2));$('hand').style.transform=`scale(${t>14.4&&t<14.6?.8:1})`;
 const rp=E(t,14.45,.5);$('rip').style.transform=`scale(${rp*14})`;$('rip').style.opacity=1-rp;
 const c=E(t,14.2,.4);$('cta').style.opacity=c;$('cta').style.transform=`translateY(${(1-ez(c))*40}px)`;
 $('end').style.opacity=E(t,17.0,.35);
};window.render(0);
</script></body></html>
