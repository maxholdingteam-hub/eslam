<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Michroma&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Cairo}
#v{position:absolute;left:0;top:0;width:1080px;height:1920px}
.g{position:absolute;border-radius:44px;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(30,24,12,.18) 45%,rgba(255,255,255,.12));
 -webkit-backdrop-filter:blur(22px) saturate(1.7) brightness(1.08);backdrop-filter:blur(22px) saturate(1.7) brightness(1.08);
 border:1.5px solid rgba(255,255,255,.55);box-shadow:0 30px 60px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.2);
 color:#fff;direction:rtl;text-align:center;overflow:hidden;opacity:0;transform-origin:var(--ox,50%) var(--oy,50%)}
.g:before{content:'';position:absolute;left:-40%;top:-60%;width:80%;height:120%;background:linear-gradient(115deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));transform:rotate(18deg);left:var(--sh,-60%)}
.g img.ph{display:block;width:100%;border-radius:30px}
.lab{font-weight:900;font-size:62px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.sm{font-weight:600;font-size:34px;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.gold{color:#F2CC5A;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.chip{display:inline-block;margin-top:8px;padding:4px 22px;border-radius:30px;background:rgba(201,162,39,.85);color:#1a1200;font-weight:800;font-size:30px}
#teth{position:absolute;inset:0;pointer-events:none}
#end{position:absolute;inset:0;background:#000;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:80px;z-index:9}
#end .n{font-weight:900;font-size:110px;color:#2a1a00;background:linear-gradient(180deg,#fbe39a,#e2b04a 50%,#b9832a);padding:6px 60px 12px;border-radius:24px;direction:ltr}
</style></head><body>
<img id="v">
<svg id="teth" width="1080" height="1920"><defs><filter id="gl"><feGaussianBlur stdDeviation="4"/></filter></defs>
 <line id="tl" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0"/><line id="tl2" stroke="#F2CC5A" stroke-width="10" filter="url(#gl)" opacity="0"/>
 <circle id="tip" r="16" fill="#fff" opacity="0" filter="url(#gl)"/></svg>
<div id="P"></div>
<div id="end"><img src="as/logo.png" style="width:780px"><div class="n">920018915</div></div>
<script>
let C;const $=id=>document.getElementById(id);
function E(t,a,d){return Math.max(0,Math.min(1,(t-a)/d))}function ez(p){return 1-Math.pow(1-p,3)}function back(p){const c=1.6;p=p-1;return 1+p*p*((c+1)*p+c)}
const W=430;
// panel definitions: [id, start, end, html, width, mode]
function card(img,lab,extra=''){return `<div style="padding:16px 16px 22px"><img class="ph" src="as/${img}.jpg"><div class="lab" style="margin-top:12px">${lab}</div>${extra}</div>`}
let PN=[];
async function init(){C=await (await fetch('cfg.json')).json();const v=C.ev;
 PN=[
 ['logo',v.logo,v.choices-0.1,`<div style="padding:34px 20px 30px"><img src="as/emblem.png" style="width:170px"><div style="font-family:Michroma;font-size:30px;letter-spacing:4px;margin-top:4px" class="gold">MAX MOTORS</div><div class="sm" style="margin-top:6px">ماكس موتورز</div></div>`,W,'hand'],
 ['ch1',v.choices,v.ask-0.1,card('c1','هافال H9'),330,'fix',[40,520]],
 ['ch2',v.choices+0.15,v.ask-0.1,card('c2','باليسيد'),330,'fix',[710,470]],
 ['ch3',v.choices+0.3,v.ask-0.1,card('c3','أوروس'),330,'fix',[690,960]],
 ['ask',v.ask,v.suv-0.05,`<div style="padding:40px 26px"><div class="lab">وش اللي</div><div class="lab gold">بخاطرك؟</div></div>`,W,'hand'],
 ['suv',v.suv,v.sedan-0.05,card('suv','جيب',`<div class="chip">متوفر</div>`),W,'hand'],
 ['sedan',v.sedan,v.pickup-0.05,card('sedan','سيدان',`<div class="chip">متوفر</div>`),W,'hand'],
 ['pickup',v.pickup,v.all-0.05,card('pickup','بيكاب',`<div class="chip">متوفر</div>`),W,'hand'],
 ['all',v.all,v.app-0.1,`<div style="padding:18px 18px 26px"><div style="display:flex;gap:8px"><img class="ph" style="width:33%;border-radius:18px" src="as/suv.jpg"><img class="ph" style="width:33%;border-radius:18px" src="as/sedan.jpg"><img class="ph" style="width:33%;border-radius:18px" src="as/pickup.jpg"></div><div class="lab" style="margin-top:14px">✔ كله <span class="gold">متوفر</span></div></div>`,470,'hand'],
 ['app',v.app,v.site-0.05,`<div style="padding:16px"><div style="border-radius:40px;overflow:hidden;border:6px solid rgba(0,0,0,.55);height:600px"><img src="as/app.jpg" style="width:100%"></div><div class="lab" style="font-size:44px;margin-top:10px">نزّل <span class="gold">التطبيق</span></div></div>`,360,'hand'],
 ['site',v.site,v.num-0.05,`<div style="padding:14px 14px 20px"><div style="display:flex;gap:8px;padding:6px 10px"><i style="width:14px;height:14px;border-radius:50%;background:#ff5f57"></i><i style="width:14px;height:14px;border-radius:50%;background:#febc2e"></i><i style="width:14px;height:14px;border-radius:50%;background:#28c840"></i></div><img class="ph" src="as/site.jpg" style="border-radius:20px"><div class="lab gold" style="font-size:50px;margin-top:10px;direction:ltr">maxmotors.sa</div></div>`,520,'hand'],
 ['num',v.num,v.mats-0.05,`<div style="padding:34px 20px 30px"><div class="sm">الرقم الموحد</div><div class="lab gold" style="font-size:88px;direction:ltr">920018915</div><div class="sm">📞 اتصل الحين</div></div>`,470,'hand'],
 ['mats',v.mats,v.end-0.1,`<div style="padding:26px 22px"><div class="lab">أرضيات <span class="gold">جلد</span></div><div class="sm">ماكس موتورز</div></div>`,380,'fix',[40,760]]];
 const P=$('P');PN.forEach(p=>{const d=document.createElement('div');d.className='g';d.id='p_'+p[0];d.style.width=p[4]+'px';d.innerHTML=p[3];P.appendChild(d)});
 await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
}
const ready=init();
window.render=async function(t){await ready;
 const k=Math.min(C.frames.length-1,Math.floor(t*30));const tp=C.tips[k];
 let teth=null;
 PN.forEach(([id,a,b,h,w,mode,pos])=>{const el=$('p_'+id);const on=t>=a&&t<b+0.35;if(!on){el.style.opacity=0;return}
  const pin=E(t,a,.45),pout=E(t,b,.3);
  let x,y;const ka=Math.min(C.frames.length-1,Math.floor(a*30));const ta=C.tips[ka];
  if(mode==='fix'){[x,y]=pos}else{const right=ta[0]>540;x=right?Math.min(1080-w-30,ta[0]+40):Math.max(30,ta[0]-w-40);y=Math.max(260,Math.min(1250,ta[1]-260));x+= (tp[0]-ta[0])*.25;y+=(tp[1]-ta[1])*.3}
  el.style.left=x+'px';el.style.top=y+'px';
  const ox=(tp[0]-x)+'px',oy=(tp[1]-y)+'px';el.style.setProperty('--ox',ox);el.style.setProperty('--oy',oy);
  el.style.opacity=Math.min(1,pin*1.6)*(1-pout);el.style.transform=`scale(${(0.15+0.85*back(pin))*(1-0.1*pout)})`;
  el.style.setProperty('--sh',(-60+220*E(t,a+.25,.9))+'%');
  if(mode==='hand'&&t<b) teth={x:x+(tp[0]>x+w/2?w:0),y:y+el.offsetHeight/2,a:(1-E(t,a+1.0,.6))*0.85+0.15};
 });
 const tl=$('tl'),tl2=$('tl2'),tc=$('tip');
 if(teth){[tl,tl2].forEach(l=>{l.setAttribute('x1',tp[0]);l.setAttribute('y1',tp[1]);l.setAttribute('x2',teth.x);l.setAttribute('y2',teth.y)});tl.setAttribute('opacity',teth.a*.9);tl2.setAttribute('opacity',teth.a*.6);tc.setAttribute('cx',tp[0]);tc.setAttribute('cy',tp[1]);tc.setAttribute('opacity',teth.a)}
 else{tl.setAttribute('opacity',0);tl2.setAttribute('opacity',0);tc.setAttribute('opacity',0)}
 $('end').style.opacity=E(t,C.ev.end,.35);
 const v=$('v'),src=C.frames[k];if(v.getAttribute('src')===src)return;
 await new Promise(r=>{v.onload=r;v.src=src});
};
</script></body></html>
