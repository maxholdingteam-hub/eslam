<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0e0e10;font-family:Tajawal}
.scene{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover}
.dark .bg{background-image:url(as/dark.jpg)}
.dark .glow{position:absolute;left:-200px;right:-200px;top:520px;height:900px;background:radial-gradient(ellipse at center,rgba(212,168,75,.20),rgba(0,0,0,0) 60%)}
.cream .bg{background-image:url(as/cream.jpg)}
.hdr{position:absolute;left:0;right:0;top:56px;text-align:center}
.hdr img{width:300px}
.ftr{position:absolute;left:120px;right:120px;bottom:70px;display:flex;align-items:center;gap:24px;font-family:Arial;font-weight:700;font-size:30px;letter-spacing:3px}
.ftr i{flex:1;height:2px}
.dark .ftr{color:#D4A84B}.dark .ftr i{background:rgba(212,168,75,.5)}
.cream .ftr{color:#7a5b1e}.cream .ftr i{background:rgba(122,91,30,.4)}
.el{position:absolute;will-change:transform,opacity}
.t{direction:rtl;text-align:center;font-weight:900;line-height:1.05;white-space:nowrap}
.dark .t{color:#F7F3EA}.cream .t{color:#121214}
.g{color:#D4A84B!important}
.brush{position:absolute;z-index:-1}
img.c{filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.pill{background:#D4A84B;color:#111;border-radius:80px;padding:18px 70px;font-family:Arial;font-weight:900;font-size:76px;letter-spacing:5px}
.edge{position:absolute;left:0;right:0;height:60px}
</style></head><body>

 <img class="el c" id="s3r" src="as/c_rings.png" style="width:330px;left:640px;top:330px">
 <div class="el t" id="s3a" style="top:420px;left:110px;font-size:120px">تتزوّج…</div>

 <img class="el c" id="s3c" src="as/c_family.png" style="width:900px;left:90px;top:960px">

 <div class="el t" id="s5a" style="top:330px;left:0;right:0;font-size:84px">وتجي اللحظة<br>اللي تحقّق فيها</div>

<div class="scene dark" id="s7"><div class="bg"></div><div class="glow"></div>
 <img class="el c" id="s7c1" src="as/c_coins.png" style="width:470px;left:560px;top:600px">
 <div class="el t g" id="s7a" style="top:1060px;left:600px;width:420px;font-size:150px">كاش</div>

 <img class="el" id="s8l" src="as/logo_full.png" style="width:820px;left:130px;top:620px">
 <div class="el t" id="s8a" style="top:900px;left:0;right:0;font-size:104px">معك في <span class="g">كل مرحلة</span></div>
 <img class="el c" id="s8k" src="as/c_key.png" style="width:230px;left:425px;top:1080px">
 <div class="el" id="s8p" style="top:1620px;left:0;right:0;text-align:center"><span class="pill">920018915</span></div>
</div>
<script>
const SC=[['s1',0,3.86],['s2',3.86,6.38],['s3',6.38,8.54],['s4',8.54,11.36],['s5',11.36,14.3],['s6',14.3,17.9],['s7',17.9,20.76],['s8',20.76,99]];
// header/footer on every scene
for(const [id] of SC){const s=document.getElementById(id);
 if(id!=='s8'){const h=document.createElement('div');h.className='hdr';h.innerHTML='<img src="as/logo_full.png">';s.appendChild(h);}
 const f=document.createElement('div');f.className='ftr';f.innerHTML='<i></i><span>920018915</span><i></i>';s.appendChild(f);}
const O=0.3; // voice offset
// element animations: [id, at, type]
const A=[['s1a',0,'up'],['s1b',1.44,'up'],['s1k',1.9,'drop'],
['s2a',3.86,'up'],['s2br',5.0,'wipe'],['s2b',5.04,'pop'],['s2c',5.3,'slideR'],
['s3a',6.38,'up'],['s3r',6.5,'pop'],['s3b',7.18,'up'],['s3c',7.5,'slideL'],
['s4a',8.54,'up'],['s4br',9.0,'wipe'],['s4b',9.08,'pop'],['s4c',9.96,'up'],['s4d',10.2,'slideR'],
['s5a',11.36,'up'],['s5c',12.4,'rise'],['s5b',13.58,'pop'],
['s6a',14.3,'up'],['s6c',15.3,'pop'],['s6br',15.5,'wipe'],['s6b',15.56,'pop'],['s6d',16.78,'up'],
['s7c1',17.9,'slideR'],['s7a',17.95,'pop'],['s7o',18.56,'pop'],['s7c2',18.88,'slideL'],['s7b',18.9,'pop'],['s7br',19.5,'wipe'],['s7d',19.54,'pop'],
['s8l',20.76,'pop'],['s8a',21.72,'up'],['s8k',22.3,'drop'],['s8p',22.9,'pop']];
const cl=x=>Math.max(0,Math.min(1,x)), eo=x=>1-Math.pow(1-x,3), bo=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function render(t){
 for(const [id,s,e] of SC){const el=document.getElementById(id); const S=s+O, E=e+O;
  if(t<S-0.001||t>=E+0.4){el.style.display='none';continue;} el.style.display='block';
  // enter: torn wipe up from bottom over previous
  const k=cl((t-S)/0.38); const y=(1-eo(k))*1920; el.style.transform=`translateY(${id==='s1'?0:y}px)`; el.style.zIndex=SC.findIndex(x=>x[0]===id);
  // slow push
  el.querySelector('.bg').style.transform=`scale(${1+0.02*cl((t-S)/4)})`;
 }
 for(const [id,at,ty] of A){const el=document.getElementById(id); const T=at+O; const k=cl((t-T)/0.45);
  let tr='',op=k>0?1:0; const kk=eo(k), kb=bo(k);
  if(ty==='up'){tr=`translateY(${(1-kk)*70}px)`;op=cl((t-T)/0.25);}
  else if(ty==='pop'){tr=`scale(${0.4+0.6*kb})`;op=cl((t-T)/0.15);}
  else if(ty==='drop'){tr=`translateY(${(1-kb)*-500}px) rotate(${(1-kk)*-25}deg)`;op=cl((t-T)/0.1);}
  else if(ty==='slideR'){tr=`translateX(${(1-kk)*1200}px) rotate(${(1-kk)*6}deg)`;}
  else if(ty==='slideL'){tr=`translateX(${(1-kk)*-1200}px) rotate(${(1-kk)*-6}deg)`;}
  else if(ty==='rise'){tr=`translateY(${(1-kk)*500}px) scale(${0.85+0.15*kk})`;op=cl((t-T)/0.3);}
  else if(ty==='wipe'){el.style.clipPath=`inset(0 0 0 ${(1-kk)*100}%)`;tr='';}
  // idle float after entering
  if(k>=1 && (ty==='slideR'||ty==='slideL'||ty==='rise'||ty==='drop')) tr+=` translateY(${Math.sin((t-T)*2.2)*6}px)`;
  el.style.opacity=op; el.style.transform=tr;
 }
 const g=document.getElementById('s5g'); g.style.opacity=0.6+0.4*Math.sin(t*3);
}
window.render=render; render(0);
</script></body></html>
