<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:Tajawal;background:#efe6d8}
#app{position:absolute;inset:0}
#wall{position:absolute;inset:0;background:#efe6d8;background-image:radial-gradient(rgba(150,120,80,.13) 3px,transparent 3px),radial-gradient(rgba(150,120,80,.08) 2px,transparent 2px);background-size:70px 70px,35px 35px;background-position:0 0,17px 17px}
#status{position:absolute;left:0;right:0;top:0;height:70px;background:#121214;color:#fff;font:700 34px Arial;display:flex;justify-content:space-between;align-items:center;padding:0 46px;box-sizing:border-box}
#head{position:absolute;left:0;right:0;top:70px;height:150px;background:#121214;display:flex;align-items:center;direction:rtl;padding:0 34px;gap:24px;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:3}
#head .av{width:104px;height:104px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #F2C14E}
#head .av img{width:96px}
#head .nm{color:#fff;font-weight:900;font-size:46px;line-height:1.1}
#head .nm b{color:#F2C14E;font-size:34px;margin-right:6px}
#head .st{color:#9fe0b5;font-size:30px;font-weight:700}
#head .ic{margin-right:auto;color:#fff;font-size:44px;opacity:.9;letter-spacing:26px}
#chat{position:absolute;left:0;right:0;top:220px;bottom:180px;overflow:hidden}
#inner{position:absolute;left:0;right:0;top:0}
.msg{position:absolute;max-width:760px;direction:rtl;border-radius:30px;padding:22px 30px 16px;font-size:46px;font-weight:700;color:#1d1d1f;box-shadow:0 3px 6px rgba(0,0,0,.12);transform-origin:bottom}
.me{left:34px;background:#F7E3A1;border-bottom-left-radius:8px}
.them{right:34px;background:#fff;border-bottom-right-radius:8px}
.tm{font:500 24px Arial;color:#8a8a8a;text-align:left;margin-top:6px}
.me .tm::after{content:' ✓✓';color:#1FA39A}
.vn{display:flex;align-items:center;gap:22px;width:720px;padding:20px 26px 14px}
.vn .pa{position:relative}
.vn .pa img{width:120px;height:120px;border-radius:50%;display:block}
.vn .pa i{position:absolute;right:-6px;bottom:-4px;width:44px;height:44px;border-radius:50%;background:#1FA39A;color:#fff;font-style:normal;font-size:26px;display:flex;align-items:center;justify-content:center;border:4px solid #fff}
.vn .pl{width:0;height:0;border-left:34px solid #555;border-top:22px solid transparent;border-bottom:22px solid transparent;margin-left:6px}
.vn .pl.on{border:none;width:34px;height:44px;background:linear-gradient(90deg,#555 0 12px,transparent 12px 22px,#555 22px 34px)}
.vn .wv{flex:1;height:90px;display:flex;align-items:center;gap:5px;direction:ltr}
.vn .wv b{flex:1;background:#c9c9c9;border-radius:4px}
.vn .du{font:600 26px Arial;color:#8a8a8a;position:absolute;left:180px;bottom:14px}
.img{padding:10px;width:700px}
.img img{width:100%;border-radius:22px;display:block}
.img .cap{font-size:42px;padding:12px 14px 0}
#typing{position:absolute;right:34px;background:#fff;border-radius:30px;padding:22px 34px;font-size:34px;color:#1FA39A;font-weight:800;direction:rtl;opacity:0;box-shadow:0 3px 6px rgba(0,0,0,.12)}
#bar{position:absolute;left:0;right:0;bottom:0;height:180px;background:#f6f1e8;display:flex;align-items:center;gap:20px;padding:0 30px;box-sizing:border-box;direction:rtl}
#bar .inp{flex:1;height:100px;border-radius:50px;background:#fff;display:flex;align-items:center;padding:0 36px;font-size:40px;color:#999;box-shadow:0 2px 5px rgba(0,0,0,.08)}
#bar .mic{width:110px;height:110px;border-radius:50%;background:#1FA39A;color:#fff;font-size:52px;display:flex;align-items:center;justify-content:center}
#hook{position:absolute;left:0;right:0;top:600px;text-align:center;z-index:5}
#hook span{display:inline-block;direction:rtl;white-space:nowrap;background:#121214;color:#fff;font-family:Lalezar;font-size:78px;padding:22px 44px 8px;border-radius:30px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#hook span b{color:#F2C14E;font-weight:400}
#fin{position:absolute;inset:0;background:#121214;opacity:0;z-index:8}
#fin .pr{position:absolute;left:150px;bottom:0;width:780px}
#fin .lg{position:absolute;left:180px;top:250px;width:720px}
#fin .tx{position:absolute;left:0;right:0;top:560px;text-align:center;direction:rtl;font-family:Lalezar;font-size:110px;color:#fff}
#fin .tx b{color:#F2C14E;font-weight:400}
#endc{position:absolute;inset:0;background:#121214;opacity:0;z-index:9}
#endc img{position:absolute;left:160px;top:640px;width:760px}
#endc .pill{position:absolute;left:0;right:0;top:1000px;text-align:center}
#endc .pill span{display:inline-block;background:#F2C14E;color:#111;border-radius:80px;padding:14px 70px;font-family:Arial;font-weight:900;font-size:72px;letter-spacing:4px}
</style></head><body><div id="app"><div id="wall"></div>
<div id="status"><span>9:41</span><span>●●●● 5G ▮</span></div>
<div id="head"><div class="av"><img src="as/logo_full.png"></div><div><div class="nm">ماكس موتورز <b>✔</b></div><div class="st" id="st">متصل الآن</div></div><div class="ic">📞 ⋮</div></div>
<div id="chat"><div id="inner"></div><div id="typing">🎤 يسجّل مقطع صوتي…</div></div>
<div id="bar"><div class="inp">اكتب رسالة…</div><div class="mic">🎤</div></div>
<div id="hook"><span>تبي سيارة؟ <b>اسأل ماكس موتورز</b> 💬</span></div>
<div id="fin"><img class="lg" src="as/logo_full.png"><div class="tx">سيارتك <b>برسالة!</b></div><img class="pr" src="as/presenter_real.png"></div>
<div id="endc"><img src="as/logo_full.png"><div class="pill"><span>920018915</span></div></div>
</div>
<script>
const O=0.3;
const W=()=>Array.from({length:44},(_,i)=>`<b style="height:${18+Math.round(70*Math.abs(Math.sin(i*1.7)*Math.cos(i*0.6)))}%"></b>`).join('');
const VN=(d)=>`<div class="pa"><img src="as/avatar.png"><i>🎤</i></div><div class="pl"></div><div class="wv">${W()}</div><div class="du">0:0${Math.round(d)}</div>`;
// [at, who, html, kind, dur]
const M=[
[1.6,'me','السلام عليكم 👋'],
[2.5,'me','أبي سيارة للعايلة 🚗'],
[4.2,'them',VN(5.4),'vn',5.41],
[10.0,'them','<img src="as/carnival.jpg"><div class="cap">من سيارات العايلة عندنا 👌</div>','img'],
[11.6,'me','عندكم تمويل؟ 🤔'],
[13.2,'them',VN(4.5),'vn',4.52],
[18.1,'me','وين ألقاكم؟ 📍'],
[19.7,'them',VN(4.5),'vn',4.52],
[24.6,'me','تمام… جايكم 🔥']];
const TY=[[3.0,4.2],[12.2,13.2],[18.7,19.7]];
const inner=document.getElementById('inner'),typing=document.getElementById('typing'),st=document.getElementById('st');
const EL=M.map(([at,who,h,kind,dur],i)=>{const d=document.createElement('div');d.className='msg '+who+(kind==='vn'?' vn':'')+(kind==='img'?' img':'');d.innerHTML=h+(kind==='vn'?'':`<div class="tm">${'9:'+(41+Math.floor(i/3))}</div>`);inner.appendChild(d);return {d,at,kind,dur:dur||0};});
let H=[];function layout(){let y=30;H=EL.map(e=>{const h=e.d.offsetHeight;e.d.style.top=y+'px';const r={top:y,bottom:y+h};y+=h+26;return r;});}
const VIEW=1920-220-180-30;
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-x,3),bo=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let laid=false;
function render(TT){const t=TT-O; if(!laid){layout();laid=true;}
 // scroll
 let sc=0; let prev=0;
 EL.forEach((e,i)=>{ if(t>=e.at){ const target=Math.max(0,H[i].bottom-VIEW+ (TY.some(([a,b])=>t>=a&&t<b)?0:0)); const k=eo(cl((t-e.at)/0.35)); sc=prev+(target-prev)*k; prev=Math.max(prev,target);} });
 // typing bubble placed after last visible msg
 let ty=TY.find(([a,b])=>t>=a&&t<b); let lastB=30; EL.forEach((e,i)=>{if(t>=e.at) lastB=H[i].bottom+26;});
 if(ty){typing.style.top=(lastB-sc)+'px'; typing.style.opacity=1; const tsc=Math.max(0,lastB+110-VIEW); if(tsc>sc) sc=sc+(tsc-sc)*eo(cl((t-ty[0])/0.35)); typing.style.top=(lastB-sc)+'px';} else typing.style.opacity=0;
 st.textContent= ty? 'يسجّل مقطع صوتي…' : 'متصل الآن';
 inner.style.transform=`translateY(${-sc}px)`;
 EL.forEach(e=>{const k=cl((t-e.at)/0.3); e.d.style.opacity=t>=e.at?1:0; e.d.style.transform=`scale(${t<e.at?0.6:0.6+0.4*bo(k)}) translateY(${(1-eo(k))*40}px)`;
  if(e.kind==='vn'){const p=cl((t-e.at-0.25)/e.dur); const bars=e.d.querySelectorAll('.wv b'); const n=Math.floor(p*bars.length); bars.forEach((b,i)=>b.style.background=i<n?'#1FA39A':'#c9c9c9'); e.d.querySelector('.pl').classList.toggle('on',p>0&&p<1);
   const s=Math.floor((t-e.at-0.25)); e.d.querySelector('.du').textContent= p>0&&p<1? '0:0'+Math.max(0,s) : '0:0'+Math.round(e.dur);}});
 // hook
 const hk=document.getElementById('hook'); const kh=cl(t/0.35); hk.style.opacity=t<1.3?1:Math.max(0,1-(t-1.3)/0.3); hk.style.transform=`scale(${0.6+0.4*bo(kh)})`;
 // final
 const kf=cl((t-25.8)/0.4); const fin=document.getElementById('fin'); fin.style.opacity=kf; fin.querySelector('.pr').style.transform=`translateY(${(1-eo(cl((t-26.0)/0.5)))*500}px)`; fin.querySelector('.lg').style.transform=`scale(${0.5+0.5*bo(cl((t-25.9)/0.4))})`; fin.querySelector('.tx').style.opacity=cl((t-26.4)/0.3);
 document.getElementById('endc').style.opacity=cl((t-28.6)/0.3);
}
window.render=render; 
</script></body></html>
