<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#111;font-family:Tajawal}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.noise{position:absolute;inset:0;background:url(as/noise.png);opacity:.18;mix-blend-mode:multiply}
.e{position:absolute;will-change:transform,opacity}
.t{direction:rtl;text-align:center;font-family:Lalezar,Tajawal;line-height:1.15;white-space:nowrap;left:0;right:0}
.hl{position:relative;display:inline-block;padding:0 22px}
.hl::before{content:'';position:absolute;left:0;right:0;top:22%;bottom:8%;background:var(--hc,#F2C14E);transform:skew(-8deg) scaleX(var(--hx,1));transform-origin:right;z-index:-1;border-radius:6px}
img.c{filter:drop-shadow(0 16px 18px rgba(0,0,0,.35))}
.badge{left:0;right:0;text-align:center}
.badge span{display:inline-block;background:#111;color:#F2C14E;font-family:Lalezar,Tajawal;font-size:96px;padding:18px 60px 6px;border-radius:24px;transform:rotate(-3deg);box-shadow:10px 10px 0 rgba(0,0,0,.25)}
.pill{display:inline-block;background:#F2C14E;color:#111;border-radius:80px;padding:14px 70px;font-family:Arial;font-weight:900;font-size:72px;letter-spacing:4px}
svg{position:absolute;overflow:visible}
.lbl{direction:rtl;text-align:center;font-family:Lalezar,Tajawal}
.num{left:0;right:0;text-align:center}.num span{display:inline-block;width:210px;height:210px;line-height:250px;border-radius:50%;background:#111;color:#F2C14E;font-family:Lalezar;font-size:170px;box-shadow:10px 10px 0 rgba(0,0,0,.2)}
#tag{position:absolute;top:70px;left:0;right:0;text-align:center;z-index:9}#tag span{display:inline-block;direction:rtl;background:#111;color:#fff;font-family:Tajawal;font-weight:800;font-size:40px;padding:10px 32px;border-radius:40px}#tag b{color:#F2C14E}
.seal{left:0;right:0;text-align:center}
.seal span{display:inline-block;border:14px solid currentColor;border-radius:26px;padding:16px 56px 0;font-family:Lalezar;font-size:160px;line-height:1.1;background:rgba(255,255,255,.88);transform:rotate(-10deg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.q{direction:rtl;text-align:center;font-family:Lalezar;line-height:1.25;left:70px;width:940px}
</style></head><body><div id="cam"></div><div id="tag"><span><b>نختصرها لك</b> · قطاع الشركات</span></div>
<script>
const O=0.3;
const BLK='#121214',YEL='#F2C14E',RED='#E5383B',CRM='#F4EAD5',TEAL='#1FA39A';
const SC=[['A',0,4.88,TEAL],['B',4.88,8.18,BLK],['C',8.18,13.46,CRM],['D',13.46,16.46,YEL],['E',16.46,19.34,RED],['F',19.34,22.6,BLK],['Z',22.6,99,BLK]];
const E=[
['A',0,'stamp',`<div class="e t" style="top:220px;font-size:150px;color:#fff">عندك <span class="hl" style="--hc:#111;color:#F2C14E">شركة</span></div>`],
['A',1.42,'up',`<div class="e t" style="top:420px;font-size:110px;color:#111">أو مؤسسة؟</div>`],
['A',2.9,'up',`<div class="e t" style="top:580px;font-size:80px;color:#fff">وتحتاج سيارات لشغلك؟</div>`],
['A',0.4,'slideR',`<img class="e c" src="as/c_tower.png" style="width:380px;left:660px;top:780px">`],
['A',0.2,'pop',`<img class="e c" src="as/c_t_folder.png" style="width:640px;left:80px;top:1000px">`],
['B',4.88,'pop',`<img class="e" src="as/logo_full.png" style="width:760px;left:160px;top:420px">`],
['B',5.72,'up',`<div class="e t" style="top:760px;font-size:100px;color:#fff">عندها خدمة خاصة</div>`],
['B',7.1,'stamp',`<div class="e t" style="top:930px;font-size:170px;color:#F2C14E">للشركات</div>`],
['C',8.18,'slideR',`<img class="e c" src="as/c_sedan.png" style="width:560px;left:470px;top:230px">`],
['C',8.7,'up',`<div class="e lbl" style="left:40px;width:440px;top:330px;font-size:84px;color:#111"><span class="hl">للإدارة</span></div>`],
['C',9.66,'slideL',`<img class="e c" src="as/c_pickup.png" style="width:580px;left:40px;top:720px">`],
['C',10.24,'up',`<div class="e lbl" style="left:620px;width:430px;top:800px;font-size:84px;color:#111"><span class="hl" style="--hc:#1FA39A;color:#fff">للمواقع</span></div>`],
['C',11.24,'slideR',`<img class="e c" src="as/c_bus.png" style="width:560px;left:470px;top:1140px">`],
['C',11.84,'up',`<div class="e lbl" style="left:20px;width:470px;top:1240px;font-size:70px;color:#111">باصات<br><span class="hl" style="--hc:#E5383B;color:#fff">لنقل الموظفين</span></div>`],
['D',13.46,'up',`<div class="e t" style="top:330px;font-size:130px;color:#111">والدفع؟</div>`],
['D',14.28,'stamp',`<div class="e t" style="top:560px;font-size:150px;color:#fff"><span class="hl" style="--hc:#111;color:#F2C14E">كاش أو تمويل</span></div>`],
['D',15.38,'pop',`<div class="e t" style="top:820px;font-size:130px;color:#111">للشركات ✔</div>`],
['E',16.6,'pop',`<img class="e c" src="as/c_order.png" style="width:440px;left:600px;top:420px">`],
['E',17.36,'up',`<div class="e lbl" style="left:600px;width:440px;top:960px;font-size:84px;color:#fff">من الطلب</div>`],
['E',17.7,'draw',`<svg style="left:300px;top:1080px" width="500" height="200"><path d="M480 20 C 380 160, 160 160, 40 60" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1" pathLength="1" stroke-dashoffset="1"/></svg>`],
['E',18.08,'pop',`<img class="e c" src="as/c_keys.png" style="width:440px;left:40px;top:1150px">`],
['E',18.38,'up',`<div class="e lbl" style="left:40px;width:440px;top:1640px;font-size:84px;color:#fff"><span class="hl" style="--hc:#111;color:#F2C14E">إلى التسليم</span></div>`],
['F',19.34,'up',`<div class="e t" style="top:280px;font-size:140px;color:#fff">كلّمنا</div>`],
['F',20.24,'up',`<div class="e t" style="top:470px;font-size:100px;color:#fff">وخلّ <span class="hl" style="--hc:#E5383B">أسطولك علينا</span></div>`],
['F',19.5,'pop',`<img class="e c" src="as/c_t_shake.png" style="width:680px;left:200px;top:950px">`],
['Z',22.6,'pop',`<img class="e" src="as/logo_full.png" style="width:760px;left:160px;top:640px">`],
['Z',22.8,'pop',`<div class="e t" style="top:1000px"><span class="pill">920018915</span></div>`]];
const cam=document.getElementById('cam');
SC.forEach(([id,a,b,bg])=>{const d=document.createElement('div');d.className='sc';d.id='S'+id;d.style.background=bg;d.innerHTML='<div class="noise"></div>';cam.appendChild(d);});
const EL=E.map(([s,at,an,h],i)=>{const w=document.createElement('div');w.innerHTML=h;const el=w.firstElementChild;document.getElementById('S'+s).appendChild(el);return {el,at,an,s,base:el.style.transform||''};});
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-x,3),bo=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function hash(n){return Math.sin(n*127.1)*43758.5453%1}
function render(TT){const t=TT-O; let shake=0, punch=0;
 SC.forEach(([id,a,b])=>{const on=t>=a-0.001&&t<b; document.getElementById('S'+id).style.display=on?'block':'none'; if(on){const k=t-a; shake=Math.max(shake,Math.exp(-k*9)); punch=Math.exp(-k*7);} });
 EL.forEach(({el,at,an})=>{const k=cl((t-at)/0.4); let op=t>=at?1:0, tr='';
  if(an==='up'){tr=`translateY(${(1-eo(k))*80}px)`;op=cl((t-at)/0.2);}
  else if(an==='pop'){tr=`scale(${t<at?0:bo(k)}) rotate(${Math.sin((t-at)*2.4)*1.5}deg)`;}
  else if(an==='stamp'){const kk=cl((t-at)/0.25); tr=`scale(${2.4-1.4*eo(kk)}) rotate(${(1-kk)*12-2}deg)`;op=kk;}
  else if(an==='slideR'){tr=`translateX(${(1-eo(k))*900}px) rotate(${(1-eo(k))*10}deg)`;}
  else if(an==='slideL'){tr=`translateX(${(1-eo(k))*-900}px) rotate(${(1-eo(k))*-10}deg)`;}
  else if(an==='draw'){el.querySelectorAll('path,ellipse').forEach(p=>p.setAttribute('stroke-dashoffset',1-eo(cl((t-at)/0.5))));}
  if(an!=='draw'){el.style.transform=tr;} el.style.opacity=op;
  el.querySelectorAll('.hl').forEach(h=>h.style.setProperty('--hx',eo(cl((t-at-0.15)/0.3))));
  el.querySelectorAll('.lateDraw').forEach(p=>p.setAttribute('stroke-dashoffset',1-eo(cl((t-(+p.dataset.at))/0.4))));
 });
 const sx=Math.sin(t*90)*14*shake, sy=Math.cos(t*77)*10*shake; document.getElementById('tag').style.opacity=t>=22.6?0:1; cam.style.transform=`translate(${sx}px,${sy}px) scale(${1+0.06*punch})`;
}
window.render=render; render(0);
</script></body></html>
