<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0d0c0a;font-family:Tajawal}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.bg{position:absolute;inset:0;background-size:cover}
.dark .bg{background-image:url(as/dark.jpg);filter:sepia(.35) brightness(.55)}
.dark .glow{position:absolute;left:-200px;right:-200px;top:520px;height:900px;background:radial-gradient(ellipse at center,rgba(201,162,77,.22),rgba(0,0,0,0) 60%)}
.cream .bg{background-image:url(as/cream.jpg)}
.hdr{position:absolute;left:0;right:0;top:60px;text-align:center}.hdr img{width:230px}
.ftr{position:absolute;left:120px;right:120px;bottom:70px;display:flex;align-items:center;gap:24px;font-family:Arial;font-weight:700;font-size:30px;letter-spacing:3px}
.ftr i{flex:1;height:2px}
.dark .ftr{color:#C9A24D}.dark .ftr i{background:rgba(201,162,77,.5)}
.cream .ftr{color:#7a5b1e}.cream .ftr i{background:rgba(122,91,30,.4)}
.el{position:absolute;will-change:transform,opacity}
.t{direction:rtl;text-align:center;font-weight:900;line-height:1.05;white-space:nowrap;left:0;right:0}
.dark .t{color:#F7F3EA}.cream .t{color:#121214}
.g{color:#C9A24D!important}
img.c{filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.lb{direction:rtl;text-align:center;font-weight:900;font-size:76px;color:#121214}
.lb span{display:inline-block;background:#121214;color:#C9A24D;padding:6px 34px 2px;border-radius:12px}
.pill{background:#C9A24D;color:#111;border-radius:80px;padding:18px 70px;font-family:Arial;font-weight:900;font-size:76px;letter-spacing:5px}
</style></head><body>

 <div class="el t" id="s3a" style="top:360px;font-size:96px">والمخطّط يحتاج</div>

 <img class="el c" id="s4c1" src="as/c_build.png" style="width:420px;left:590px;top:470px">

 <img class="el c" id="s4c2" src="as/c_finish.png" style="width:440px;left:70px;top:460px">

 <img class="el c" id="s4c3" src="as/c_lamp.png" style="width:330px;left:640px;top:1040px">
 <div class="el lb" id="s4l3" style="left:560px;width:480px;top:1530px"><span>الإضاءة</span></div>

 <img class="el c" id="s6c1" src="as/c_villa.png" style="width:470px;left:560px;top:300px">
 <div class="el lb" id="s6l1" style="left:560px;width:470px;top:760px"><span>فيلا</span></div>
 <img class="el c" id="s6c2" src="as/c_palace.png" style="width:470px;left:50px;top:300px">

 <img class="el" id="s7l" src="as/logo_full.png" style="width:780px;left:150px;top:420px">
 <div class="el t" id="s7a" style="top:900px;font-size:100px">من أوّل فكرة…</div>
 <img class="el" id="s7br" src="as/c_brush.png" style="width:960px;left:60px;top:1050px">
 <div class="el t" id="s7b" style="top:1085px;font-size:118px;color:#111">إلى التسليم</div>
 <div class="el" id="s7p" style="top:1400px;left:0;right:0;text-align:center"><span class="pill">0579277975</span></div>
</div>
<script>
const SC=[['s1',0,3.04],['s2',3.04,5.38],['s3',5.38,10.16],['s4',10.16,15.02],['s5',15.02,18.66],['s6',18.66,21.82],['s7',21.82,99]];
for(const [id] of SC){const s=document.getElementById(id);
 if(id!=='s7'){const h=document.createElement('div');h.className='hdr';h.innerHTML='<img src="as/logo_full.png">';s.appendChild(h);}
 const f=document.createElement('div');f.className='ftr';f.innerHTML='<i></i><span>0579277975</span><i></i>';s.appendChild(f);}
const O=0.3;
const A=[['s1a',0,'up'],['s1br',1.55,'wipe'],['s1b',1.66,'pop'],['s1c',2.0,'slideR'],
['s2a',3.04,'up'],['s2br',4.3,'wipe'],['s2b',4.48,'pop'],['s2c',4.6,'rise'],
['s3a',5.38,'up'],['s3b',6.98,'pop'],['s3c',7.3,'rise'],['s3d',7.76,'up'],
['s4a',10.16,'up'],['s4c1',11.1,'drop'],['s4l1',11.2,'pop'],['s4c2',12.12,'slideL'],['s4l2',12.2,'pop'],['s4c3',13.12,'drop'],['s4l3',13.2,'pop'],['s4c4',14.1,'slideL'],['s4l4',14.2,'pop'],
['s5a',15.02,'up'],['s5br',16.2,'wipe'],['s5b',16.34,'pop'],['s5c',17.1,'up'],['s5d',17.5,'drop'],
['s6c1',18.66,'pop'],['s6l1',18.75,'pop'],['s6c2',19.68,'pop'],['s6l2',19.77,'pop'],['s6c3',20.28,'pop'],['s6l3',20.37,'pop'],['s6c4',21.08,'pop'],['s6l4',21.17,'pop'],
['s7l',21.82,'pop'],['s7a',23.08,'up'],['s7br',24.4,'wipe'],['s7b',24.52,'pop'],['s7p',25.4,'pop']];
const cl=x=>Math.max(0,Math.min(1,x)), eo=x=>1-Math.pow(1-x,3), bo=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function render(t){
 SC.forEach(([id,s,e],i)=>{const el=document.getElementById(id); const S=s+O, E=e+O;
  if(t<S-0.001||t>=E+0.4){el.style.display='none';return;} el.style.display='block';
  const k=cl((t-S)/0.38); const x=(1-eo(k))*1080*(i%2?1:-1); el.style.transform=`translateX(${i===0?0:x}px)`; el.style.zIndex=i;
  el.querySelector('.bg').style.transform=`scale(${1+0.03*cl((t-S)/4)})`;});
 for(const [id,at,ty] of A){const el=document.getElementById(id); const T=at+O; const k=cl((t-T)/0.45);
  let tr='',op=k>0?1:0; const kk=eo(k), kb=bo(k);
  if(ty==='up'){tr=`translateY(${(1-kk)*70}px)`;op=cl((t-T)/0.25);}
  else if(ty==='pop'){tr=`scale(${0.4+0.6*kb})`;op=cl((t-T)/0.15);}
  else if(ty==='drop'){tr=`translateY(${(1-kb)*-500}px) rotate(${(1-kk)*-12}deg)`;op=cl((t-T)/0.1);}
  else if(ty==='slideR'){tr=`translateX(${(1-kk)*1200}px) rotate(${(1-kk)*6}deg)`;}
  else if(ty==='slideL'){tr=`translateX(${(1-kk)*-1200}px) rotate(${(1-kk)*-6}deg)`;}
  else if(ty==='rise'){tr=`translateY(${(1-kk)*500}px) scale(${0.85+0.15*kk})`;op=cl((t-T)/0.3);}
  else if(ty==='wipe'){el.style.clipPath=`inset(0 0 0 ${(1-kk)*100}%)`;tr='';}
  if(k>=1&&['slideR','slideL','rise','drop'].includes(ty)) tr+=` translateY(${Math.sin((t-T)*2.2)*6}px)`;
  el.style.opacity=op; el.style.transform=tr;}
}
window.render=render; render(0);
</script></body></html>
