<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#v{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#vig{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.6))}
#logo{position:absolute;top:70px;left:50%;width:250px;margin-left:-125px;opacity:.9}
.tx{position:absolute;left:0;right:0;bottom:300px;text-align:center;direction:rtl;font-family:Tajawal;color:#fff;opacity:0;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.tx .a{font-weight:300;font-size:64px;letter-spacing:1px}
.tx .b{font-weight:900;font-size:96px;line-height:1.1}
.tx .b span{color:#F2C14E}
.ln{display:block;width:0;height:4px;margin:18px auto 0;background:#F2C14E}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#end{position:absolute;inset:0;background:#0b0b0d;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:80px}
#end .n{font-family:Tajawal;font-weight:900;font-size:110px;color:#111;background:linear-gradient(#f3d77a,#c9a133);padding:14px 60px;border-radius:30px}
</style></head><body>
<img id="v" src="fr1/001.jpg"><div id="vig"></div><img id="logo" src="as/logo.png">
<div class="tx" id="t0"><div class="b">وين ما كان<br><span>مشوارك…</span></div><i class="ln"></i></div>
<div class="tx" id="t1"><div class="a">في</div><div class="b">المدينة</div><i class="ln"></i></div>
<div class="tx" id="t2"><div class="a">في</div><div class="b">البر</div><i class="ln"></i></div>
<div class="tx" id="t3"><div class="a">أو مع</div><div class="b">العايلة</div><i class="ln"></i></div>
<div class="tx" id="t4"><div class="b">سيارتك<br><span>موجودة عندنا</span></div><i class="ln"></i></div>
<div class="tx" id="t5"><div class="b" style="font-size:110px"><span>كاش</span> أو <span>تمويل</span></div><i class="ln"></i></div>
<div id="flash"></div>
<div id="end"><img src="as/logo.png" style="width:780px"><div class="n">920018915</div></div>
<script>
const $=id=>document.getElementById(id);
function E(t,a,d){return Math.max(0,Math.min(1,(t-a)/d))}
function ez(p){return 1-Math.pow(1-p,3)}
const TX=[['t0',0.5,4.6],['t1',5.3,9.6],['t2',10.3,14.6],['t3',15.3,19.6],['t4',20.1,22.2],['t5',22.3,24.8]];
window.render=function(t){
 TX.forEach(([id,a,b])=>{const p=E(t,a,.5)*(1-E(t,b,.35));const e=$(id);e.style.opacity=p;e.style.transform=`translateY(${(1-ez(E(t,a,.6)))*50}px)`;e.style.letterSpacing=`${(1-ez(E(t,a,.8)))*8}px`;e.querySelector('.ln').style.width=ez(E(t,a+.3,.6))*160+'px'});
 // flash on cuts
 let fl=0;[5,10,15,20].forEach(c=>{if(t>=c&&t<c+.25)fl=.55*(1-(t-c)/.25)});$('flash').style.opacity=fl;
 $('logo').style.opacity=.9*(1-E(t,24.8,.3));
 $('end').style.opacity=E(t,24.9,.4);
 const k=Math.min(5,Math.floor(t/5)+1),f=Math.min(151,1+Math.floor((t-(k-1)*5)*30));
 const src=`fr${k}/${String(f).padStart(3,'0')}.jpg`;const v=$('v');if(t>=25.3||v.getAttribute('src')===src)return;
 return new Promise(r=>{v.onload=()=>r();v.src=src});
};
</script></body></html>
