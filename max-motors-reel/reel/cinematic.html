<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Max Motors Cinematic</title>
<style>
  @font-face { font-family: Cairo; src: url(../fonts/Cairo-Black.ttf); font-weight: 900; }
  @font-face { font-family: Cairo; src: url(../fonts/Cairo-Bold.ttf); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  canvas#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }

  .layer { position: absolute; inset: 0; pointer-events: none; }
  #title { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #title .big { font: 900 150px/1.05 Cairo; color: #fff; letter-spacing: 0; text-shadow: 0 10px 50px rgba(0,0,0,.7); white-space: nowrap; }
  #title .big.gold, .gold-text {
    background: linear-gradient(180deg, #fff4c8 0%, #f2cf5b 38%, #c9a227 62%, #8a6a10 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
    filter: drop-shadow(0 8px 30px rgba(0,0,0,.7));
  }
  #title .sub { margin-top: 18px; font: 700 46px/1.3 Cairo; color: rgba(255,255,255,.88); text-shadow: 0 4px 24px rgba(0,0,0,.8); }

  #end { display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  #end img { width: 560px; mix-blend-mode: screen; }
  #end h1 { font: 900 112px/1 Cairo; margin-top: -40px; }
  #end h2 { font: 700 40px/1 Cairo; color: rgba(255,255,255,.75); letter-spacing: 18px; direction: ltr; margin-top: 18px; }
  #end .cta { margin-top: 70px; font: 900 48px/1 Cairo; color: #0a0a0a; padding: 26px 64px 30px; border-radius: 999px;
              background: linear-gradient(135deg, #fff1b8, #f2cf5b 30%, #c9a227 65%, #9c7a14); box-shadow: 0 20px 80px rgba(201,162,39,.5); }
  #end .url { margin-top: 36px; font: 700 40px/1 Cairo; color: #fff; direction: ltr; }

  #corner { position: absolute; top: 120px; left: 0; right: 0; display: flex; justify-content: center; opacity: 0; }
  #corner img { width: 150px; mix-blend-mode: screen; }

  #flash { background: #fff; opacity: 0; mix-blend-mode: screen; }
  #vignette { background: radial-gradient(120% 75% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%),
                         linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 80%, rgba(0,0,0,.45)); }
  #grain { opacity: .08; mix-blend-mode: overlay; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="layer" id="title"><div class="big" id="big"></div><div class="sub" id="sub"></div></div>
  <div class="layer" id="corner"><img src="assets/logo-square.png" alt=""></div>
  <div class="layer" id="end">
    <img src="assets/logo-square.png" alt="">
    <h1 class="gold-text">ماكس موتورز</h1>
    <h2>MAX MOTORS</h2>
    <div class="cta" id="endCta"></div>
    <div class="url" id="endUrl"></div>
  </div>
  <div class="layer" id="vignette"></div>
  <canvas class="layer" id="grain" width="540" height="960"></canvas>
  <div class="layer" id="flash"></div>
</div>

<script type="importmap">
{ "imports": { "three": "../site/vendor/three.module.js", "three/addons/": "../site/vendor/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ================= CONFIG — edit texts here =================
const CONFIG = {
  fps: 30, seconds: 15,
  texts: {
    reveal:   ['مش مجرد سيارة', ''],
    wheel:    ['قوّة', ''],
    lights:   ['حضور', ''],
    drive:    ['أداء', 'يحسّه قلبك قبل رجلك'],
    colors:   ['اختار لونك', ''],
    top:      ['تمويل مرن', 'وتجربة قيادة بضغطة زر'],
  },
  cta: 'احجز تجربة قيادتك',
  url: 'maxmotors.sa',
};
// ============================================================
document.getElementById('endCta').textContent = CONFIG.cta;
document.getElementById('endUrl').textContent = CONFIG.url;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) ** 3;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;

// ---------- renderer ----------
const W = 1080, H = 1920;
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 400);

// ---------- environment (what the paint reflects) ----------
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x020202);
const cubeRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType });
const cubeCam = new THREE.CubeCamera(0.1, 200, cubeRT);
scene.environment = cubeRT.texture;
const glow = (c, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide, toneMapped: false });
function softbox(w, h, c, k) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glow(c, k)); envScene.add(m); return m; }
const topBox = softbox(3, 9, 0xffffff, 2.2); topBox.rotation.x = Math.PI / 2; topBox.position.set(0, 6, 0);
const sideL = softbox(10, 1.2, 0xffe2a8, 1.6); sideL.position.set(-7, 2.2, 0); sideL.rotation.y = Math.PI / 2;
const sideR = softbox(10, 1.2, 0xffffff, 1.2); sideR.position.set(7, 2.2, 0); sideR.rotation.y = -Math.PI / 2;
const sweep = softbox(1.6, 14, 0xfff0d0, 6); sweep.rotation.x = Math.PI / 2;     // moving light bar
const envFloor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ color: 0x050505 }));
envFloor.rotation.x = -Math.PI / 2; envScene.add(envFloor);

// ---------- floor ----------
const mirror = new Reflector(new THREE.CircleGeometry(60, 64), { textureWidth: 1024, textureHeight: 1792, color: 0x55555c });
mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const radial = stops => canvasTex(512, 512, (g) => {
  const gr = g.createRadialGradient(256, 256, 0, 256, 256, 256); stops.forEach(([o, c]) => gr.addColorStop(o, c));
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
});
const fadeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, depthWrite: false, toneMapped: false,
  map: radial([[0, 'rgba(255,255,255,0)'], [0.12, 'rgba(255,255,255,.2)'], [0.4, 'rgba(255,255,255,1)']]) });
const fade = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), fadeMat);
fade.rotation.x = -Math.PI / 2; fade.position.y = 0.003; scene.add(fade);

const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xf2b632).multiplyScalar(2), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  map: radial([[0, 'rgba(255,255,255,0)'], [0.55, 'rgba(255,255,255,0)'], [0.62, 'rgba(255,255,255,1)'], [0.67, 'rgba(255,255,255,.25)'], [0.8, 'rgba(255,255,255,0)']]) });
const ring = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 7.5), ringMat);
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.005; scene.add(ring);

// road markings (scroll to fake driving)
const laneTex = canvasTex(256, 1024, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff'; g.fillRect(118, 0, 20, 560);             // centre dash
  g.fillRect(6, 0, 10, h); g.fillRect(w - 16, 0, 10, h);          // edge lines
});
laneTex.wrapT = THREE.RepeatWrapping; laneTex.repeat.set(1, 14);
const laneMat = new THREE.MeshBasicMaterial({ map: laneTex, color: new THREE.Color(0xfff3d6).multiplyScalar(1.3), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
const lanes = new THREE.Mesh(new THREE.PlaneGeometry(9, 140), laneMat);
lanes.rotation.x = -Math.PI / 2; lanes.position.y = 0.004; scene.add(lanes);

// tunnel light bars overhead + side streaks (in both the visible scene and the reflection env)
const BAR_N = 14, BAR_GAP = 7;
function makeBars(target, k) {
  const g = new THREE.Group();
  for (let i = 0; i < BAR_N; i++) {
    const top = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.08, 0.35), glow(0xfff1d0, k));
    top.position.y = 4.2;
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 2.6), glow(0xf2b632, k * 0.9)); l.position.set(-4.4, 0.5, 0);
    const r = l.clone(); r.position.x = 4.4;
    const bar = new THREE.Group(); bar.add(top, l, r); g.add(bar);
  }
  target.add(g); return g;
}
const barsMain = makeBars(scene, 3), barsEnv = makeBars(envScene, 5);

// ---------- car ----------
const bodyMat = new THREE.MeshPhysicalMaterial({ color: 0x0c0c0e, metalness: 0.9, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.02 });
const detailMat = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, metalness: 1, roughness: 0.22 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x08080a, metalness: 0.3, roughness: 0, transparent: true, opacity: 0.6 });
const capMat = new THREE.MeshStandardMaterial({ color: 0x151517, metalness: 0.8, roughness: 0.3 });
const car = new THREE.Group(); scene.add(car);
let wheels = [], box = new THREE.Box3(), wheelFL = new THREE.Vector3(), lightMats = [];

const draco = new DRACOLoader(); draco.setDecoderPath('../site/vendor/draco/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const ready = Promise.all([
  new Promise((res, rej) => loader.load('../site/assets/car.glb', gltf => {
    const m = gltf.scene.children[0];
    m.getObjectByName('body').material = bodyMat;
    ['rim_fl', 'rim_fr', 'rim_rr', 'rim_rl', 'trim'].forEach(n => m.getObjectByName(n).material = detailMat);
    m.getObjectByName('glass').material = glassMat;
    ['yellow_trim', 'blue'].forEach(n => { const o = m.getObjectByName(n); if (o) o.visible = false; });
    m.traverse(o => {
      if (o.name === 'centre') o.traverse(c => { if (c.isMesh) c.material = capMat; });
      // make head / tail lights glow so bloom catches them
      if (o.isMesh && o.material && /Projector_Glass|Turn_Signal_LED|Taillight_Glass/.test(o.material.name)) {
        const red = /Taillight/.test(o.material.name);
        o.material = new THREE.MeshBasicMaterial({ color: new THREE.Color(red ? 0xff1020 : 0xfff6e8), toneMapped: false });
        lightMats.push({ mat: o.material, base: o.material.color.clone() });
      }
    });
    wheels = ['wheel_fl', 'wheel_fr', 'wheel_rl', 'wheel_rr'].map(n => m.getObjectByName(n));
    const ao = new THREE.TextureLoader().load('../site/assets/ao.png');
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.655 * 4, 1.3 * 4),
      new THREE.MeshBasicMaterial({ map: ao, blending: THREE.MultiplyBlending, toneMapped: false, transparent: true }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.006; shadow.renderOrder = 2; m.add(shadow);
    car.add(m);
    car.updateMatrixWorld(true);
    box.setFromObject(m);
    wheels[0].getWorldPosition(wheelFL);
    res();
  }, undefined, rej)),
  document.fonts.load('900 100px Cairo'), document.fonts.load('700 40px Cairo'),
]);

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.6, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- shot helpers ----------
// car front points to -z; spherical camera around a target
function orbit(azDeg, elDeg, dist, target = [0, 0.6, 0]) {
  const A = THREE.MathUtils.degToRad(azDeg), E = THREE.MathUtils.degToRad(elDeg);
  camera.position.set(target[0] + Math.sin(A) * Math.cos(E) * dist, target[1] + Math.sin(E) * dist, target[2] + Math.cos(A) * Math.cos(E) * dist);
  camera.lookAt(...target);
}
const PAINT = { black: 0x0c0c0e, white: 0xe9e7e2, blue: 0x0f2a6b, red: 0x8f0d14, silver: 0x8a8d92, gold: 0xa8801f };

let roadDist = 0;
function world({ paint = 'black', road = 0, speed = 0, sweepZ = null, exposure = 1, ringK = 0, bars = 0, lights = 1, fov = 30 }) {
  bodyMat.color.set(PAINT[paint] ?? paint);
  renderer.toneMappingExposure = exposure;
  camera.fov = fov; camera.updateProjectionMatrix();
  lanes.visible = road > 0; laneMat.opacity = road;
  laneTex.offset.y = roadDist / 10;
  for (const w of wheels) w.rotation.x = -roadDist / 0.33;
  [barsMain, barsEnv].forEach(g => {
    g.visible = bars > 0;
    g.children.forEach((b, i) => { b.position.z = ((i * BAR_GAP + roadDist) % (BAR_N * BAR_GAP)) - BAR_N * BAR_GAP / 2; });
  });
  sweep.visible = sweepZ !== null; if (sweepZ !== null) sweep.position.set(0, 4.5, sweepZ);
  topBox.visible = sideL.visible = sideR.visible = bars === 0;
  ring.visible = ringK > 0; ringMat.opacity = ringK;
  lightMats.forEach(({ mat, base }) => mat.color.copy(base).multiplyScalar(lights));
  // gentle body bob when "driving"
  car.position.y = speed > 0 ? Math.sin(roadDist * 1.7) * 0.006 : 0;
}

// ---------- the edit ----------
// each shot: [start s, end s, fn(u 0..1, localSeconds)]; road distance accumulates by speed
const SHOTS = [
  // 1. dark reveal: light bar sweeps across a black car, side profile
  [0.0, 2.0, 'reveal', u => {
    world({ sweepZ: lerp(9, -9, easeInOut(u)), exposure: lerp(0.35, 1.0, smooth(0, .5, u)), lights: smooth(.55, .75, u) * 1.4 });
    orbit(lerp(262, 278, u), 3, lerp(8.6, 7.6, u), [0, 0.55, 0]);
  }],
  // 2. front wheel close-up, rolling
  [2.0, 3.4, 'wheel', u => {
    world({ road: 1, speed: 26, bars: 1, exposure: 1.1 });
    const c = wheelFL;
    camera.position.set(c.x - 1.35, 0.32, c.z - lerp(0.9, 0.2, u));
    camera.lookAt(c.x, c.y, c.z + 0.1);
    camera.fov = 34; camera.updateProjectionMatrix();
  }],
  // 3. headlight push-in, low front
  [3.4, 4.8, 'lights', u => {
    world({ sweepZ: lerp(-6, 4, u), exposure: 1.05, lights: 2.2, fov: 26 });
    orbit(lerp(206, 196, u), lerp(2, 5, u), lerp(4.4, 3.5, easeOut(u)), [0.55, 0.62, box.min.z + 0.4]);
  }],
  // 4. driving through the light tunnel, tracking front 3/4 then whip around
  [4.8, 7.6, 'drive', u => {
    world({ road: 1, speed: 34, bars: 1, exposure: 1.15, lights: 2, fov: lerp(28, 36, u) });
    orbit(lerp(212, 140, easeInOut(u)), lerp(4, 9, u), lerp(7.6, 6.6, u), [0, 0.5, 0]);
  }],
  // 5. colour cuts, side profile, beat-synced
  [7.6, 9.6, 'colors', (u, s) => {
    const seq = ['white', 'blue', 'red', 'silver', 'gold'];
    const i = Math.min(seq.length - 1, Math.floor(u * seq.length));
    world({ paint: seq[i], sweepZ: lerp(5, -5, (u * seq.length) % 1), exposure: 1.05, ringK: 0.8 });
    orbit(90 + i * 4 + ((u * seq.length) % 1) * 6, 3, 8.2, [0, 0.55, 0]);
  }],
  // 6. top-down spin with gold ring
  [9.6, 11.4, 'top', u => {
    world({ paint: 'gold', exposure: 1.05, ringK: 1, sweepZ: lerp(-6, 6, u) });
    camera.position.set(0, lerp(11, 9.5, u), 0.001); camera.up.set(Math.sin(u * 1.6 + .4), 0, Math.cos(u * 1.6 + .4));
    camera.lookAt(0, 0, 0); camera.fov = 34; camera.updateProjectionMatrix();
  }],
  // 7. end card: car front, darkening behind the logo
  [11.4, 15.01, 'end', u => {
    world({ paint: 'gold', exposure: lerp(1, 0.45, smooth(0.05, 0.5, u)), ringK: 1, lights: 2, sweepZ: lerp(-5, 5, u) });
    orbit(180, lerp(6, 3, u), lerp(9.5, 8.5, u), [0, 0.55, 0]);
  }],
];
const CUTS = SHOTS.slice(1).map(s => s[0]).concat([7.6 + 0.4, 7.6 + 0.8, 7.6 + 1.2, 7.6 + 1.6]);

const big = document.getElementById('big'), sub = document.getElementById('sub');
const titleL = document.getElementById('title'), endL = document.getElementById('end'), cornerL = document.getElementById('corner');
const flash = document.getElementById('flash'), frameEl = document.getElementById('frame');
const grain = document.getElementById('grain'), gg = grain.getContext('2d'), gImg = gg.createImageData(540, 960);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function textFor(id, s, dur) {
  const [a, b] = CONFIG.texts[id] || ['', ''];
  if (big.textContent !== a) big.textContent = a;
  if (sub.textContent !== b) sub.textContent = b;
  big.className = 'big' + (id === 'drive' || id === 'top' ? ' gold' : '');
  // slam in, hold, quick out
  const inT = easeOut(smooth(0.08, 0.32, s)), outT = smooth(dur - 0.22, dur - 0.04, s);
  const v = inT * (1 - outT);
  titleL.style.opacity = a ? v : 0;
  big.style.transform = `scale(${lerp(1.5, 1, inT) + s * 0.03})`;
  big.style.filter = `blur(${(1 - inT) * 14}px)`;
  sub.style.opacity = smooth(0.35, 0.6, s) * (1 - outT);
  sub.style.transform = `translateY(${(1 - smooth(0.35, 0.6, s)) * 30}px)`;
  titleL.style.justifyContent = id === 'top' ? 'flex-end' : (id === 'wheel' || id === 'colors' ? 'flex-start' : 'center');
  titleL.style.padding = id === 'top' ? '0 0 300px' : (id === 'wheel' || id === 'colors' ? '330px 0 0' : '0 0 760px');
}

window.__setFrame = (f) => {
  const t = f / CONFIG.fps;
  // integrate road distance up to t (deterministic per frame)
  roadDist = 0;
  for (const [a, b, id] of SHOTS) {
    const sp = id === 'wheel' ? 26 : id === 'drive' ? 34 : 0;
    roadDist += sp * Math.max(0, Math.min(t, b) - a);
  }
  camera.up.set(0, 1, 0);
  const shot = SHOTS.find(s => t >= s[0] && t < s[1]) || SHOTS[SHOTS.length - 1];
  const [a, b, id, fn] = shot, u = clamp((t - a) / (b - a)), s = t - a;
  fn(u, s);

  // hit shake right after each cut
  const since = Math.min(...CUTS.map(c => (t >= c ? t - c : 99)));
  const shake = Math.exp(-since * 9) * 0.05;
  camera.position.x += Math.sin(t * 91) * shake; camera.position.y += Math.cos(t * 77) * shake;

  // reflections: render env without the car
  car.visible = false; cubeCam.position.set(0, 0.7, 0); cubeCam.update(renderer, envScene); car.visible = true;
  composer.render();

  // overlays
  if (id === 'end') {
    titleL.style.opacity = 0;
    const e = smooth(0.12, 0.35, u);
    endL.style.opacity = e;
    endL.style.transform = `scale(${lerp(1.15, 1, easeOut(e)) + u * 0.02})`;
    endL.style.filter = `blur(${(1 - e) * 10}px)`;
    cornerL.style.opacity = 0;
  } else {
    endL.style.opacity = 0; textFor(id, s, b - a);
    cornerL.style.opacity = id === 'reveal' ? smooth(0.6, 1.0, s) * 0.9 : 0.9;
  }
  flash.style.opacity = Math.max(0, 0.85 - since * 9) + (id === 'end' ? Math.max(0, 0.5 - (t - a) * 4) * 0 : 0);
  frameEl.style.transform = `scale(${1 + Math.exp(-since * 8) * 0.03})`;

  if (f % 2 === 0) { const d = gImg.data; for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = rnd() * 255; d[i + 3] = 255; } gg.putImageData(gImg, 0, 0); }
};

window.__ready = ready.then(() => window.__setFrame(0));
</script>
</body>
</html>
